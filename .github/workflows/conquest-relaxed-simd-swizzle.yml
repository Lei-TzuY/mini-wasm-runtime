name: Conquest relaxed SIMD swizzle

on:
  push:
    branches:
      - conquest/relaxed-simd-swizzle

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          sed -i 's/signed\/unsigned integer-to-f32\/f64 lanes/signed\/unsigned integer-to-float lanes, the f64x2 low-lane conversion forms/' .conquest/apply_relaxed_simd_swizzle.py
          python3 .conquest/apply_relaxed_simd_swizzle.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
      - name: Verify construction files are the only staged helpers
        run: |
          git status --short
          test -f crates/wasm-runtime/tests/simd_relaxed_swizzle.rs
          test -f differential/tests/simd_relaxed_swizzle.rs
      - name: Commit clean candidate
        env:
          BRANCH: conquest/relaxed-simd-swizzle
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_relaxed_swizzle.rs differential/tests/simd_relaxed_swizzle.rs docs/roadmap.md
          git rm .conquest/apply_relaxed_simd_swizzle.py .github/workflows/conquest-relaxed-simd-swizzle.yml
          git commit -m "feat: add relaxed SIMD swizzle semantics"
          git push origin HEAD:$BRANCH
