name: Conquest relaxed SIMD swizzle

on:
  push:
    branches:
      - conquest/relaxed-simd-swizzle

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.conquest/apply_relaxed_simd_swizzle.py')
          text = path.read_text()
          old = 'needle = "- SIMD terminal conversions (subopcodes 248-255) are executable across saturating f32/f64-to-i32 lanes, signed/unsigned integer-to-f32/f64 lanes, structured-control scanning, focused regressions, and Wasmtime differential coverage; relaxed-SIMD subopcode 256 remains fail-closed."'
          new = 'needle = "- SIMD terminal conversions (subopcodes 248-255) are executable across saturating f32/f64-to-i32 lanes, signed/unsigned integer-to-float lanes, the f64x2 low-lane conversion forms, typed validation, structured-control scanning, focused regressions, and Wasmtime differential coverage; relaxed-SIMD subopcode 256 remains fail-closed."'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one generator roadmap needle, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          set -o pipefail
          python3 .conquest/apply_relaxed_simd_swizzle.py 2>&1 | tee apply.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          tests = Path("crates/wasm-runtime/tests")
          for path in tests.glob("simd_*.rs"):
              if path.name == "simd_relaxed_swizzle.rs":
                  continue
              text = path.read_text()
              if "subopcode: 256" not in text:
                  continue
              text = text.replace("subopcode: 256", "subopcode: 257")
              text = re.sub(r"(simd\([^,\n]+,\s*)256(\);)", r"\g<1>257\2", text)
              lines = []
              for line in text.splitlines(keepends=True):
                  if line.lstrip().startswith("fn ") and "frontier" in line and "256" in line:
                      line = line.replace("256", "257")
                  lines.append(line)
              path.write_text("".join(lines))
          PY
          cargo fmt --all
      - name: Upload apply diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relaxed-simd-apply-log
          path: apply.log
          if-no-files-found: warn
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-features
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
      - name: Verify construction files are the only staged helpers
        run: |
          git status --short
          test -f crates/wasm-runtime/tests/simd_relaxed_swizzle.rs
          test -f differential/tests/simd_relaxed_swizzle.rs
      - name: Commit clean candidate
        env:
          BRANCH: conquest/relaxed-simd-swizzle
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_*.rs differential/tests/simd_relaxed_swizzle.rs docs/roadmap.md
          git rm -f .conquest/apply_relaxed_simd_swizzle.py .github/workflows/conquest-relaxed-simd-swizzle.yml
          git commit -m "feat: add relaxed SIMD swizzle semantics"
          git push origin HEAD:$BRANCH
