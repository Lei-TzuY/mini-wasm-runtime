name: Phase 6 parser allocation-bomb PR gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  parser-allocation-bomb-gate:
    if: github.head_ref == 'fix/phase-6-parser-allocation-bombs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phase-6-parser-allocation-bombs
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply allocation-bomb hardening and validate
        shell: bash
        run: |
          python3 scripts/phase6_parser_allocation_bombs.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gate
        shell: bash
        run: |
          rm .github/workflows/phase6-parser-allocation-bombs-pr-gate.yml
          rm scripts/phase6_parser_allocation_bombs.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-parser/src/lib.rs crates/wasm-parser/tests/allocation_bomb_corpus.rs .github/workflows/phase6-parser-allocation-bombs-pr-gate.yml scripts/phase6_parser_allocation_bombs.py
          git commit -m "fix: avoid untrusted-count parser preallocation"
          git push origin HEAD:fix/phase-6-parser-allocation-bombs
