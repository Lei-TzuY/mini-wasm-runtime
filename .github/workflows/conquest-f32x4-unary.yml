name: Conquest f32x4 unary

on:
  push:
    branches: [conquest/simd-f32x4-unary]

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply f32x4 unary vertical slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('crates/wasm-runtime/src/lib.rs')
          text = runtime.read_text()
          anchor = '''        220..=223 => {\n            let rhs = numeric::v128_from_stack(stack)?;\n            let lhs = numeric::v128_from_stack(stack)?;\n            let source_start = if matches!(subopcode, 220 | 222) { 0 } else { 2 };\n            let signed = matches!(subopcode, 220 | 221);\n            let mut result = [0u8; 16];\n            for output_lane in 0..2 {\n                let source_lane = source_start + output_lane;\n                let start = source_lane * 4;\n                let lhs_raw =\n                    u32::from_le_bytes(lhs[start..start + 4].try_into().expect("i32x4 lane width"));\n                let rhs_raw =\n                    u32::from_le_bytes(rhs[start..start + 4].try_into().expect("i32x4 lane width"));\n                let product = if signed {\n                    (i64::from(lhs_raw as i32) * i64::from(rhs_raw as i32)) as u64\n                } else {\n                    u64::from(lhs_raw) * u64::from(rhs_raw)\n                };\n                let output_start = output_lane * 8;\n                result[output_start..output_start + 8].copy_from_slice(&product.to_le_bytes());\n            }\n            stack.push(Value::V128(Rc::new(result)));\n        }\n'''
          insert = anchor + '''        224 | 225 | 227 => {\n            let value = numeric::v128_from_stack(stack)?;\n            let mut result = [0u8; 16];\n            for lane in 0..4 {\n                let start = lane * 4;\n                let bits = u32::from_le_bytes(\n                    value[start..start + 4]\n                        .try_into()\n                        .expect("f32x4 lane width"),\n                );\n                let output = match subopcode {\n                    224 => bits & 0x7fff_ffff,\n                    225 => bits ^ 0x8000_0000,\n                    227 => f32::from_bits(bits).sqrt().to_bits(),\n                    _ => unreachable!("matched f32x4 unary opcode"),\n                };\n                result[start..start + 4].copy_from_slice(&output.to_le_bytes());\n            }\n            stack.push(Value::V128(Rc::new(result)));\n        }\n'''
          if 'matched f32x4 unary opcode' not in text:
              if anchor not in text:
                  raise SystemExit('runtime execution anchor not found')
              text = text.replace(anchor, insert, 1)
          scan_old = '''                    | 214..=219\n                    | 220..=223\n                    | 142'''
          scan_new = '''                    | 214..=219\n                    | 220..=223\n                    | 224\n                    | 225\n                    | 227\n                    | 142'''
          if scan_new not in text:
              if scan_old not in text:
                  raise SystemExit('runtime control scanner anchor not found')
              text = text.replace(scan_old, scan_new, 1)
          runtime.write_text(text)

          validator = Path('crates/wasm-validator/src/typed.rs')
          text = validator.read_text()
          old = '''                    96 | 97 | 98 | 128 | 129 => {\n                        pop_expect(&mut stack, &controls, ValueType::V128, function, offset)?;\n                        stack.push(ValueType::V128);\n                    }'''
          new = '''                    96 | 97 | 98 | 128 | 129 | 224 | 225 | 227 => {\n                        pop_expect(&mut stack, &controls, ValueType::V128, function, offset)?;\n                        stack.push(ValueType::V128);\n                    }'''
          if new not in text:
              if old not in text:
                  raise SystemExit('validator unary anchor not found')
              text = text.replace(old, new, 1)
          validator.write_text(text)

          extmul = Path('crates/wasm-runtime/tests/simd_i64x2_extmul.rs')
          text = extmul.read_text()
          old = '''#[test]\nfn adjacent_f32x4_frontier_remains_fail_closed() {\n    let mut instructions = Vec::new();\n    push_i32x4_const(&mut instructions, [1, 2, 3, 4]);\n    push_simd(&mut instructions, 224);\n    let parsed = parse_module(&module(&instructions)).expect("fixture parses");\n    assert!(matches!(\n        Instance::new(parsed),\n        Err(RuntimeError::Validation(\n            ValidationError::UnsupportedPrefixedOpcode {\n                prefix: 0xfd,\n                subopcode: 224,\n                ..\n            }\n        ))\n    ));\n}\n'''
          new = '''#[test]\nfn adjacent_f32x4_binary_frontier_remains_fail_closed() {\n    let mut instructions = Vec::new();\n    push_i32x4_const(&mut instructions, [1, 2, 3, 4]);\n    push_i32x4_const(&mut instructions, [5, 6, 7, 8]);\n    push_simd(&mut instructions, 228);\n    let parsed = parse_module(&module(&instructions)).expect("fixture parses");\n    assert!(matches!(\n        Instance::new(parsed),\n        Err(RuntimeError::Validation(\n            ValidationError::UnsupportedPrefixedOpcode {\n                prefix: 0xfd,\n                subopcode: 228,\n                ..\n            }\n        ))\n    ));\n}\n'''
          if 'adjacent_f32x4_binary_frontier_remains_fail_closed' not in text:
              if old not in text:
                  raise SystemExit('extmul frontier anchor not found')
              text = text.replace(old, new, 1)
          extmul.write_text(text)

          Path('crates/wasm-runtime/tests/simd_f32x4_unary.rs').write_text(r'''use wasm_parser::parse_module;
use wasm_runtime::{Instance, RuntimeError, Value};
use wasm_validator::ValidationError;

fn push_u32(bytes: &mut Vec<u8>, mut value: u32) {
    loop {
        let mut byte = (value & 0x7f) as u8;
        value >>= 7;
        if value != 0 { byte |= 0x80; }
        bytes.push(byte);
        if value == 0 { break; }
    }
}
fn push_section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
    module.push(id);
    push_u32(module, payload.len() as u32);
    module.extend_from_slice(payload);
}
fn module(instructions: &[u8]) -> Vec<u8> {
    let mut bytes = vec![0x00, 0x61, 0x73, 0x6d, 0x01, 0, 0, 0];
    push_section(&mut bytes, 1, &[0x01, 0x60, 0x00, 0x01, 0x7f]);
    push_section(&mut bytes, 3, &[0x01, 0x00]);
    push_section(&mut bytes, 5, &[0x01, 0x00, 0x01]);
    push_section(&mut bytes, 7, &[0x01, 0x03, b'r', b'u', b'n', 0x00, 0x00]);
    let mut body = vec![0x00];
    body.extend_from_slice(instructions);
    body.push(0x0b);
    let mut code = vec![0x01];
    push_u32(&mut code, body.len() as u32);
    code.extend(body);
    push_section(&mut bytes, 10, &code);
    bytes
}
fn push_simd(i: &mut Vec<u8>, sub: u32) { i.push(0xfd); push_u32(i, sub); }
fn push_f32x4_const(i: &mut Vec<u8>, lanes: [f32; 4]) {
    push_simd(i, 12);
    for lane in lanes { i.extend_from_slice(&lane.to_bits().to_le_bytes()); }
}
fn push_i32_const(i: &mut Vec<u8>, value: i32) { i.extend_from_slice(&[0x41, value as u8]); }
fn push_v128_store(i: &mut Vec<u8>) { push_simd(i, 11); i.extend_from_slice(&[4, 0]); }
fn push_i32_load(i: &mut Vec<u8>, offset: u32) { i.push(0x28); i.push(2); push_u32(i, offset); }
fn lane_bits(input: [f32; 4], subopcode: u32, lane: u32) -> u32 {
    let mut instructions = Vec::new();
    instructions.extend_from_slice(&[0x02, 0x40]);
    push_f32x4_const(&mut instructions, input);
    push_simd(&mut instructions, subopcode);
    instructions.push(0x1a);
    instructions.push(0x0b);
    push_i32_const(&mut instructions, 0);
    push_f32x4_const(&mut instructions, input);
    push_simd(&mut instructions, subopcode);
    push_v128_store(&mut instructions);
    push_i32_const(&mut instructions, 0);
    push_i32_load(&mut instructions, lane * 4);
    let parsed = parse_module(&module(&instructions)).expect("fixture parses");
    let mut instance = Instance::new(parsed).expect("fixture validates");
    match instance.invoke_export_values("run", &[]).expect("fixture executes").as_slice() {
        [Value::I32(value)] => *value as u32,
        other => panic!("unexpected f32x4 unary result: {other:?}"),
    }
}
#[test]
fn f32x4_abs_neg_and_sqrt_are_lane_exact_for_finite_values() {
    let input = [-0.0, -1.5, 9.0, 16.0];
    assert_eq!(lane_bits(input, 224, 0), 0.0f32.to_bits());
    assert_eq!(lane_bits(input, 224, 1), 1.5f32.to_bits());
    assert_eq!(lane_bits(input, 225, 0), 0.0f32.to_bits());
    assert_eq!(lane_bits([0.0, 1.5, -9.0, -16.0], 225, 0), (-0.0f32).to_bits());
    assert_eq!(lane_bits(input, 227, 2), 3.0f32.to_bits());
    assert_eq!(lane_bits(input, 227, 3), 4.0f32.to_bits());
}
#[test]
fn validator_rejects_f32x4_unary_type_confusion() {
    let instructions = vec![0x41, 0x01, 0xfd, 0xe0, 0x01];
    let parsed = parse_module(&module(&instructions)).expect("fixture parses");
    assert!(matches!(
        Instance::new(parsed),
        Err(RuntimeError::Validation(ValidationError::TypeMismatch { .. }))
    ));
}
#[test]
fn adjacent_f32x4_binary_frontier_remains_fail_closed() {
    let mut instructions = Vec::new();
    push_f32x4_const(&mut instructions, [1.0, 2.0, 3.0, 4.0]);
    push_f32x4_const(&mut instructions, [5.0, 6.0, 7.0, 8.0]);
    push_simd(&mut instructions, 228);
    let parsed = parse_module(&module(&instructions)).expect("fixture parses");
    assert!(matches!(
        Instance::new(parsed),
        Err(RuntimeError::Validation(ValidationError::UnsupportedPrefixedOpcode {
            prefix: 0xfd,
            subopcode: 228,
            ..
        }))
    ));
}
''')

          Path('differential/tests/simd_f32x4_unary.rs').write_text(r'''use wasm_parser::parse_module;
use wasm_runtime::{Instance as MiniInstance, Value};
use wasmtime::{Config, Engine, Instance as ReferenceInstance, Module as ReferenceModule, Store};

const FIXTURE: &str = r#"(module
  (memory 1)
  (func (export "abs") (result i32)
    i32.const 0
    v128.const f32x4 -0.0 -1.5 9 16
    f32x4.abs
    v128.store
    i32.const 0
    i32.load offset=4)
  (func (export "neg") (result i32)
    i32.const 0
    v128.const f32x4 0.0 1.5 -9 -16
    f32x4.neg
    v128.store
    i32.const 0
    i32.load)
  (func (export "sqrt") (result i32)
    i32.const 0
    v128.const f32x4 1 4 9 16
    f32x4.sqrt
    v128.store
    i32.const 0
    i32.load offset=8))"#;
const EXPORTS: [&str; 3] = ["abs", "neg", "sqrt"];
fn mini_trace(bytes: &[u8]) -> Vec<i32> {
    let module = parse_module(bytes).expect("mini parse");
    let mut instance = MiniInstance::new(module).expect("mini instantiate");
    EXPORTS.into_iter().map(|export| match instance.invoke_export_values(export, &[]).expect("mini execution").as_slice() {
        [Value::I32(value)] => *value,
        other => panic!("unexpected mini result for {export}: {other:?}"),
    }).collect()
}
fn reference_trace(bytes: &[u8]) -> Vec<i32> {
    let mut config = Config::new();
    config.wasm_simd(true);
    let engine = Engine::new(&config).expect("SIMD engine");
    let module = ReferenceModule::new(&engine, bytes).expect("Wasmtime compile");
    let mut store = Store::new(&engine, ());
    let instance = ReferenceInstance::new(&mut store, &module, &[]).expect("instantiate");
    EXPORTS.into_iter().map(|export| instance.get_typed_func::<(), i32>(&mut store, export).expect("signature").call(&mut store, ()).expect("reference execution")).collect()
}
#[test]
fn f32x4_unary_matches_wasmtime_reference() {
    let bytes = wat::parse_str(FIXTURE).expect("fixture parse");
    let mini = mini_trace(&bytes);
    let reference = reference_trace(&bytes);
    assert_eq!(mini, reference);
    assert_eq!(mini[0] as u32, 1.5f32.to_bits());
    assert_eq!(mini[1] as u32, (-0.0f32).to_bits());
    assert_eq!(mini[2] as u32, 3.0f32.to_bits());
}
''')

          roadmap = Path('docs/roadmap.md')
          text = roadmap.read_text()
          marker = '- SIMD `i64x2` comparisons are executable for `eq`, `ne`, `lt_s`, `gt_s`, `le_s`, and `ge_s`, producing canonical all-ones/zero lane masks with signed ordering, typed validation, structured-control scanning, regressions, and Wasmtime differential coverage.\n'
          addition = marker + '- SIMD `f32x4` unary numeric semantics are executable for `abs`, `neg`, and `sqrt`, with bit-exact sign manipulation for `abs`/`neg`, lane-wise square root, exact `v128 -> v128` validation, structured-control scanning, regressions, and Wasmtime differential coverage.\n'
          if 'SIMD `f32x4` unary numeric semantics are executable' not in text:
              if marker not in text:
                  raise SystemExit('roadmap anchor not found')
              text = text.replace(marker, addition, 1)
          roadmap.write_text(text)
          PY
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
      - name: Main workspace checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Differential checks
        run: |
          cargo fmt --manifest-path differential/Cargo.toml -- --check
          cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path differential/Cargo.toml -- --nocapture
      - name: Build clean candidate
        shell: bash
        run: |
          rm .github/workflows/conquest-f32x4-unary.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_i64x2_extmul.rs crates/wasm-runtime/tests/simd_f32x4_unary.rs differential/tests/simd_f32x4_unary.rs docs/roadmap.md .github/workflows/conquest-f32x4-unary.yml
          git commit -m 'feat: add SIMD f32x4 unary semantics'
          git push origin HEAD:conquest/simd-f32x4-unary
