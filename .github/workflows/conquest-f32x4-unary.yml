name: Conquest f32x4 unary

on:
  push:
    branches:
      - conquest/simd-f32x4-unary

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply implementation
        run: python3 .conquest/f32x4_unary.py
      - name: Migrate stale f32x4 fail-closed frontiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('crates/wasm-runtime/tests').glob('*.rs'):
              text = path.read_text()
              marker = 'fn adjacent_f32x4_frontier_remains_fail_closed()'
              if marker not in text:
                  continue
              start = text.index(marker)
              end = text.find('\n}\n', start)
              if end < 0:
                  raise SystemExit(f'unterminated stale frontier test in {path}')
              end += 3
              block = text[start:end]
              if 'subopcode: 224' not in block:
                  raise SystemExit(f'unexpected stale frontier assertion in {path}')
              block = block.replace('adjacent_f32x4_frontier_remains_fail_closed', 'adjacent_f32x4_binary_frontier_remains_fail_closed', 1)
              block = block.replace('push_simd(&mut instructions, 224)', 'push_simd(&mut instructions, 228)')
              block = block.replace('subopcode: 224', 'subopcode: 228')
              text = text[:start] + block + text[end:]
              path.write_text(text)
          PY
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
      - name: Rustfmt check
        run: cargo fmt --all -- --check
      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Workspace docs
        run: cargo doc --workspace --no-deps
      - name: Differential formatting
        run: cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Differential Clippy
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml -- --nocapture
      - name: Build clean candidate
        run: |
          rm -rf .conquest .github/workflows/conquest-f32x4-unary.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m 'feat: add SIMD f32x4 unary semantics'
          git push origin HEAD:conquest/simd-f32x4-unary
