name: Conquest f32x4 unary

on:
  push:
    branches:
      - conquest/simd-f32x4-unary

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply implementation
        run: python3 .conquest/f32x4_unary.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
      - name: Main workspace checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Differential checks
        run: |
          cargo fmt --manifest-path differential/Cargo.toml -- --check
          cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path differential/Cargo.toml -- --nocapture
      - name: Build clean candidate
        run: |
          rm -rf .conquest .github/workflows/conquest-f32x4-unary.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m 'feat: add SIMD f32x4 unary semantics'
          git push origin HEAD:conquest/simd-f32x4-unary
