name: Construction format i16x8 differential

on:
  push:
    branches:
      - conquest/simd-i16x8-comparisons

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format differential fixture
        run: cargo fmt --manifest-path differential/Cargo.toml
      - name: Verify differential format
        run: cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Commit formatted fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add differential/tests/simd_i16x8_comparisons.rs
          git diff --cached --quiet && exit 0
          git commit -m "style: format i16x8 comparison differential"
          git push origin HEAD:conquest/simd-i16x8-comparisons
