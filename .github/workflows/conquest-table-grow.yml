name: Conquest table.grow staging
on:
  push:
    branches: [conquest/table-grow]
permissions:
  contents: write
jobs:
  stage:
    if: github.ref_name == 'conquest/table-grow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/table-grow
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Apply implementation
        run: python tools/apply_table_grow.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - name: Publish clean candidate
        run: |
          rm tools/apply_table_grow.py .github/workflows/conquest-table-grow.yml
          rm -f Cargo.lock
          git add -A
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git commit -m 'feat: add executable table.grow'
          git push origin HEAD:conquest/table-grow
