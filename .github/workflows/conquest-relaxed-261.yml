name: Conquest relaxed SIMD 261

on:
  push:
    branches:
      - conquest/relaxed-simd-f32x4-madd-261

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 261 vertical slice
        run: python3 tools/conquest_relaxed_261.py
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Workspace docs
        run: cargo doc --workspace --no-deps
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_madd_f32x4 -- --nocapture
      - name: Promote clean candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/conquest-relaxed-261.yml tools/conquest_relaxed_261.py
          git add -A
          git commit -m "feat: add relaxed SIMD f32x4 madd"
          git push origin HEAD:${GITHUB_REF_NAME}
