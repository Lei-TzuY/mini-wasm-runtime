name: construction-fd-allocate

on:
  push:
    branches:
      - conquest/wasi-fd-allocate

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format root workspace
        run: cargo fmt --all
      - name: Format differential workspace
        if: ${{ hashFiles('differential/tests/wasi_fd_allocate.rs') != '' }}
        run: cargo fmt --manifest-path differential/Cargo.toml
      - name: Diff hygiene
        run: git diff --check
      - name: Focused fd_allocate regressions
        run: cargo test -p wasm-wasi --test fd_allocate -- --nocapture
      - name: Existing descriptor filesystem regressions
        run: |
          cargo test -p wasm-wasi --test fd_fdstat_get -- --nocapture
          cargo test -p wasm-wasi --test fd_filestat_set_size -- --nocapture
          cargo test -p wasm-wasi --test writable_files -- --nocapture
          cargo test -p wasm-wasi --test fd_pread -- --nocapture
      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Workspace docs
        run: cargo doc --workspace --no-deps
      - name: Clippy differential workspace
        if: ${{ hashFiles('differential/tests/wasi_fd_allocate.rs') != '' }}
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Focused fd_allocate reference evidence
        if: ${{ hashFiles('differential/tests/wasi_fd_allocate.rs') != '' }}
        run: cargo test --manifest-path differential/Cargo.toml --test wasi_fd_allocate -- --nocapture
      - name: Full differential workspace
        if: ${{ hashFiles('differential/tests/wasi_fd_allocate.rs') != '' }}
        run: cargo test --manifest-path differential/Cargo.toml -- --nocapture
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-wasi/tests/fd_allocate.rs differential/tests/wasi_fd_allocate.rs 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: canonicalize fd_allocate evidence"
          git push origin HEAD:conquest/wasi-fd-allocate
