name: Phase 5B validator test update

on:
  push:
    branches:
      - feat/phase-5b-numeric-types

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update superseded validator expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/wasm-validator/src/lib.rs')
          s = p.read_text()
          old = '''    #[test]\n    fn rejects_non_i32_execution_types() {\n        let mut module = valid_module();\n        module.types[0].params[0] = ValueType::I64;\n        assert_eq!(\n            validate(&module),\n            Err(ValidationError::UnsupportedValueType {\n                function: 0,\n                value_type: ValueType::I64,\n            })\n        );\n    }\n'''
          new = '''    #[test]\n    fn accepts_non_i32_execution_types() {\n        let mut module = valid_module();\n        module.types[0].params[0] = ValueType::I64;\n        module.types[0].results[0] = ValueType::I64;\n        assert_eq!(validate(&module), Ok(()));\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('old non-i32 test not found exactly once')
          s = s.replace(old, new, 1)
          old = '''    #[test]\n    fn rejects_unsupported_block_type() {\n        let module = module_with_code(0, 0, vec![0x02, 0x7e, 0x0b, 0x0b]);\n        assert!(matches!(\n            validate(&module),\n            Err(ValidationError::UnsupportedBlockType {\n                block_type: 0x7e,\n                ..\n            })\n        ));\n    }\n'''
          new = '''    #[test]\n    fn rejects_unsupported_block_type() {\n        let module = module_with_code(0, 0, vec![0x02, 0x70, 0x0b, 0x0b]);\n        assert!(matches!(\n            validate(&module),\n            Err(ValidationError::UnsupportedBlockType {\n                block_type: 0x70,\n                ..\n            })\n        ));\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('old block-type test not found exactly once')
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wasm-validator/src/lib.rs
          git commit -m "test(validator): update expectations for typed numeric core"
          git push origin HEAD:feat/phase-5b-numeric-types
