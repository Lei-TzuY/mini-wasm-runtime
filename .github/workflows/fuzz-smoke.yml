name: Fuzz smoke

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/wasm-validator/examples/review_fuzz_corpus.rs"
      - "crates/wasm-validator/tests/fuzz_seed_replay.rs"
      - ".github/workflows/fuzz-smoke.yml"
      - ".github/workflows/fuzz-campaign.yml"
  push:
    branches:
      - main
    paths:
      - "fuzz/**"
      - "crates/wasm-validator/examples/review_fuzz_corpus.rs"
      - "crates/wasm-validator/tests/fuzz_seed_replay.rs"
      - ".github/workflows/fuzz-smoke.yml"
      - ".github/workflows/fuzz-campaign.yml"

permissions:
  contents: read

jobs:
  parser-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly Rust and coverage tools
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Materialize reviewed seed corpus
        run: |
          python3 fuzz/materialize-seeds.py parse_module
          python3 fuzz/materialize-seeds.py parse_validate
      - name: Replay reviewed seed manifest
        run: cargo test -p wasm-validator --test fuzz_seed_replay
      - name: Fuzz raw parser
        run: cargo +nightly fuzz run parse_module -- -seed=1 -runs=512 -max_len=4096 -timeout=5 -rss_limit_mb=1024 -dict=fuzz/wasm.dict
      - name: Fuzz parse-to-validation boundary
        run: cargo +nightly fuzz run parse_validate -- -seed=1 -runs=512 -max_len=4096 -timeout=5 -rss_limit_mb=1024 -dict=fuzz/wasm.dict
      - name: Smoke source-coverage replay
        run: cargo +nightly fuzz coverage parse_module
      - name: Smoke coverage report renderer
        run: bash fuzz/render-coverage.sh parse_module
      - name: Render reviewable corpus inventories
        run: |
          mkdir -p fuzz/review
          cargo run -p wasm-validator --example review_fuzz_corpus -- fuzz/corpus/parse_module > fuzz/review/parse_module.tsv
          cargo run -p wasm-validator --example review_fuzz_corpus -- fuzz/corpus/parse_validate > fuzz/review/parse_validate.tsv
      - name: Upload corpus review inventories
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-review-${{ github.run_id }}
          path: fuzz/review/*.tsv
          if-no-files-found: error
          retention-days: 7
