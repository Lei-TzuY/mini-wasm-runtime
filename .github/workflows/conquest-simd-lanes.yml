name: Conquest SIMD lane primitives

on:
  push:
    branches:
      - conquest/simd-lane-primitives

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Construct vertical slice
        run: |
          python3 tools/conquest_simd_lanes.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/wasm-runtime/tests/simd_i32x4_core.rs")
          text = path.read_text()
          old = '''#[test]
          fn unsupported_simd_subopcode_remains_fail_closed() {
              let bytes = module(&[
                  0x42, 0x00, // i64.const 0
                  0xfd, 0x12, // i64x2.splat is outside this initial slice
                  0x41, 0x00, // result if an implementation accidentally skips the opcode
              ]);
              let parsed = parse_module(&bytes).expect("unsupported-SIMD fixture must parse");
              assert!(matches!(
                  Instance::new(parsed),
                  Err(RuntimeError::Validation(
                      ValidationError::UnsupportedPrefixedOpcode {
                          prefix: 0xfd,
                          subopcode: 18,
                          ..
                      }
                  ))
              ));
          }
          '''
          new = '''#[test]
          fn next_simd_lane_memory_subopcode_remains_fail_closed() {
              let bytes = module(&[
                  0xfd, 0x54, // v128.load8_lane is the next unsupported lane-memory capability
              ]);
              let parsed = parse_module(&bytes).expect("unsupported-SIMD fixture must parse");
              assert!(matches!(
                  Instance::new(parsed),
                  Err(RuntimeError::Validation(
                      ValidationError::UnsupportedPrefixedOpcode {
                          prefix: 0xfd,
                          subopcode: 84,
                          ..
                      }
                  ))
              ));
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected stale SIMD frontier exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
      - name: Verify formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Workspace docs
        run: cargo test --doc --workspace
      - name: Differential clippy
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_remaining_lanes
      - name: Produce clean candidate
        run: |
          rm -f tools/conquest_simd_lanes.py .github/workflows/conquest-simd-lanes.yml
          git add -A
          git diff --cached --check
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: complete remaining SIMD lane primitives"
          git push origin HEAD:conquest/simd-lane-primitives
