name: BIL-17 construction

on:
  push:
    branches:
      - feat/bil-17-memory-fill

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement memory.fill vertical slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path('crates/wasm-runtime/src/lib.rs')
          runtime = runtime_path.read_text()

          copy_pattern = re.compile(
              r"    fn copy\(&mut self, destination: i32, source: i32, length: i32\) -> Result<\(\), RuntimeError> \{\n.*?\n        Ok\(\(\)\)\n    \}\n",
              re.S,
          )
          matches = list(copy_pattern.finditer(runtime))
          assert len(matches) == 1, f'expected one LinearMemory::copy, found {len(matches)}'
          copy_block = matches[0].group(0)
          fill_block = '''\n    fn fill(&mut self, destination: i32, value: i32, length: i32) -> Result<(), RuntimeError> {\n        let width = length as u32 as usize;\n        let destination_range = self.checked_range(destination, 0, width)?;\n        self.bytes[destination_range].fill(value as u8);\n        Ok(())\n    }\n'''
          runtime = runtime[:matches[0].end()] + fill_block + runtime[matches[0].end():]

          pre_start = runtime.index('                        0..=7 => {}')
          pre_default = runtime.index('                        _ => {', pre_start)
          pre_case = '''                        11 => {\n                            let _ = read_u32_immediate(code, &mut pc)?;\n                        }\n'''
          runtime = runtime[:pre_default] + pre_case + runtime[pre_default:]

          exec_start = runtime.index('0..=7 => numeric::trunc_sat')
          exec_default = runtime.index('                        _ => {', exec_start)
          exec_case = '''                        11 => {\n                            let memory_index = read_u32_immediate(code, &mut pc)?;\n                            ensure_runtime_memory_index(self, memory_index)?;\n                            let length = numeric::i32_from_stack(&mut stack)?;\n                            let value = numeric::i32_from_stack(&mut stack)?;\n                            let destination = numeric::i32_from_stack(&mut stack)?;\n                            self.with_memory_mut(|memory| {\n                                memory.fill(destination, value, length)\n                            })?;\n                        }\n'''
          runtime = runtime[:exec_default] + exec_case + runtime[exec_default:]
          runtime_path.write_text(runtime)

          validator_path = Path('crates/wasm-validator/src/typed.rs')
          validator = validator_path.read_text()
          val_start = validator.index('            0xfc => {')
          val_default = validator.index('                    _ =>', val_start)
          val_case = '''                    11 => {\n                        super::read_memory_index(code, &mut pc, module, function, offset)?;\n                        pop_expect(&mut stack, &controls, ValueType::I32, function, offset)?;\n                        pop_expect(&mut stack, &controls, ValueType::I32, function, offset)?;\n                        pop_expect(&mut stack, &controls, ValueType::I32, function, offset)?;\n                    }\n'''
          validator = validator[:val_default] + val_case + validator[val_default:]
          validator_path.write_text(validator)

          tests = r'''use wasm_parser::parse_module;
          use wasm_runtime::{HostRegistry, Instance, MemoryHandle, RuntimeError, Value};

          const I32: u8 = 0x7f;

          fn push_u32(bytes: &mut Vec<u8>, mut value: u32) {
              loop {
                  let mut byte = (value & 0x7f) as u8;
                  value >>= 7;
                  if value != 0 {
                      byte |= 0x80;
                  }
                  bytes.push(byte);
                  if value == 0 {
                      break;
                  }
              }
          }

          fn push_name(bytes: &mut Vec<u8>, name: &str) {
              push_u32(bytes, name.len() as u32);
              bytes.extend_from_slice(name.as_bytes());
          }

          fn push_section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
              module.push(id);
              push_u32(module, payload.len() as u32);
              module.extend_from_slice(payload);
          }

          fn module(imported_memory: bool, result: Option<u8>, instructions: &[u8]) -> Vec<u8> {
              let mut bytes = vec![0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00];
              let mut ty = vec![0x01, 0x60, 0x00];
              match result {
                  Some(result) => ty.extend([0x01, result]),
                  None => ty.push(0x00),
              }
              push_section(&mut bytes, 1, &ty);
              if imported_memory {
                  let mut imports = vec![0x01];
                  push_name(&mut imports, "env");
                  push_name(&mut imports, "mem");
                  imports.extend([0x02, 0x01, 0x01, 0x01]);
                  push_section(&mut bytes, 2, &imports);
              }
              push_section(&mut bytes, 3, &[0x01, 0x00]);
              if !imported_memory {
                  push_section(&mut bytes, 5, &[0x01, 0x01, 0x01, 0x01]);
              }
              push_section(&mut bytes, 7, &[0x01, 0x03, b'r', b'u', b'n', 0x00, 0x00]);
              let mut body = vec![0x00];
              body.extend_from_slice(instructions);
              body.push(0x0b);
              let mut code = vec![0x01];
              push_u32(&mut code, body.len() as u32);
              code.extend(body);
              push_section(&mut bytes, 10, &code);
              bytes
          }

          #[test]
          fn memory_fill_uses_low_byte_of_value() {
              let bytes = module(
                  false,
                  Some(I32),
                  &[
                      0x41, 0x03, 0x41, 0x7f, 0x41, 0x04, 0xfc, 0x0b, 0x00,
                      0x41, 0x06, 0x2d, 0x00, 0x00,
                  ],
              );
              let mut instance = Instance::new(parse_module(&bytes).unwrap()).unwrap();
              assert_eq!(
                  instance.invoke_export("run", &[]).unwrap(),
                  Some(Value::I32(255))
              );
          }

          #[test]
          fn memory_fill_preflights_destination_before_mutation() {
              let bytes = module(
                  true,
                  None,
                  &[
                      0x41, 0xff, 0xff, 0x03, 0x41, 0x2a, 0x41, 0x02, 0xfc, 0x0b, 0x00,
                  ],
              );
              let memory = MemoryHandle::new(1, Some(1)).unwrap();
              memory.write(65_535, &[0x11]).unwrap();
              let mut hosts = HostRegistry::new();
              hosts.register_memory("env", "mem", memory.clone()).unwrap();
              let mut instance = Instance::with_hosts(parse_module(&bytes).unwrap(), hosts).unwrap();
              assert!(matches!(
                  instance.invoke_export("run", &[]),
                  Err(RuntimeError::MemoryOutOfBounds { .. })
              ));
              assert_eq!(memory.read(65_535, 1).unwrap(), vec![0x11]);
          }

          #[test]
          fn memory_fill_updates_imported_memory_backing() {
              let bytes = module(
                  true,
                  None,
                  &[0x41, 0x08, 0x41, 0x2a, 0x41, 0x03, 0xfc, 0x0b, 0x00],
              );
              let memory = MemoryHandle::new(1, Some(1)).unwrap();
              let mut hosts = HostRegistry::new();
              hosts.register_memory("env", "mem", memory.clone()).unwrap();
              let mut instance = Instance::with_hosts(parse_module(&bytes).unwrap(), hosts).unwrap();
              instance.invoke_export("run", &[]).unwrap();
              assert_eq!(memory.read(8, 3).unwrap(), vec![0x2a; 3]);
          }

          #[test]
          fn memory_fill_rejects_nonzero_memory_index() {
              let bytes = module(
                  false,
                  None,
                  &[0x41, 0x00, 0x41, 0x00, 0x41, 0x00, 0xfc, 0x0b, 0x01],
              );
              assert!(Instance::new(parse_module(&bytes).unwrap()).is_err());
          }
          '''
          Path('crates/wasm-runtime/tests/bulk_memory_fill.rs').write_text(tests)

          docs = '''# Bulk memory: `memory.fill`\n\nThis vertical slice adds executable bulk-memory `memory.fill` (`0xfc 11`) for the existing single memory32 surface. Validation consumes the single memory index, requires `(destination, value, length)` as i32 operands, and keeps non-zero memory indices fail-closed until multi-memory is implemented.\n\nExecution interprets destination and length as unsigned memory32 values, uses the low eight bits of the fill value, and preflights the complete destination range before mutation. Defined memories and imported `MemoryHandle` backing use the same runtime path.\n\nFocused regressions cover low-byte semantics, imported-memory visibility, out-of-bounds atomicity, and rejection of non-zero memory indices.\n'''
          Path('docs/bulk-memory-fill.md').write_text(docs)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Diff check
        run: git diff --check
      - name: Commit verified candidate
        shell: bash
        run: |
          rm .github/workflows/bil-17-construction.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/bulk_memory_fill.rs docs/bulk-memory-fill.md .github/workflows/bil-17-construction.yml
          git commit -m 'feat: add bulk-memory memory.fill'
          git push origin HEAD:feat/bil-17-memory-fill
