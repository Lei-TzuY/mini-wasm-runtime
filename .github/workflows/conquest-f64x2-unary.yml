name: Conquest f64x2 unary
on:
  push:
    branches: [conquest/simd-f64x2-unary]
permissions:
  contents: write
jobs:
  conquest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          python .conquest/apply_f64x2_unary.py
          python .conquest/fix_f64x2_frontiers.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee workspace-tests.log
      - name: Upload workspace test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f64x2-workspace-tests
          path: workspace-tests.log
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential format
        run: |
          cargo fmt --manifest-path differential/Cargo.toml --all
          cargo fmt --manifest-path differential/Cargo.toml --all -- --check
      - name: Differential clippy
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_f64x2_unary
      - name: Commit clean candidate
        run: |
          rm -rf .conquest
          rm -f .github/workflows/conquest-f64x2-unary.yml
          rm -f workspace-tests.log
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: add SIMD f64x2 unary semantics"
          git push
