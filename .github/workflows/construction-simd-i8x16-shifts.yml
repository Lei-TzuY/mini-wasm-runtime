name: construction-simd-i8x16-shifts

on:
  push:
    branches: [conquest/simd-i8x16-shifts]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply vertical slice
        run: python3 .conquest/apply_simd_i8x16_shifts.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Focused runtime regressions
        run: cargo test -p wasm-runtime --test simd_i8x16_shifts
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_i8x16_shifts
      - name: Commit generated production changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_i8x16_shifts.rs differential/tests/simd_i8x16_shifts.rs docs/roadmap.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: add SIMD i8x16 shift semantics"
          git push
