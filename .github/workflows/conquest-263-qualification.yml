name: Conquest 263 qualification

on:
  push:
    branches:
      - conquest/relaxed-simd-f64x2-madd

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply corrected 263 slice
        run: python3 tools/conquest_apply_263.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_madd_f64x2
      - name: Promote clean candidate
        run: |
          rm -f tools/conquest_apply_263.py .github/workflows/conquest-263-qualification.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: add relaxed SIMD f64x2 madd"
          git push origin HEAD:conquest/relaxed-simd-f64x2-madd
