name: Phase 4 formatter

on:
  push:
    branches:
      - feat/phase-4-host-boundary

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wasm-parser/src/lib.rs crates/wasm-validator/src/lib.rs crates/wasm-runtime/src/lib.rs crates/wasm-cli/src/main.rs
          git commit -m "style: apply rustfmt to Phase 4"
          git push
