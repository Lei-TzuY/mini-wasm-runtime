name: Conquest memory.init data.drop
on:
  push:
    branches: [conquest/bulk-memory-init-drop]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement vertical slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          # Parser: DataCount section (id 12) lives between Element and Code in section order.
          p='crates/wasm-parser/src/lib.rs'
          replace_once(p,
          '    FunctionCodeLengthMismatch {\n        functions: usize,\n        bodies: usize,\n    },\n    TrailingBytes,',
          '    FunctionCodeLengthMismatch {\n        functions: usize,\n        bodies: usize,\n    },\n    DataCountMismatch { declared: u32, actual: usize },\n    TrailingBytes,')
          replace_once(p,
          '            Self::FunctionCodeLengthMismatch { functions, bodies } => write!(\n                f,\n                "function section declares {functions} defined functions but code section contains {bodies} bodies"\n            ),\n            Self::TrailingBytes =>',
          '            Self::FunctionCodeLengthMismatch { functions, bodies } => write!(\n                f,\n                "function section declares {functions} defined functions but code section contains {bodies} bodies"\n            ),\n            Self::DataCountMismatch { declared, actual } => write!(\n                f,\n                "data-count section declares {declared} segments but data section contains {actual}"\n            ),\n            Self::TrailingBytes =>')
          replace_once(p,
          '    pub code: Vec<FunctionBody>,\n    pub data: Vec<DataSegment>,',
          '    pub code: Vec<FunctionBody>,\n    pub data: Vec<DataSegment>,\n    /// Bulk-memory DataCount section, when present before Code.\n    pub data_count: Option<u32>,')
          replace_once(p,
          '    let mut last_standard = 0u8;\n    let mut seen = [false; 12];',
          '    let mut last_standard = 0u8;\n    let mut last_order = 0u8;\n    let mut seen = [false; 13];')
          replace_once(p,
          '        if !matches!(section_id, 1..=11) {\n            return Err(ParseError::UnsupportedSection(section_id));\n        }\n        if section_id < last_standard {\n            return Err(ParseError::SectionOutOfOrder {\n                previous: last_standard,\n                current: section_id,\n            });\n        }\n        if seen[usize::from(section_id)] {\n            return Err(ParseError::DuplicateSection(section_id));\n        }\n        seen[usize::from(section_id)] = true;\n        last_standard = section_id;',
          '        if !matches!(section_id, 1..=12) {\n            return Err(ParseError::UnsupportedSection(section_id));\n        }\n        // DataCount (id 12) is ordered after Element and before Code/Data.\n        let section_order = match section_id {\n            12 => 10,\n            10 => 11,\n            11 => 12,\n            id => id,\n        };\n        if section_order < last_order {\n            return Err(ParseError::SectionOutOfOrder {\n                previous: last_standard,\n                current: section_id,\n            });\n        }\n        if seen[usize::from(section_id)] {\n            return Err(ParseError::DuplicateSection(section_id));\n        }\n        seen[usize::from(section_id)] = true;\n        last_standard = section_id;\n        last_order = section_order;')
          replace_once(p,
          '            10 => parse_code_section(&mut section, &mut module)?,\n            11 => parse_data_section(&mut section, &mut module)?,',
          '            10 => parse_code_section(&mut section, &mut module)?,\n            11 => parse_data_section(&mut section, &mut module)?,\n            12 => module.data_count = Some(section.read_u32()?),')
          replace_once(p,
          '    if module.function_type_indices.len() != module.code.len() {\n        return Err(ParseError::FunctionCodeLengthMismatch {\n            functions: module.function_type_indices.len(),\n            bodies: module.code.len(),\n        });\n    }\n\n    Ok(module)',
          '    if module.function_type_indices.len() != module.code.len() {\n        return Err(ParseError::FunctionCodeLengthMismatch {\n            functions: module.function_type_indices.len(),\n            bodies: module.code.len(),\n        });\n    }\n    if let Some(declared) = module.data_count {\n        if declared as usize != module.data.len() {\n            return Err(ParseError::DataCountMismatch {\n                declared,\n                actual: module.data.len(),\n            });\n        }\n    }\n\n    Ok(module)')

          # Validator: public-Module defense in depth and typed opcode checks.
          p='crates/wasm-validator/src/lib.rs'
          replace_once(p,
          '    DataMemoryOutOfBounds {\n        segment: usize,\n        memory_index: u32,\n    },\n    MemoryInstructionWithoutMemory',
          '    DataMemoryOutOfBounds {\n        segment: usize,\n        memory_index: u32,\n    },\n    DataCountMismatch { declared: u32, actual: usize },\n    DataCountRequired { function: usize, offset: usize },\n    DataIndexOutOfBounds { function: usize, offset: usize, data_index: u32 },\n    MemoryInstructionWithoutMemory')
          replace_once(p,
          '            Self::DataMemoryOutOfBounds {\n                segment,\n                memory_index,\n            } => write!(\n                f,\n                "data segment {segment} refers to missing memory index {memory_index}"\n            ),\n            Self::MemoryInstructionWithoutMemory',
          '            Self::DataMemoryOutOfBounds {\n                segment,\n                memory_index,\n            } => write!(\n                f,\n                "data segment {segment} refers to missing memory index {memory_index}"\n            ),\n            Self::DataCountMismatch { declared, actual } => write!(\n                f,\n                "data-count section declares {declared} segments but module contains {actual}"\n            ),\n            Self::DataCountRequired { function, offset } => write!(\n                f,\n                "function {function} bulk-memory data instruction at byte {offset} requires a DataCount section"\n            ),\n            Self::DataIndexOutOfBounds { function, offset, data_index } => write!(\n                f,\n                "function {function} bulk-memory instruction at byte {offset} refers to missing data segment {data_index}"\n            ),\n            Self::MemoryInstructionWithoutMemory')
          replace_once(p,
          '    if module.function_type_indices.len() != module.code.len() {\n        return Err(ValidationError::FunctionCodeLengthMismatch {',
          '    if let Some(declared) = module.data_count {\n        if declared as usize != module.data.len() {\n            return Err(ValidationError::DataCountMismatch { declared, actual: module.data.len() });\n        }\n    }\n\n    if module.function_type_indices.len() != module.code.len() {\n        return Err(ValidationError::FunctionCodeLengthMismatch {')

          p='crates/wasm-validator/src/typed.rs'
          replace_once(p,
          '                    10 => {\n                        super::read_memory_index(code, &mut pc, module, function, offset)?;',
          '                    8 => {\n                        if module.data_count.is_none() {\n                            return Err(ValidationError::DataCountRequired { function, offset });\n                        }\n                        let data_index = read_u32(code, &mut pc, function, offset)?;\n                        if data_index as usize >= module.data.len() {\n                            return Err(ValidationError::DataIndexOutOfBounds { function, offset, data_index });\n                        }\n                        super::read_memory_index(code, &mut pc, module, function, offset)?;\n                        pop_expect(&mut stack, &controls, ValueType::I32, function, offset)?;\n                        pop_expect(&mut stack, &controls, ValueType::I32, function, offset)?;\n                        pop_expect(&mut stack, &controls, ValueType::I32, function, offset)?;\n                    }\n                    9 => {\n                        if module.data_count.is_none() {\n                            return Err(ValidationError::DataCountRequired { function, offset });\n                        }\n                        let data_index = read_u32(code, &mut pc, function, offset)?;\n                        if data_index as usize >= module.data.len() {\n                            return Err(ValidationError::DataIndexOutOfBounds { function, offset, data_index });\n                        }\n                    }\n                    10 => {\n                        super::read_memory_index(code, &mut pc, module, function, offset)?;')

          # Runtime lifecycle state and execution.
          p='crates/wasm-runtime/src/lib.rs'
          replace_once(p,
          '    DataSegmentOutOfBounds {\n        segment: usize,\n        offset: u64,\n        length: usize,\n    },\n    TableAllocationFailed',
          '    DataSegmentOutOfBounds {\n        segment: usize,\n        offset: u64,\n        length: usize,\n    },\n    DataIndexOutOfBounds(u32),\n    DataSegmentSourceOutOfBounds { segment: u32, offset: u64, length: usize },\n    TableAllocationFailed')
          replace_once(p,
          '            Self::DataSegmentOutOfBounds {\n                segment,\n                offset,\n                length,\n            } => write!(\n                f,\n                "data segment {segment} at byte {offset} with length {length} does not fit initial memory"\n            ),\n            Self::TableAllocationFailed',
          '            Self::DataSegmentOutOfBounds {\n                segment,\n                offset,\n                length,\n            } => write!(\n                f,\n                "data segment {segment} at byte {offset} with length {length} does not fit initial memory"\n            ),\n            Self::DataIndexOutOfBounds(index) => write!(f, "data segment index {index} is out of bounds"),\n            Self::DataSegmentSourceOutOfBounds { segment, offset, length } => write!(\n                f,\n                "data segment {segment} source byte {offset} with length {length} is out of bounds"\n            ),\n            Self::TableAllocationFailed')
          replace_once(p,
          '    imported_memory: Option<MemoryHandle>,\n    table: Option<TableHandle>,',
          '    imported_memory: Option<MemoryHandle>,\n    data_segments: Vec<Vec<u8>>,\n    table: Option<TableHandle>,')
          replace_once(p,
          '        let identity = Rc::new(());\n        let table = instantiate_table(&module, &hosts, &identity)?;',
          '        let data_segments = module\n            .data\n            .iter()\n            .map(|segment| match segment.mode {\n                DataMode::Passive => segment.bytes.clone(),\n                DataMode::Active { .. } => Vec::new(),\n            })\n            .collect();\n        let identity = Rc::new(());\n        let table = instantiate_table(&module, &hosts, &identity)?;')
          replace_once(p,
          '            memory,\n            imported_memory,\n            table,',
          '            memory,\n            imported_memory,\n            data_segments,\n            table,')
          replace_once(p,
          '    fn initialize_element_segments(&mut self) -> Result<(), RuntimeError> {',
          '''    fn memory_init(\n        &mut self,\n        data_index: u32,\n        destination: i32,\n        source: i32,\n        length: i32,\n    ) -> Result<(), RuntimeError> {\n        let width = length as u32 as usize;\n        let source_start = u64::from(source as u32);\n        let source_end = source_start.checked_add(width as u64).ok_or(\n            RuntimeError::DataSegmentSourceOutOfBounds {\n                segment: data_index,\n                offset: source_start,\n                length: width,\n            },\n        )?;\n        let segment = self\n            .data_segments\n            .get(data_index as usize)\n            .ok_or(RuntimeError::DataIndexOutOfBounds(data_index))?;\n        if source_end > segment.len() as u64 {\n            return Err(RuntimeError::DataSegmentSourceOutOfBounds {\n                segment: data_index,\n                offset: source_start,\n                length: width,\n            });\n        }\n        let start = source_start as usize;\n        let payload = segment[start..start + width].to_vec();\n        self.with_memory_mut(|memory| {\n            let range = memory.checked_range(destination, 0, width)?;\n            memory.bytes[range].copy_from_slice(&payload);\n            Ok(())\n        })\n    }\n\n    fn data_drop(&mut self, data_index: u32) -> Result<(), RuntimeError> {\n        self.data_segments\n            .get_mut(data_index as usize)\n            .ok_or(RuntimeError::DataIndexOutOfBounds(data_index))?\n            .clear();\n        Ok(())\n    }\n\n    fn initialize_element_segments(&mut self) -> Result<(), RuntimeError> {''')
          replace_once(p,
          '                        10 => {\n                            let destination_memory = read_u32_immediate(code, &mut pc)?;',
          '''                        8 => {\n                            let data_index = read_u32_immediate(code, &mut pc)?;\n                            let memory_index = read_u32_immediate(code, &mut pc)?;\n                            ensure_runtime_memory_index(self, memory_index)?;\n                            let length = numeric::i32_from_stack(&mut stack)?;\n                            let source = numeric::i32_from_stack(&mut stack)?;\n                            let destination = numeric::i32_from_stack(&mut stack)?;\n                            self.memory_init(data_index, destination, source, length)?;\n                        }\n                        9 => {\n                            let data_index = read_u32_immediate(code, &mut pc)?;\n                            self.data_drop(data_index)?;\n                        }\n                        10 => {\n                            let destination_memory = read_u32_immediate(code, &mut pc)?;''')
          replace_once(p,
          '                    0..=7 => {}\n                    10 => {',
          '                    0..=7 => {}\n                    8 => {\n                        let _ = read_u32_immediate(code, &mut pc)?;\n                        let _ = read_u32_immediate(code, &mut pc)?;\n                    }\n                    9 => {\n                        let _ = read_u32_immediate(code, &mut pc)?;\n                    }\n                    10 => {')

          test = r'''use wasm_parser::{parse_module, ParseError};
          use wasm_runtime::{Instance, RuntimeError};

          fn section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
              module.push(id);
              module.push(payload.len() as u8);
              module.extend_from_slice(payload);
          }

          fn module(body: &[u8], data: &[u8], declared_count: u8) -> Vec<u8> {
              let mut wasm = b"\0asm\x01\0\0\0".to_vec();
              section(&mut wasm, 1, &[1, 0x60, 0, 0]);
              section(&mut wasm, 3, &[1, 0]);
              section(&mut wasm, 5, &[1, 0, 1]);
              section(&mut wasm, 7, &[1, 3, b'r', b'u', b'n', 0, 0]);
              section(&mut wasm, 12, &[declared_count]);
              let mut code = vec![1, (body.len() + 1) as u8, 0];
              code.extend_from_slice(body);
              section(&mut wasm, 10, &code);
              let mut data_section = vec![1, 1, data.len() as u8];
              data_section.extend_from_slice(data);
              section(&mut wasm, 11, &data_section);
              wasm
          }

          #[test]
          fn memory_init_copies_passive_data() {
              let body = [0x41, 4, 0x41, 1, 0x41, 3, 0xfc, 8, 0, 0, 0x0b];
              let parsed = parse_module(&module(&body, b"hello", 1)).unwrap();
              let mut vm = Instance::new(parsed).unwrap();
              vm.invoke_export("run", &[]).unwrap();
              assert_eq!(&vm.memory().unwrap().bytes()[4..7], b"ell");
          }

          #[test]
          fn data_drop_empties_segment_and_traps_followup_init() {
              let body = [0xfc, 9, 0, 0x41, 0, 0x41, 0, 0x41, 1, 0xfc, 8, 0, 0, 0x0b];
              let parsed = parse_module(&module(&body, b"x", 1)).unwrap();
              let mut vm = Instance::new(parsed).unwrap();
              let error = vm.invoke_export("run", &[]).unwrap_err();
              assert!(matches!(error, RuntimeError::DataSegmentSourceOutOfBounds { .. }));
              assert_eq!(vm.memory().unwrap().bytes()[0], 0);
          }

          #[test]
          fn source_oob_is_atomic() {
              let body = [0x41, 0, 0x41, 4, 0x41, 2, 0xfc, 8, 0, 0, 0x0b];
              let parsed = parse_module(&module(&body, b"hello", 1)).unwrap();
              let mut vm = Instance::new(parsed).unwrap();
              assert!(matches!(vm.invoke_export("run", &[]), Err(RuntimeError::DataSegmentSourceOutOfBounds { .. })));
              assert_eq!(&vm.memory().unwrap().bytes()[0..2], &[0, 0]);
          }

          #[test]
          fn parser_rejects_datacount_mismatch() {
              let body = [0x0b];
              assert!(matches!(parse_module(&module(&body, b"x", 2)), Err(ParseError::DataCountMismatch { declared: 2, actual: 1 })));
          }
          '''
          Path('crates/wasm-runtime/tests/bulk_memory_init_drop.rs').write_text(test.replace('          ', ''))

          # Keep capability documentation executable-state aligned.
          d=Path('docs/phase5c-segment-modes.md')
          s=d.read_text()
          if 'memory.init' not in s:
              s += '\n\n## Bulk-memory passive data lifecycle\n\nPassive data segments are retained per instance for `memory.init` (`0xfc 8`) and can be permanently emptied with `data.drop` (`0xfc 9`). Standard binaries must carry a matching DataCount section before Code. Both source and destination ranges are preflighted before writes; dropped segments behave as zero-length segments.\n'
              d.write_text(s)
          PY
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --doc
      - name: Finalize verified branch
        shell: bash
        run: |
          rm .github/workflows/conquest-memory-init-drop.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add bulk-memory memory.init and data.drop'
          git push origin HEAD:conquest/bulk-memory-init-drop
