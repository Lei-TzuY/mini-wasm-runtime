name: Conquest f32x4 minmax
on:
  push:
    branches: [conquest/simd-f32x4-minmax]
    paths: ['.github/workflows/conquest-f32x4-minmax.yml']
permissions:
  contents: write
jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python3 .conquest/apply_f32x4_minmax.py
      - name: Format
        run: cargo fmt --all
      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential Clippy
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_f32x4_minmax
      - name: Commit candidate
        run: |
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add crates differential docs
          git commit -m 'feat: add SIMD f32x4 min max semantics'
          git push origin HEAD:conquest/simd-f32x4-minmax
