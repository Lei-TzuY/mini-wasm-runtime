name: Conquest 275 qualification

on:
  push:
    branches:
      - conquest/relaxed-simd-dot-add-275

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Construct vertical slice
        run: python3 tools/conquest_275.py
      - name: Format
        run: cargo fmt --all
      - name: Verify format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential format
        run: cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Differential clippy
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_dot_i8x16_i7x16_add
      - name: Prepare clean candidate
        run: |
          rm tools/conquest_275.py .github/workflows/conquest-275.yml
          git add -A
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git commit -m "feat: add relaxed SIMD i32x4 dot-add"
          git push origin HEAD:conquest/relaxed-simd-dot-add-275
