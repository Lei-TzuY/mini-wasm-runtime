name: Conquest SIMD f32x4 pmin pmax

on:
  push:
    branches:
      - conquest/simd-f32x4-pmin-pmax

permissions:
  contents: write

jobs:
  conquest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python3 .conquest/apply_f32x4_pminmax.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit clean candidate
        shell: bash
        run: |
          rm .conquest/apply_f32x4_pminmax.py
          rm .github/workflows/conquest-simd-f32x4-pminmax.yml
          git config user.name LeiZ
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add SIMD f32x4 pmin pmax semantics'
          git push origin HEAD:conquest/simd-f32x4-pmin-pmax
