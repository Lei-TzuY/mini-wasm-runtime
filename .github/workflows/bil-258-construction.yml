name: BIL-258 construction

on:
  push:
    branches: [bil-258-multimemory-memarg]

permissions:
  contents: write

jobs:
  construct:
    if: ${{ !contains(github.event.head_commit.message, '[construction-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-258-multimemory-memarg
          fetch-depth: 0
      - name: Patch indexed multi-memory memargs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          validator = Path('crates/wasm-validator/src/lib.rs')
          text = validator.read_text()
          old = '''fn read_memarg(
              code: &[u8],
              pc: &mut usize,
              function: usize,
              offset: usize,
              maximum_alignment: u32,
          ) -> Result<(u32, u32), ValidationError> {
              let alignment = read_u32_immediate(code, pc, function, offset)?;
              let displacement = read_u32_immediate(code, pc, function, offset)?;
              if alignment > maximum_alignment {
                  return Err(ValidationError::InvalidMemoryAlignment {
                      function,
                      offset,
                      alignment,
                      maximum: maximum_alignment,
                  });
              }
              Ok((alignment, displacement))
          }
          '''
          new = '''fn read_memarg(
              code: &[u8],
              pc: &mut usize,
              module: &Module,
              function: usize,
              offset: usize,
              maximum_alignment: u32,
          ) -> Result<(u32, u32, u32), ValidationError> {
              let flags = read_u32_immediate(code, pc, function, offset)?;
              if flags >= 0x80 {
                  return Err(ValidationError::InvalidMemoryAlignment {
                      function,
                      offset,
                      alignment: flags,
                      maximum: maximum_alignment,
                  });
              }
              let (alignment, memory_index) = if flags & 0x40 != 0 {
                  (
                      flags & 0x3f,
                      read_u32_immediate(code, pc, function, offset)?,
                  )
              } else {
                  (flags, 0)
              };
              let displacement = read_u32_immediate(code, pc, function, offset)?;
              if memory_index as usize >= module.memory_count() {
                  return Err(ValidationError::MemoryIndexOutOfBounds {
                      function,
                      offset,
                      memory_index,
                  });
              }
              if alignment > maximum_alignment {
                  return Err(ValidationError::InvalidMemoryAlignment {
                      function,
                      offset,
                      alignment,
                      maximum: maximum_alignment,
                  });
              }
              Ok((alignment, memory_index, displacement))
          }
          '''
          text = replace_once(text, old, new, 'validator read_memarg')
          validator.write_text(text)

          typed = Path('crates/wasm-validator/src/typed.rs')
          text = typed.read_text()
          old = '''                super::read_memarg(
                      code,
                      &mut pc,
                      function,
                      offset,
                      super::natural_alignment(opcode),
                  )?;'''
          new = '''                super::read_memarg(
                      code,
                      &mut pc,
                      module,
                      function,
                      offset,
                      super::natural_alignment(opcode),
                  )?;'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'typed read_memarg calls: expected 2, found {count}')
          text = text.replace(old, new)
          typed.write_text(text)

          runtime = Path('crates/wasm-runtime/src/lib.rs')
          text = runtime.read_text()
          old = '''fn read_memarg(code: &[u8], pc: &mut usize) -> Result<(u32, u32), RuntimeError> {
              let alignment = read_u32_immediate(code, pc)?;
              let displacement = read_u32_immediate(code, pc)?;
              Ok((alignment, displacement))
          }
          '''
          new = '''fn read_memarg(code: &[u8], pc: &mut usize) -> Result<(u32, u32, u32), RuntimeError> {
              let flags = read_u32_immediate(code, pc)?;
              if flags >= 0x80 {
                  return Err(RuntimeError::ControlInvariant(
                      "validated memarg flags exceed the multi-memory encoding range",
                  ));
              }
              let (alignment, memory_index) = if flags & 0x40 != 0 {
                  (flags & 0x3f, read_u32_immediate(code, pc)?)
              } else {
                  (flags, 0)
              };
              let displacement = read_u32_immediate(code, pc)?;
              Ok((alignment, memory_index, displacement))
          }
          '''
          text = replace_once(text, old, new, 'runtime read_memarg')

          start = text.index('                0x28..=0x35 => {')
          end = text.index('                0x3f => {', start)
          segment = text[start:end]
          if segment.count('let (_, displacement) = read_memarg(code, &mut pc)?;') != 2:
              raise SystemExit('runtime load/store memarg anchors changed')
          segment = segment.replace(
              'let (_, displacement) = read_memarg(code, &mut pc)?;',
              'let (_, memory_index, displacement) = read_memarg(code, &mut pc)?;\n                    ensure_runtime_memory_index(self, memory_index)?;',
          )
          segment = segment.replace('self.with_memory(|memory|', 'self.with_memory_index(memory_index, |memory|')
          segment = segment.replace('self.with_memory_mut(|memory|', 'self.with_memory_index_mut(memory_index, |memory|')
          text = text[:start] + segment + text[end:]
          runtime.write_text(text)

          test = Path('crates/wasm-runtime/tests/multi_memory_memarg.rs')
          test.write_text(r'''use wasm_parser::parse_module;
          use wasm_runtime::{HostRegistry, Instance, MemoryHandle, RuntimeError, Value};
          use wasm_validator::ValidationError;

          fn u32leb(out: &mut Vec<u8>, mut value: u32) {
              loop {
                  let mut byte = (value & 0x7f) as u8;
                  value >>= 7;
                  if value != 0 {
                      byte |= 0x80;
                  }
                  out.push(byte);
                  if value == 0 {
                      break;
                  }
              }
          }

          fn name(out: &mut Vec<u8>, value: &str) {
              u32leb(out, value.len() as u32);
              out.extend_from_slice(value.as_bytes());
          }

          fn section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
              module.push(id);
              u32leb(module, payload.len() as u32);
              module.extend_from_slice(payload);
          }

          fn header() -> Vec<u8> {
              b"\0asm\x01\0\0\0".to_vec()
          }

          fn code_section(body: &[u8]) -> Vec<u8> {
              let mut payload = vec![1];
              u32leb(&mut payload, (body.len() + 1) as u32);
              payload.push(0);
              payload.extend_from_slice(body);
              payload
          }

          fn two_defined(body: &[u8], params: &[u8], results: &[u8]) -> Vec<u8> {
              let mut module = header();
              let mut ty = vec![1, 0x60, params.len() as u8];
              ty.extend_from_slice(params);
              ty.push(results.len() as u8);
              ty.extend_from_slice(results);
              section(&mut module, 1, &ty);
              section(&mut module, 3, &[1, 0]);
              section(&mut module, 5, &[2, 0, 1, 0, 1]);
              section(&mut module, 7, &[1, 3, b'r', b'u', b'n', 0, 0]);
              section(&mut module, 10, &code_section(body));
              module
          }

          fn imported_then_defined(body: &[u8]) -> Vec<u8> {
              let mut module = header();
              section(&mut module, 1, &[1, 0x60, 0, 1, 0x7f]);
              let mut imports = vec![1];
              name(&mut imports, "env");
              name(&mut imports, "mem");
              imports.extend([2, 0, 1]);
              section(&mut module, 2, &imports);
              section(&mut module, 3, &[1, 0]);
              section(&mut module, 5, &[1, 0, 1]);
              section(&mut module, 7, &[1, 3, b'r', b'u', b'n', 0, 0]);
              section(&mut module, 10, &code_section(body));
              module
          }

          #[test]
          fn indexed_memarg_store_and_load_execute_on_second_defined_memory() {
              let body = [
                  0x41, 0x00, 0x41, 0x0b, 0x36, 0x02, 0x00,
                  0x41, 0x00, 0x41, 0x2a, 0x36, 0x42, 0x01, 0x00,
                  0x41, 0x00, 0x28, 0x42, 0x01, 0x00, 0x0b,
              ];
              let module = parse_module(&two_defined(&body, &[], &[0x7f])).unwrap();
              let mut vm = Instance::new(module).unwrap();
              assert_eq!(vm.invoke_export("run", &[]).unwrap(), Some(Value::I32(42)));
              assert_eq!(&vm.memory().unwrap().bytes()[..4], &11i32.to_le_bytes());
          }

          #[test]
          fn legacy_memarg_still_targets_memory_zero() {
              let body = [
                  0x41, 0x00, 0x41, 0x15, 0x36, 0x02, 0x00,
                  0x41, 0x00, 0x28, 0x02, 0x00, 0x0b,
              ];
              let module = parse_module(&two_defined(&body, &[], &[0x7f])).unwrap();
              let mut vm = Instance::new(module).unwrap();
              assert_eq!(vm.invoke_export("run", &[]).unwrap(), Some(Value::I32(21)));
          }

          #[test]
          fn imported_memory_precedes_defined_memory_for_indexed_memarg() {
              let body = [
                  0x41, 0x00, 0x41, 0x2a, 0x36, 0x42, 0x01, 0x00,
                  0x41, 0x00, 0x28, 0x42, 0x01, 0x00, 0x0b,
              ];
              let module = parse_module(&imported_then_defined(&body)).unwrap();
              let imported = MemoryHandle::new(1, None).unwrap();
              let mut hosts = HostRegistry::new();
              hosts.register_memory("env", "mem", imported.clone()).unwrap();
              let mut vm = Instance::with_hosts(module, hosts).unwrap();
              assert_eq!(vm.invoke_export("run", &[]).unwrap(), Some(Value::I32(42)));
              assert_eq!(imported.read(0, 4).unwrap(), vec![0, 0, 0, 0]);
          }

          #[test]
          fn indexed_memarg_invalid_memory_is_rejected() {
              let body = [0x41, 0x00, 0x28, 0x42, 0x02, 0x00, 0x0b];
              let module = parse_module(&two_defined(&body, &[], &[0x7f])).unwrap();
              assert!(matches!(
                  Instance::new(module),
                  Err(RuntimeError::Validation(ValidationError::MemoryIndexOutOfBounds {
                      memory_index: 2,
                      ..
                  }))
              ));
          }

          #[test]
          fn indexed_memarg_preserves_oob_trap_semantics() {
              let body = [
                  0x20, 0x00, 0x41, 0x2a, 0x36, 0x42, 0x01, 0x00,
                  0x41, 0x00, 0x0b,
              ];
              let module = parse_module(&two_defined(&body, &[0x7f], &[0x7f])).unwrap();
              let mut vm = Instance::new(module).unwrap();
              assert!(matches!(
                  vm.invoke_export("run", &[Value::I32(65_535)]),
                  Err(RuntimeError::MemoryOutOfBounds { width: 4, .. })
              ));
          }
          ''')
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/multi_memory_memarg.rs
          git commit -m 'feat: add indexed multi-memory load/store memargs [construction-result]'
          git push origin HEAD:bil-258-multimemory-memarg
