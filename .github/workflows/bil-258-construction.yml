name: BIL-258 construction
on:
  push:
    branches:
      - bil-258-multimemory-memarg
permissions:
  contents: write
jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-258-multimemory-memarg
          fetch-depth: 0
      - run: python3 .github/bil258_patch.py
      - run: python3 .github/bil258_fix.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - name: Commit result
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/multi_memory_memarg.rs
          git commit -m 'feat: add indexed multi-memory load/store memargs'
          git push origin HEAD:bil-258-multimemory-memarg
