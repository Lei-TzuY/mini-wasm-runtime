name: Conquest relaxed SIMD unsigned truncation

on:
  push:
    branches:
      - conquest/relaxed-simd-trunc-f32x4-u

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply vertical slice
        run: python .conquest/apply_relaxed_trunc_f32x4_u.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Differential reference smoke
        run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_trunc_f32x4_u
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Promote clean candidate
        shell: bash
        run: |
          rm -f .github/workflows/conquest-relaxed-trunc-f32x4-u.yml
          rm -f .conquest/apply_relaxed_trunc_f32x4_u.py
          rmdir .conquest 2>/dev/null || true
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add relaxed SIMD unsigned f32x4 truncation"
          git push origin HEAD:conquest/relaxed-simd-trunc-f32x4-u
