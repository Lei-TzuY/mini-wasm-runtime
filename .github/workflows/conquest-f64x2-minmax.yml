name: Conquest f64x2 minmax
on:
  push:
    branches: [conquest/simd-f64x2-minmax]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python .conquest/apply_f64x2_minmax.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit candidate
        run: |
          rm -rf .conquest .github/workflows/conquest-f64x2-minmax.yml
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add SIMD f64x2 min max semantics'
          git push origin HEAD:conquest/simd-f64x2-minmax
