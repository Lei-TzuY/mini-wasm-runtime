use wasm_runtime::{HostRegistry, Instance, MemoryHandle, RuntimeError, Value};
use wasm_validator::ValidationError;

fn push_u32(bytes: &mut Vec<u8>, mut value: u32) {
    loop {
        let mut byte = (value & 0x7f) as u8;
        value >>= 7;
        if value != 0 {
            byte |= 0x80;
        }
        bytes.push(byte);
        if value == 0 {
            break;
        }
    }
}

fn push_name(bytes: &mut Vec<u8>, name: &str) {
    push_u32(bytes, name.len() as u32);
    bytes.extend_from_slice(name.as_bytes());
}

fn push_section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
    module.push(id);
    push_u32(module, payload.len() as u32);
    module.extend_from_slice(payload);
}

fn header() -> Vec<u8> {
    b"\0asm\x01\0\0\0".to_vec()
}

fn two_defined_memory_size_module(memory_index: u8) -> Vec<u8> {
    let mut module = header();
    push_section(&mut module, 1, &[0x01, 0x60, 0x00, 0x01, 0x7f]);
    push_section(&mut module, 3, &[0x01, 0x00]);
    push_section(
        &mut module,
        5,
        &[0x02, 0x01, 0x01, 0x02, 0x01, 0x02, 0x03],
    );
    push_section(&mut module, 7, &[0x01, 0x03, b'r', b'u', b'n', 0x00, 0x00]);
    push_section(
        &mut module,
        10,
        &[0x01, 0x04, 0x00, 0x3f, memory_index, 0x0b],
    );
    module
}

fn imported_then_defined_copy_module() -> Vec<u8> {
    let mut module = header();
    push_section(&mut module, 1, &[0x01, 0x60, 0x00, 0x00]);

    let mut imports = vec![0x01];
    push_name(&mut imports, "env");
    push_name(&mut imports, "mem");
    imports.extend([0x02, 0x00, 0x01]);
    push_section(&mut module, 2, &imports);

    push_section(&mut module, 3, &[0x01, 0x00]);
    push_section(&mut module, 5, &[0x01, 0x00, 0x01]);
    push_section(&mut module, 7, &[0x01, 0x03, b'r', b'u', b'n', 0x00, 0x00]);
    push_section(
        &mut module,
        10,
        &[
            0x01, 0x0c, 0x00, 0x41, 0x00, 0x41, 0x00, 0x41, 0x04, 0xfc, 0x0a, 0x00,
            0x01, 0x0b,
        ],
    );

    let mut data = vec![0x01, 0x02, 0x01, 0x41, 0x00, 0x0b, 0x04];
    data.extend_from_slice(b"wasm");
    push_section(&mut module, 11, &data);
    module
}

#[test]
fn memory_size_executes_against_nonzero_defined_memory() {
    let module = parse_module(&two_defined_memory_size_module(1)).unwrap();
    let mut instance = Instance::new(module).unwrap();
    assert_eq!(instance.invoke_export("run", &[]).unwrap(), Some(Value::I32(2)));
}

#[test]
fn imported_memory_precedes_defined_memory_and_cross_copy_is_executable() {
    let module = parse_module(&imported_then_defined_copy_module()).unwrap();
    assert_eq!(module.memory_count(), 2);
    let host_memory = MemoryHandle::new(1, None).unwrap();
    let mut hosts = HostRegistry::new();
    hosts.register_memory("env", "mem", host_memory.clone()).unwrap();
    let mut instance = Instance::with_hosts(module, hosts).unwrap();
    assert_eq!(host_memory.read(0, 4).unwrap(), vec![0, 0, 0, 0]);
    instance.invoke_export("run", &[]).unwrap();
    assert_eq!(host_memory.read(0, 4).unwrap(), b"wasm");
}

#[test]
fn invalid_memory_index_remains_fail_closed() {
    let module = parse_module(&two_defined_memory_size_module(2)).unwrap();
    assert!(matches!(
        Instance::new(module),
        Err(RuntimeError::Validation(ValidationError::MemoryIndexOutOfBounds {
            memory_index: 2,
            ..
        }))
    ));
}
''')
