name: BIL-252 construction

on:
  push:
    branches: [bil-252-multi-memory-core]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded multi-memory slice
        run: |
          python3 .github/bil252_fix.py
          python3 .github/bil252_patch.py
      - name: Format candidate
        run: cargo fmt --all
      - name: Verify diff hygiene
        run: git diff --check
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit clean candidate
        shell: bash
        run: |
          git rm .github/workflows/bil-252-construction.yml .github/bil252_patch.py .github/bil252_fix.py
          git add crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/multi_memory.rs crates/wasm-runtime/tests/phase5c_imports.rs crates/wasm-validator/src/lib.rs
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: add executable multi-memory core index space"
          git push origin HEAD:bil-252-multi-memory-core
