name: Conquest relaxed SIMD 260 qualification

on:
  push:
    branches: [conquest/relaxed-simd-f64x2-u-zero]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply bounded vertical slice
        run: python scripts/conquest_relaxed_simd_260.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_trunc_f64x2_u_zero
      - name: Promote clean candidate
        shell: bash
        run: |
          rm scripts/conquest_relaxed_simd_260.py
          rm .github/workflows/conquest-relaxed-simd-260.yml
          git add -A
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: add relaxed SIMD unsigned f64x2 truncation"
          git push origin HEAD:conquest/relaxed-simd-f64x2-u-zero
