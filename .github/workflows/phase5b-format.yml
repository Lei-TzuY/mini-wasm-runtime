name: Phase 5B format

on:
  push:
    branches:
      - feat/phase-5b-numeric-types

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply rustfmt
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wasm-cli/src/main.rs crates/wasm-runtime/tests/phase5b.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Phase 5B sources"
          git push origin HEAD:feat/phase-5b-numeric-types
