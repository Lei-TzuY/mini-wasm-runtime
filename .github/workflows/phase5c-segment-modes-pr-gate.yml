name: Phase 5C segment modes PR gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  segment-modes-gate:
    if: github.head_ref == 'feat/phase-5c-segment-modes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-segment-modes
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply segment-mode implementation and validate
        shell: bash
        run: |
          python3 scripts/phase5c_segment_modes.py
          python3 scripts/phase5c_segment_modes_fix1.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gate
        shell: bash
        run: |
          rm .github/workflows/phase5c-segment-modes-pr-gate.yml
          rm scripts/phase5c_segment_modes.py
          rm scripts/phase5c_segment_modes_fix1.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-parser/src/lib.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/host_boundary.rs crates/wasm-runtime/tests/phase5c_segment_modes.rs crates/wasm-validator/src/lib.rs crates/wasm-validator/src/phase5.rs .github/workflows/phase5c-segment-modes-pr-gate.yml scripts/phase5c_segment_modes.py scripts/phase5c_segment_modes_fix1.py
          git commit -m "feat: support passive and explicit segment modes"
          git push origin HEAD:feat/phase-5c-segment-modes
