name: Phase 5C float operators PR gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  float-operators-gate:
    if: github.head_ref == 'feat/phase-5c-float-operators'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-float-operators
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply float operator implementation and validate
        shell: bash
        run: |
          python3 scripts/phase5c_float_operators.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gate
        shell: bash
        run: |
          rm .github/workflows/phase5c-float-operators-pr-gate.yml
          rm scripts/phase5c_float_operators.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-runtime/src/lib.rs crates/wasm-runtime/src/numeric.rs crates/wasm-runtime/tests/phase5c_float_operators.rs crates/wasm-validator/src/typed.rs .github/workflows/phase5c-float-operators-pr-gate.yml scripts/phase5c_float_operators.py
          git commit -m "feat: add MVP float operator core"
          git push origin HEAD:feat/phase-5c-float-operators
