name: Conquest 267 qualification

on:
  push:
    branches:
      - conquest/relaxed-laneselect-i32x4-267

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply vertical slice
        run: |
          python3 .conquest/apply_267.py
          sed -i 's/265 | 266 | 267 =>/265..=267 =>/' crates/wasm-validator/src/typed.rs
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Targeted Wasmtime differential
        run: |
          set +e
          cargo test -p differential --test simd_relaxed_laneselect_i32x4 > .conquest/differential.log 2>&1
          status=$?
          cat .conquest/differential.log
          if [ "$status" -ne 0 ]; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add .conquest/differential.log
            git commit -m "chore: capture differential blocker"
            git push origin "HEAD:conquest/relaxed-laneselect-i32x4-267"
            exit "$status"
          fi
          rm .conquest/differential.log
      - name: Commit qualified implementation and remove construction files
        env:
          BRANCH: conquest/relaxed-laneselect-i32x4-267
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates differential
          git commit -m "feat: add relaxed SIMD i32x4 laneselect"
          git rm .github/workflows/conquest-267.yml .conquest/apply_267.py .conquest/trigger-267 .conquest/clippy.log
          git commit -m "chore: remove construction qualification files"
          git push origin "HEAD:${BRANCH}"
