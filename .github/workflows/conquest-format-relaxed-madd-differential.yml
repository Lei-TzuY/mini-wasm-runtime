name: Conquest format relaxed madd differential
on:
  push:
    branches: [conquest/relaxed-simd-f32x4-madd]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --manifest-path differential/Cargo.toml
      - run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add differential/tests/simd_relaxed_madd_f32x4.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: format relaxed madd differential fixture'
          git push origin HEAD:conquest/relaxed-simd-f32x4-madd
