          replace_once(validator_typed, old_validator_memory, new_validator_memory, 'validator typed memory effects')

          old_alignment = '''fn natural_alignment(opcode: u8) -> u32 {
              match opcode {
                  0x28 | 0x36 => 2,
                  0x2e | 0x2f | 0x3b => 1,
                  0x2c | 0x2d | 0x3a => 0,
                  _ => unreachable!("natural alignment queried only for supported memory access opcodes"),
              }
