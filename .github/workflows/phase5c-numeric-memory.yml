name: Phase 5C typed numeric memory implementation

on:
  push:
    branches: [feat/phase-5c-numeric-memory]
    paths:
      - .github/workflows/phase5c-numeric-memory.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-numeric-memory
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply typed numeric memory slice
        shell: bash
        run: |
