name: conquest-264-v2
on:
  push:
    branches: [conquest/relaxed-simd-f64x2-nmadd-264]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Construct
        run: python3 .github/scripts/conquest_264.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Targeted Wasmtime differential
        run: cd differential && cargo test --test simd_relaxed_nmadd_f64x2
      - name: Promote clean candidate
        shell: bash
        run: |
          cargo fmt --all -- --check
          git diff --check
          git rm .github/workflows/conquest-264.yml .github/workflows/conquest-264-v2.yml .github/scripts/conquest_264.py
          git config user.name "Bill Lei"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests differential/tests/simd_relaxed_nmadd_f64x2.rs
          git commit -m "feat: add relaxed SIMD f64x2 nmadd"
          git push origin HEAD:${GITHUB_REF_NAME}
