name: BIL-207 staging

on:
  push:
    branches:
      - conquest/element-expr

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/element-expr
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply vertical slice
        run: python tools/bil207_element_expr.py
      - name: Format
        run: cargo fmt --all
      - name: Test workspace
        id: tests
        continue-on-error: true
        run: cargo test --workspace --all-targets > staging-test.log 2>&1
      - name: Upload test log
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bil207-test-log
          path: staging-test.log
      - name: Fail after log upload
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit clean candidate
        run: |
          rm -f .github/workflows/bil207-staging.yml tools/bil207_element_expr.py Cargo.lock staging-test.log
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git commit -m "feat: add executable element expression segments"
          git push origin HEAD:conquest/element-expr
