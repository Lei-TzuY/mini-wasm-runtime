name: Conquest i32x4 shifts construction

on:
  push:
    branches: [conquest/simd-i32x4-shifts]

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply implementation slice
        run: python .conquest/apply_i32x4_shifts.py
      - name: Advance promoted fail-closed regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("crates/wasm-runtime/tests/simd_i16x8_alu_closure.rs")
          text = p.read_text()
          text = text.replace("fn adjacent_i32x4_shift_remains_fail_closed()", "fn adjacent_i64x2_shift_remains_fail_closed()")
          text = text.replace("push_simd(&mut instructions, 171);", "push_simd(&mut instructions, 203);")
          text = text.replace("subopcode: 171,", "subopcode: 203,")
          p.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Workspace docs
        run: cargo doc --workspace --no-deps
      - name: Differential format
        working-directory: differential
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Differential clippy
        working-directory: differential
        run: cargo clippy --all-targets -- -D warnings
      - name: Differential i32x4 shifts
        working-directory: differential
        run: cargo test --test simd_i32x4_shifts
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -rf .conquest
          rm .github/workflows/conquest-i32x4-shifts.yml
          git config user.name "Bill Lei"
          git config user.email "41898282+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_i16x8_alu_closure.rs crates/wasm-runtime/tests/simd_i32x4_widening.rs crates/wasm-runtime/tests/simd_i32x4_shifts.rs differential/tests/simd_i32x4_shifts.rs docs/roadmap.md .conquest .github/workflows/conquest-i32x4-shifts.yml
          git commit -m "feat: add SIMD i32x4 shift semantics"
          git push origin HEAD:conquest/simd-i32x4-shifts
