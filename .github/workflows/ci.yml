name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            os: ubuntu-latest
          - rust: stable
            os: windows-latest
          - rust: stable
            os: macos-latest
          - rust: 1.81.0
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps

  implement-phase5c-memory:
    name: Validate and commit shared imported memory
    needs: test
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/phase-5c-module-forms-conformance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-module-forms-conformance
          fetch-depth: 2
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply staged implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase5c-memory-implementation.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n          cargo fmt --all\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          body = "\n".join(line[6:] if line.startswith("      ") else line for line in lines) + "\n"

          helper_start = body.index("    def rep(old, new):")
          helper_end = body.index("\n\n", helper_start)
          loose = '''    def rep(old, new):
              global s
              import re
              tokens = re.split(r"\\s+", old.strip())
              pattern = r"\\s+".join(re.escape(token) for token in tokens)
              matches = list(re.finditer(pattern, s, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected exactly one token-sequence match, found {len(matches)}:\\n'
                      + old[:300]
                  )
              match = matches[0]
              replacement = new.strip()
              s = s[:match.start()] + replacement + s[match.end():]
          '''
          body = body[:helper_start] + loose + body[helper_end + 2:]
          Path('/tmp/apply_phase5c_memory.py').write_text("if True:\n" + body)
          PY
          python3 /tmp/apply_phase5c_memory.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated implementation and restore CI hygiene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          text = text.replace('  contents: write\n', '  contents: read\n', 1)
          marker = '\n  implement-phase5c-memory:\n'
          if marker not in text:
              raise SystemExit('memory staging job marker missing during cleanup')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(text)
          PY
          rm .github/workflows/phase5c-memory-implementation.yml
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- .github/workflows/ci.yml .github/workflows/phase5c-memory-implementation.yml crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/phase5c_imported_memory.rs
          git commit -m "feat: add shared imported memory backing"
          git push origin HEAD:feat/phase-5c-module-forms-conformance
