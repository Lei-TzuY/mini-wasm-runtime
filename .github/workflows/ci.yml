name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  phase5c-shared-tables:
    name: phase5c-shared-tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-module-forms-conformance
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply shared imported tables
        shell: bash
        run: |
          python3 scripts/phase5c_shared_tables.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/phase5c_imports.rs crates/wasm-runtime/tests/phase5c_imported_tables.rs
          git commit -m 'feat: add shared backing for imported tables'
          git push origin HEAD:feat/phase-5c-module-forms-conformance

  test:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            os: ubuntu-latest
          - rust: stable
            os: windows-latest
          - rust: stable
            os: macos-latest
          - rust: 1.81.0
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup default ${{ matrix.rust }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps
