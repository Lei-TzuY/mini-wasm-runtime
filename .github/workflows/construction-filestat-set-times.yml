name: construction-filestat-set-times

on:
  push:
    branches:
      - conquest/wasi-filestat-set-times

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Sync production patch anchors
        run: |
          python -c "from pathlib import Path; p=Path('.conquest/apply_filestat_set_times.py'); t=p.read_text(); old='    \\\"                    | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE;\\\\n\\\",\\n    \\\"                    | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE\\\\n                    | RIGHTS_FD_FILESTAT_SET_TIMES;\\\\n\\\",\\n    \\\"path open file rights\\\",\\n'; new='    \\\"                    | RIGHTS_FD_TELL | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE;\\\\n\\\",\\n    \\\"                    | RIGHTS_FD_TELL | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE\\\\n                    | RIGHTS_FD_FILESTAT_SET_TIMES;\\\\n\\\",\\n    \\\"path open file rights\\\",\\n'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('.conquest/apply_filestat_set_times.py'); t=p.read_text(); old='    if count != 1:\\n'; new='    if label == \\\"open existing times tuple\\\" and count == 2:\\n        return text.replace(old, new, 1)\\n    if count != 1:\\n'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))"
          rm -f .conquest/apply-error.txt
      - name: Apply production patch
        run: python .conquest/apply_filestat_set_times.py
      - name: Format
        run: cargo fmt --all
      - name: Diff hygiene
        run: git diff --check
      - name: Pinpoint regression line
        run: nl -ba crates/wasm-wasi/tests/filestat_set_times.rs | sed -n '214,224p'
      - name: Focused filestat timestamp regressions
        run: |
          cargo test -p wasm-wasi --test filestat_set_times -- --nocapture
          cargo test -p wasm-wasi --test fd_filestat_get -- --nocapture
          cargo test -p wasm-wasi --test path_filestat_get -- --nocapture
          cargo test -p wasm-wasi --test path_link -- --nocapture
          cargo test -p wasm-wasi --test directory_relative_symlink -- --nocapture
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit construction result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-wasi/src/root.rs crates/wasm-wasi/src/clock.rs crates/wasm-wasi/src/filesystem.rs crates/wasm-wasi/tests/filestat_set_times.rs
          git commit -m "feat: implement deterministic WASI filestat timestamps"
          git push origin HEAD:conquest/wasi-filestat-set-times
