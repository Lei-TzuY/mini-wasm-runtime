name: construction-filestat-set-times

on:
  push:
    branches:
      - conquest/wasi-filestat-set-times

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Sync production patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.conquest/apply_filestat_set_times.py')
          text = path.read_text()
          old = '''    "                    | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE;\\n",
    "                    | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE\\n                    | RIGHTS_FD_FILESTAT_SET_TIMES;\\n",
    "path open file rights",
'''
          new = '''    "                    | RIGHTS_FD_TELL | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE;\\n",
    "                    | RIGHTS_FD_TELL | RIGHTS_FD_FILESTAT_GET | RIGHTS_FD_FILESTAT_SET_SIZE\\n                    | RIGHTS_FD_FILESTAT_SET_TIMES;\\n",
    "path open file rights",
'''
          if text.count(old) != 1:
              raise SystemExit(f'construction anchor self-patch expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .conquest/apply-error.txt
      - name: Apply production patch
        run: python .conquest/apply_filestat_set_times.py
      - name: Format
        run: cargo fmt --all
      - name: Diff hygiene
        run: git diff --check
      - name: Focused filestat timestamp regressions
        run: |
          cargo test -p wasm-wasi --test filestat_set_times -- --nocapture
          cargo test -p wasm-wasi --test fd_filestat_get -- --nocapture
          cargo test -p wasm-wasi --test path_filestat_get -- --nocapture
          cargo test -p wasm-wasi --test path_link -- --nocapture
          cargo test -p wasm-wasi --test directory_relative_symlink -- --nocapture
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit construction result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-wasi/src/root.rs crates/wasm-wasi/src/clock.rs crates/wasm-wasi/src/filesystem.rs crates/wasm-wasi/tests/filestat_set_times.rs
          git commit -m "feat: implement deterministic WASI filestat timestamps"
          git push origin HEAD:conquest/wasi-filestat-set-times
