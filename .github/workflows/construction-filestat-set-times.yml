name: construction-filestat-set-times

on:
  push:
    branches:
      - conquest/wasi-filestat-set-times

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply production patch
        run: |
          set +e
          python .conquest/apply_filestat_set_times.py > .conquest/apply-error.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add .conquest/apply-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: capture construction patch failure"
              git push origin HEAD:conquest/wasi-filestat-set-times
            fi
            cat .conquest/apply-error.txt
            exit "$status"
          fi
          rm -f .conquest/apply-error.txt
      - name: Format
        run: cargo fmt --all
      - name: Diff hygiene
        run: git diff --check
      - name: Focused filestat timestamp regressions
        run: |
          cargo test -p wasm-wasi --test filestat_set_times -- --nocapture
          cargo test -p wasm-wasi --test fd_filestat_get -- --nocapture
          cargo test -p wasm-wasi --test path_filestat_get -- --nocapture
          cargo test -p wasm-wasi --test path_link -- --nocapture
          cargo test -p wasm-wasi --test directory_relative_symlink -- --nocapture
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit construction result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-wasi/src/root.rs crates/wasm-wasi/src/clock.rs crates/wasm-wasi/src/filesystem.rs crates/wasm-wasi/tests/filestat_set_times.rs
          git commit -m "feat: implement deterministic WASI filestat timestamps"
          git push origin HEAD:conquest/wasi-filestat-set-times
