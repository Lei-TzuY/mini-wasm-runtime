name: construction-simd-i8x16-saturating-minmax

on:
  push:
    branches: [conquest/simd-i8x16-saturating-minmax]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply vertical slice
        run: python3 .conquest/apply_simd_i8x16_saturating_minmax.py
      - name: Normalize rounded average
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/wasm-runtime/src/lib.rs")
          text = path.read_text()
          old = "((u16::from(lhs_lane) + u16::from(rhs_lane) + 1) / 2) as u8"
          new = "(u16::from(lhs_lane) + u16::from(rhs_lane)).div_ceil(2) as u8"
          if text.count(old) != 1:
              raise SystemExit(f"rounded-average anchor mismatch: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format generated Rust
        run: cargo fmt --all
      - name: Verify format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Focused runtime regressions
        run: cargo test -p wasm-runtime --test simd_i8x16_saturating_minmax
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_i8x16_saturating_minmax
      - name: Commit generated production changes
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_i8x16_saturating_minmax.rs differential/tests/simd_i8x16_saturating_minmax.rs docs/roadmap.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: add SIMD i8x16 saturating min-max semantics"
          git push
