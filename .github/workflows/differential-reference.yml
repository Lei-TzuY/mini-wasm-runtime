name: Differential reference smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wasmtime-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format differential workspace
        run: cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Clippy differential workspace
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Compare with Wasmtime
        run: cargo test --manifest-path differential/Cargo.toml -- --nocapture
