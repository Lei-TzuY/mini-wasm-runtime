name: Phase 5C multi-value PR gate

on:
  pull_request:
    branches:
      - test/phase-6-security-invariants

permissions:
  contents: write

jobs:
  multi-value-gate:
    if: github.event.pull_request.head.ref == 'feat/phase-5c-multi-value-results'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-multi-value-results
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply multi-value implementation and validate
        shell: bash
        run: |
          python3 scripts/phase5c_multi_value_gate_v2.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gate
        shell: bash
        run: |
          rm .github/workflows/phase5c-multi-value-pr-gate.yml
          rm scripts/phase5c_multi_value_gate.py
          rm scripts/phase5c_multi_value_gate_v2.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/phase5c.rs crates/wasm-runtime/tests/phase5c_multi_value.rs crates/wasm-cli/src/main.rs docs/phase5c-multi-value.md .github/workflows/phase5c-multi-value-pr-gate.yml scripts/phase5c_multi_value_gate.py scripts/phase5c_multi_value_gate_v2.py
          git commit -m "feat: execute multi-value results"
          git push origin HEAD:feat/phase-5c-multi-value-results
