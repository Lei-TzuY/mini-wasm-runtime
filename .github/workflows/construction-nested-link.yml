name: construction-nested-link

on:
  push:
    branches:
      - conquest/wasi-nested-link

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply acceptance patch
        run: python .conquest/apply_nested_link_acceptance.py
      - name: Canonicalize workspace
        run: cargo fmt --all
      - name: Commit acceptance
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-wasi/tests/nested_directories.rs
          git commit -m "test: define directory-relative WASI path_link lifecycle"
          git push origin HEAD:conquest/wasi-nested-link
      - name: Focused acceptance
        run: cargo test -p wasm-wasi --test nested_directories hard_link_resolves_source_and_target_directory_descriptors -- --nocapture
