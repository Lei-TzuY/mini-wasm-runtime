name: Phase 5B stale test fix

on:
  push:
    branches:
      - feat/phase-5b-numeric-types

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace stale block-type expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/wasm-validator/src/lib.rs')
          s = p.read_text()
          old = '''    fn rejects_unsupported_block_type() {\n        let module = module_with_code(0, 0, vec![0x02, 0x7e, 0x0b, 0x0b]);\n        assert!(matches!(\n            validate(&module),\n            Err(ValidationError::UnsupportedBlockType {\n                block_type: 0x7e,\n                ..\n            })\n        ));\n    }\n'''
          new = old.replace('0x7e', '0x70')
          if s.count(old) != 1:
              raise SystemExit('stale block-type test not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wasm-validator/src/lib.rs
          git commit -m "test(validator): use unsupported reference block type"
          git push origin HEAD:feat/phase-5b-numeric-types
