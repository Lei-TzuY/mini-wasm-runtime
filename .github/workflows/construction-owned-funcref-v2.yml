name: construction-owned-funcref-v2

on:
  push:
    branches:
      - conquest/owned-funcref-embedding-v2

permissions:
  contents: write

jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply owned funcref implementation
        run: |
          python .conquest/apply_owned_funcref_embedding_v2.py
          python .conquest/fix_owned_funcref_fixture.py
      - name: Format
        run: cargo fmt --all
      - name: Owned funcref acceptance
        run: cargo test -p wasm-runtime --test owned_funcref_embedding -- --nocapture
      - name: Existing reference regressions
        run: |
          cargo test -p wasm-runtime --test reference_typed_defined_functions -- --nocapture
          cargo test -p wasm-runtime --test table_get_set -- --nocapture
          cargo test -p wasm-runtime --test phase5c_imported_tables -- --nocapture
          cargo test -p wasm-runtime --test multi_table_core -- --nocapture
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Docs workspace
        run: cargo doc --workspace --no-deps
      - name: Commit construction result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/owned_funcref_embedding.rs
          git commit -m "feat: add owned funcref embedding boundary"
          git push origin HEAD:conquest/owned-funcref-embedding-v2
