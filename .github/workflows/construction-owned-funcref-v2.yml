name: construction-owned-funcref-v2

on:
  push:
    branches:
      - conquest/owned-funcref-embedding-v2

permissions:
  contents: write

jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply roadmap accounting
        run: python .conquest/patch_owned_funcref_roadmap.py
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Owned funcref acceptance
        run: cargo test -p wasm-runtime --test owned_funcref_embedding -- --nocapture
      - name: Existing reference regressions
        run: |
          cargo test -p wasm-runtime --test reference_typed_defined_functions -- --nocapture
          cargo test -p wasm-runtime --test table_get_set -- --nocapture
          cargo test -p wasm-runtime --test phase5c_imported_tables -- --nocapture
          cargo test -p wasm-runtime --test multi_table_core -- --nocapture
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Docs workspace
        run: cargo doc --workspace --no-deps
      - name: Commit roadmap accounting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add docs/roadmap.md
          git commit -m "docs: record owned funcref embedding boundary"
          git push origin HEAD:conquest/owned-funcref-embedding-v2
