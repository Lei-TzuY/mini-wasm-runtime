name: Phase 5C numeric memory PR gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  numeric-memory-gate:
    if: github.head_ref == 'feat/phase-5c-numeric-memory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-numeric-memory
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply staged implementation and validate
        shell: bash
        run: |
          python3 scripts/phase5c_numeric_memory.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gates
        shell: bash
        run: |
          rm .github/workflows/phase5c-numeric-memory.yml
          rm .github/workflows/phase5c-numeric-memory-pr-gate.yml
          rm scripts/phase5c_numeric_memory.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/phase5c_numeric_memory.rs crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs .github/workflows/phase5c-numeric-memory.yml .github/workflows/phase5c-numeric-memory-pr-gate.yml scripts/phase5c_numeric_memory.py
          git commit -m "feat: add typed numeric memory instructions"
          git push origin HEAD:feat/phase-5c-numeric-memory
