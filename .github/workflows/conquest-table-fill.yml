name: Conquest table.fill staging
on:
  push:
    branches: [conquest/table-fill]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  stage:
    if: github.head_ref == 'conquest/table-fill' || github.ref_name == 'conquest/table-fill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/table-fill
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - name: Apply implementation
        run: python tools/apply_table_fill.py
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - name: Publish clean candidate
        run: |
          rm tools/apply_table_fill.py .github/workflows/conquest-table-fill.yml
          git add -A
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git commit -m 'feat: add bulk-table table.fill'
          git push origin HEAD:conquest/table-fill
