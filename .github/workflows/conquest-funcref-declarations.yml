name: Conquest ref.func declaration staging

on:
  push:
    branches: [conquest/funcref-globals]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/funcref-globals
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply declaration validation
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text or text.count(old) != 1:
                  raise SystemExit(f"anchor mismatch in {path}: count={text.count(old)}")
              p.write_text(text.replace(old, new))

          validator = "crates/wasm-validator/src/lib.rs"
          replace(validator,
          '''    CallTargetOutOfBounds {
                  function: usize,
                  offset: usize,
                  target: u32,
              },''',
          '''    CallTargetOutOfBounds {
                  function: usize,
                  offset: usize,
                  target: u32,
              },
              UndeclaredFunctionReference {
                  function: usize,
                  offset: usize,
                  target: u32,
              },''')

          replace(validator,
          '''            Self::CallTargetOutOfBounds {
                          function,
                          offset,
                          target,
                      } => write!(
                          f,
                          "function {function} call at byte {offset} refers to missing function {target}"
                      ),''',
          '''            Self::CallTargetOutOfBounds {
                          function,
                          offset,
                          target,
                      } => write!(
                          f,
                          "function {function} call at byte {offset} refers to missing function {target}"
                      ),
                      Self::UndeclaredFunctionReference {
                          function,
                          offset,
                          target,
                      } => write!(
                          f,
                          "function {function} ref.func at byte {offset} refers to undeclared function {target}"
                      ),''')

          anchor = '''fn validate_defined_global_initializers(module: &Module) -> Result<(), ValidationError> {'''
          helper = '''fn is_declared_function_reference(module: &Module, target: u32) -> bool {
              module
                  .exports
                  .iter()
                  .any(|export| export.kind == ExportKind::Function && export.index == target)
                  || module
                      .elements
                      .iter()
                      .any(|element| element.function_indices.contains(&target))
                  || module.globals.iter().any(|global| {
                      matches!(global.init, Constant::FuncRef(Some(index)) if index == target)
                  })
          }

          ''' + anchor
          replace(validator, anchor, helper)

          typed = "crates/wasm-validator/src/typed.rs"
          replace(typed,
          '''                if function_type(module, target).is_none() {
                              return Err(ValidationError::CallTargetOutOfBounds {
                                  function,
                                  offset,
                                  target,
                              });
                          }
                          stack.push(ValueType::FuncRef);''',
          '''                if function_type(module, target).is_none() {
                              return Err(ValidationError::CallTargetOutOfBounds {
                                  function,
                                  offset,
                                  target,
                              });
                          }
                          if !super::is_declared_function_reference(module, target) {
                              return Err(ValidationError::UndeclaredFunctionReference {
                                  function,
                                  offset,
                                  target,
                              });
                          }
                          stack.push(ValueType::FuncRef);''')

          tests = Path("crates/wasm-runtime/tests/funcref_globals.rs")
          text = tests.read_text()
          text += r'''

          #[test]
          fn function_body_ref_func_requires_reference_declaration() {
              let mut bytes = b"\0asm\x01\0\0\0".to_vec();
              section(&mut bytes, 1, &[1, 0x60, 0, 1, 0x7f]);
              section(&mut bytes, 3, &[2, 0, 0]);
              section(&mut bytes, 7, &[1, 3, b'r', b'u', b'n', 0, 1]);

              let target = [0, 0x41, 42, 0x0b];
              let run = [0, 0xd2, 0, 0x1a, 0x41, 0, 0x0b];
              let mut code = vec![2, target.len() as u8];
              code.extend_from_slice(&target);
              code.push(run.len() as u8);
              code.extend_from_slice(&run);
              section(&mut bytes, 10, &code);

              let module = parse_module(&bytes).unwrap();
              assert!(matches!(
                  Instance::new(module),
                  Err(RuntimeError::Validation(
                      ValidationError::UndeclaredFunctionReference {
                          function: 1,
                          target: 0,
                          ..
                      }
                  ))
              ));
          }
          '''
          tests.write_text(text)
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/funcref_globals.rs
          git commit -m 'fix: enforce ref.func declaration semantics'
          git push origin HEAD:conquest/funcref-globals
