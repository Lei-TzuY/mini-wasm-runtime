name: Conquest table.copy diagnose

on:
  push:
    branches:
      - conquest/table-copy

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runtime opcode count one
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = '''                        13 => {
                            let element_index = read_u32_immediate(code, &mut pc)?;
                            self.elem_drop(element_index)?;
                        }
                        _ => {'''
          raise SystemExit(0 if Path("crates/wasm-runtime/src/lib.rs").read_text().count(needle) == 1 else 1)
          PY
      - name: Runtime opcode count two
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = '''                        13 => {
                            let element_index = read_u32_immediate(code, &mut pc)?;
                            self.elem_drop(element_index)?;
                        }
                        _ => {'''
          raise SystemExit(0 if Path("crates/wasm-runtime/src/lib.rs").read_text().count(needle) == 2 else 1)
          PY
      - name: Runtime control exact
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = '''                    13 => {
                        let _ = read_u32_immediate(code, &mut pc)?;
                    }
                    _ => {'''
          raise SystemExit(0 if Path("crates/wasm-runtime/src/lib.rs").read_text().count(needle) == 1 else 1)
          PY
      - name: Validator exact
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = '''                    13 => {
                        let element_index = read_u32(code, &mut pc, function, offset)?;
                        if element_index as usize >= module.elements.len() {
                            return Err(ValidationError::ElementIndexOutOfBounds {
                                function,
                                offset,
                                element_index,
                            });
                        }
                    }
                    _ => {'''
          raise SystemExit(0 if Path("crates/wasm-validator/src/typed.rs").read_text().count(needle) == 1 else 1)
          PY
