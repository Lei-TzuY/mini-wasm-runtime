name: Conquest 271 qualification

on:
  push:
    branches:
      - conquest/relaxed-simd-f64x2-min

permissions:
  contents: write

jobs:
  build-qualify-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: conquest/relaxed-simd-f64x2-min
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Implement bounded relaxed SIMD slice
        run: python3 scripts/conquest_271.py
      - name: Format root workspace
        run: cargo fmt --all --check
      - name: Clippy root workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test root workspace
        run: cargo test --workspace --all-targets
      - name: Docs root workspace
        run: cargo doc --workspace --no-deps
      - name: Format differential workspace
        run: cargo fmt --manifest-path differential/Cargo.toml --all --check
      - name: Clippy differential workspace
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Differential relaxed f64x2 min
        run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_f64x2_min
      - name: Commit clean candidate
        run: |
          rm .github/workflows/conquest-271-qualify.yml scripts/conquest_271.py
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add relaxed SIMD f64x2 min"
          git push origin HEAD:conquest/relaxed-simd-f64x2-min
