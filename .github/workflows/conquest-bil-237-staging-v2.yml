name: Conquest BIL-237 staging v2

on:
  push:
    branches:
      - conquest/bil-237-multi-table-core-dispatch

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[bil-237-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded multi-table core slice
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("crates/wasm-runtime/src/lib.rs")
          runtime = runtime_path.read_text()
          runtime = replace_once(runtime,
              "    table: Option<TableHandle>,\n    globals: Vec<GlobalHandle>,",
              "    table: Option<TableHandle>,\n    tables: Vec<TableHandle>,\n    globals: Vec<GlobalHandle>,",
              "instance table storage")
          runtime = replace_once(runtime,
              "        let table = instantiate_table(&module, &hosts, &identity)?;\n        let globals = instantiate_globals(&module, &hosts)?;",
              "        let tables = instantiate_tables(&module, &hosts, &identity)?;\n        let table = tables.first().cloned();\n        let globals = instantiate_globals(&module, &hosts)?;",
              "instantiate tables call")
          runtime = replace_once(runtime,
              "            table,\n            globals,",
              "            table,\n            tables,\n            globals,",
              "instance table init")
          runtime = replace_once(runtime,
              "            if table_index != 0 {\n                return Err(RuntimeError::TableIndexOutOfBounds(table_index));\n            }\n            let offset = u64::from(offset as u32);",
              "            let offset = u64::from(offset as u32);",
              "element preflight zero-table guard")
          old_lookup = "            let table = self\n                .table\n                .as_ref()\n                .ok_or(RuntimeError::TableIndexOutOfBounds(0))?;"
          if old_lookup not in runtime:
              raise SystemExit("element preflight table lookup missing")
          runtime = runtime.replace(old_lookup,
              "            let table = self\n                .tables\n                .get(table_index as usize)\n                .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?;",
              1)
          runtime = replace_once(runtime,
              "            let ElementMode::Active { offset, .. } = segment.mode else {\n                continue;\n            };\n            let offset = u64::from(offset as u32);\n            let table = self\n                .table\n                .as_ref()\n                .ok_or(RuntimeError::TableIndexOutOfBounds(0))?;",
              "            let ElementMode::Active {\n                table_index,\n                offset,\n            } = segment.mode\n            else {\n                continue;\n            };\n            let offset = u64::from(offset as u32);\n            let table = self\n                .tables\n                .get(table_index as usize)\n                .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?;",
              "element initialize indexed lookup")
          runtime = replace_once(runtime,
              "                    if table_index != 0 || self.table.is_none() {\n                        return Err(RuntimeError::TableIndexOutOfBounds(table_index));\n                    }\n                    let element_index = numeric::i32_from_stack(&mut stack)? as u32;\n                    let callee = self\n                        .table\n                        .as_ref()\n                        .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?",
              "                    let element_index = numeric::i32_from_stack(&mut stack)? as u32;\n                    let callee = self\n                        .tables\n                        .get(table_index as usize)\n                        .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?",
              "call_indirect indexed lookup")
          runtime = replace_once(runtime,
              "                    if table_index != 0 || self.table.is_none() {\n                        return Err(RuntimeError::TableIndexOutOfBounds(table_index));\n                    }\n                    let element_index = numeric::i32_from_stack(&mut stack)? as u32;\n                    let reference = self\n                        .table\n                        .as_ref()\n                        .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?",
              "                    let element_index = numeric::i32_from_stack(&mut stack)? as u32;\n                    let reference = self\n                        .tables\n                        .get(table_index as usize)\n                        .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?",
              "table.get indexed lookup")
          runtime = replace_once(runtime,
              "                    if table_index != 0 || self.table.is_none() {\n                        return Err(RuntimeError::TableIndexOutOfBounds(table_index));\n                    }\n                    let reference = match numeric::pop_typed(&mut stack, ValueType::FuncRef)? {",
              "                    let reference = match numeric::pop_typed(&mut stack, ValueType::FuncRef)? {",
              "table.set zero-table guard")
          runtime = replace_once(runtime,
              "                    self.table\n                        .as_ref()\n                        .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?\n                        .set(element_index, replacement)",
              "                    self.tables\n                        .get(table_index as usize)\n                        .ok_or(RuntimeError::TableIndexOutOfBounds(table_index))?\n                        .set(element_index, replacement)",
              "table.set indexed lookup")

          start = runtime.index("fn instantiate_table(\n")
          end = runtime.index("\nfn map_table_element_error", start)
          new_fn = '''fn instantiate_tables(
              module: &Module,
              hosts: &HostRegistry,
              identity: &Rc<()>,
          ) -> Result<Vec<TableHandle>, RuntimeError> {
              let mut tables = Vec::with_capacity(module.table_count());
              for import in &module.imports {
                  let ImportDesc::Table(table_type) = import.desc else {
                      continue;
                  };
                  let key = (import.module.clone(), import.name.clone());
                  let table = hosts.tables.get(&key).cloned().ok_or_else(|| {
                      RuntimeError::UnresolvedTableImport {
                          module: import.module.clone(),
                          name: import.name.clone(),
                      }
                  })?;
                  validate_table_limits(import, table_type.limits.min, table_type.limits.max, &table)?;
                  table.bind(identity).map_err(|error| match error {
                      TableHandleError::AlreadyBound => RuntimeError::HostTableAlreadyBound {
                          module: import.module.clone(),
                          name: import.name.clone(),
                      },
                      other => map_table_element_error(other, 0),
                  })?;
                  tables.push(table);
              }

              for table_type in &module.tables {
                  let table = TableHandle::new(table_type.limits.min, table_type.limits.max).map_err(
                      |error| match error {
                          TableHandleError::AllocationFailed { elements } => {
                              RuntimeError::TableAllocationFailed { elements }
                          }
                          TableHandleError::InvalidLimits { .. } => RuntimeError::ControlInvariant(
                              "validated defined table has inconsistent limits",
                          ),
                          other => map_table_element_error(other, 0),
                      },
                  )?;
                  table.bind(identity).map_err(|_| {
                      RuntimeError::ControlInvariant(
                          "fresh defined table is unexpectedly already bound",
                      )
                  })?;
                  tables.push(table);
              }
              Ok(tables)
          }
          '''
          runtime = runtime[:start] + new_fn + runtime[end:]
          runtime_path.write_text(runtime)

          typed_path = Path("crates/wasm-validator/src/typed.rs")
          typed = typed_path.read_text()
          needle = "if table_index != 0 || table_index as usize >= module.table_count() {"
          if typed.count(needle) < 2:
              raise SystemExit("typed table.get/set guards missing")
          typed = typed.replace(needle, "if table_index as usize >= module.table_count() {", 2)
          typed_path.write_text(typed)

          phase5_path = Path("crates/wasm-validator/src/phase5.rs")
          phase5 = phase5_path.read_text()
          phase5 = replace_once(phase5,
              "    if module.table_count() > 1 {\n        return Err(ValidationError::UnsupportedTableCount {\n            count: module.table_count(),\n        });\n    }\n",
              "",
              "global single-table validator guard")
          phase5_path.write_text(phase5)

          test = r'''use wasm_parser::parse_module;
          use wasm_runtime::{HostRegistry, Instance, RuntimeError, TableHandle, Value};
          use wasm_validator::ValidationError;

          fn u32leb(out: &mut Vec<u8>, mut value: u32) {
              loop {
                  let mut byte = (value & 0x7f) as u8;
                  value >>= 7;
                  if value != 0 {
                      byte |= 0x80;
                  }
                  out.push(byte);
                  if value == 0 {
                      break;
                  }
              }
          }

          fn section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
              module.push(id);
              u32leb(module, payload.len() as u32);
              module.extend_from_slice(payload);
          }

          fn defined_two_table_module(body: &[u8], with_target: bool) -> Vec<u8> {
              let mut module = b"\0asm\x01\0\0\0".to_vec();
              section(&mut module, 1, &[1, 0x60, 0, 1, 0x7f]);
              let function_count = if with_target { 2 } else { 1 };
              let mut functions = vec![function_count];
              functions.extend(std::iter::repeat(0).take(function_count as usize));
              section(&mut module, 3, &functions);
              section(&mut module, 4, &[2, 0x70, 1, 1, 1, 0x70, 1, 1, 1]);
              let run_index = if with_target { 1 } else { 0 };
              section(&mut module, 7, &[1, 3, b'r', b'u', b'n', 0, run_index]);
              if with_target {
                  section(&mut module, 9, &[1, 2, 1, 0x41, 0, 0x0b, 0, 1, 0]);
              }
              let mut code = vec![function_count];
              if with_target {
                  code.extend([4, 0, 0x41, 42, 0x0b]);
              }
              code.push((body.len() + 1) as u8);
              code.push(0);
              code.extend_from_slice(body);
              section(&mut module, 10, &code);
              module
          }

          fn name(out: &mut Vec<u8>, value: &str) {
              u32leb(out, value.len() as u32);
              out.extend_from_slice(value.as_bytes());
          }

          fn imported_then_defined_module(body: &[u8]) -> Vec<u8> {
              let mut module = b"\0asm\x01\0\0\0".to_vec();
              section(&mut module, 1, &[1, 0x60, 0, 1, 0x7f]);
              let mut imports = vec![1];
              name(&mut imports, "env");
              name(&mut imports, "tab");
              imports.extend([1, 0x70, 1, 1, 1]);
              section(&mut module, 2, &imports);
              section(&mut module, 3, &[2, 0, 0]);
              section(&mut module, 4, &[1, 0x70, 1, 1, 1]);
              section(&mut module, 7, &[1, 3, b'r', b'u', b'n', 0, 1]);
              section(&mut module, 9, &[1, 2, 1, 0x41, 0, 0x0b, 0, 1, 0]);
              let mut code = vec![2, 4, 0, 0x41, 42, 0x0b, (body.len() + 1) as u8, 0];
              code.extend_from_slice(body);
              section(&mut module, 10, &code);
              module
          }

          #[test]
          fn call_indirect_dispatches_through_second_defined_table() {
              let body = [0x41, 0, 0x11, 0, 1, 0x0b];
              let module = parse_module(&defined_two_table_module(&body, true)).unwrap();
              let mut instance = Instance::new(module).unwrap();
              assert_eq!(
                  instance.invoke_export("run", &[]).unwrap(),
                  Some(Value::I32(42))
              );
          }

          #[test]
          fn table_get_and_set_execute_against_second_defined_table() {
              let body = [
                  0x41, 0, 0xd0, 0x70, 0x26, 1, 0x41, 0, 0x25, 1, 0xd1, 0x0b,
              ];
              let module = parse_module(&defined_two_table_module(&body, false)).unwrap();
              let mut instance = Instance::new(module).unwrap();
              assert_eq!(
                  instance.invoke_export("run", &[]).unwrap(),
                  Some(Value::I32(1))
              );
          }

          #[test]
          fn imported_table_precedes_defined_table_in_index_space() {
              let body = [0x41, 0, 0x11, 0, 1, 0x0b];
              let imported = TableHandle::new(1, Some(1)).unwrap();
              let mut hosts = HostRegistry::new();
              hosts.register_table("env", "tab", imported).unwrap();
              let module = parse_module(&imported_then_defined_module(&body)).unwrap();
              let mut instance = Instance::with_hosts(module, hosts).unwrap();
              assert_eq!(
                  instance.invoke_export("run", &[]).unwrap(),
                  Some(Value::I32(42))
              );
          }

          #[test]
          fn invalid_third_table_index_stays_fail_closed() {
              let body = [0x41, 0, 0x25, 2, 0xd1, 0x0b];
              let module = parse_module(&defined_two_table_module(&body, false)).unwrap();
              assert!(matches!(
                  Instance::new(module),
                  Err(RuntimeError::Validation(
                      ValidationError::TableIndexOutOfBounds { table_index: 2, .. }
                  ))
              ));
          }
          '''
          Path("crates/wasm-runtime/tests/multi_table_core.rs").write_text(test)
      - name: Format
        run: cargo fmt --all
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - name: Finalize branch without staging workflows
        run: |
          rm -f .github/workflows/conquest-bil-237-staging.yml
          rm -f .github/workflows/conquest-bil-237-staging-v2.yml
          rm -f Cargo.lock
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add executable multi-table core dispatch [bil-237-final]'
          git push origin HEAD:conquest/bil-237-multi-table-core-dispatch
