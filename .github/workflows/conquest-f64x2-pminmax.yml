name: Conquest f64x2 pmin pmax

on:
  push:
    branches:
      - conquest/simd-f64x2-pminmax

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded f64x2 pmin/pmax slice
        run: python .conquest/f64x2_pminmax.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential format
        working-directory: differential
        run: cargo fmt --all -- --check
      - name: Differential clippy
        working-directory: differential
        run: cargo clippy --all-targets -- -D warnings
      - name: Wasmtime differential
        working-directory: differential
        run: cargo test --test simd_f64x2_pminmax
      - name: Frontier audit
        run: |
          ! grep -R "subopcode: 246" crates/wasm-runtime/tests/simd_*.rs
          grep -q "240..=247" crates/wasm-validator/src/typed.rs
          grep -q "240..=247" crates/wasm-runtime/src/lib.rs
      - name: Publish clean candidate
        run: |
          rm -rf .conquest
          rm .github/workflows/conquest-f64x2-pminmax.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add SIMD f64x2 pmin pmax semantics"
          git push origin HEAD:conquest/simd-f64x2-pminmax
