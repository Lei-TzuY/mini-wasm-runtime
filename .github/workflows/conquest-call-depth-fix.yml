name: Conquest call-depth safety fix

on:
  push:
    branches:
      - conquest/table-copy
    paths:
      - .github/workflows/conquest-call-depth-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: conquest/table-copy
          fetch-depth: 0
      - name: Apply fail-closed safety fix
        shell: python
        run: |
          from pathlib import Path

          lib = Path("crates/wasm-runtime/src/lib.rs")
          text = lib.read_text()
          old = "pub const MAX_CALL_DEPTH: usize = 32;"
          new = "pub const MAX_CALL_DEPTH: usize = 16;"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one MAX_CALL_DEPTH anchor, found {text.count(old)}")
          lib.write_text(text.replace(old, new))

          doc = Path("docs/phase5c-pinned-wast-call-tranche.md")
          text = doc.read_text()
          old = "The runtime therefore exposes `MAX_CALL_DEPTH = 32` as the validated native-stack safety ceiling."
          new = "The runtime therefore exposes `MAX_CALL_DEPTH = 16` as the validated native-stack safety ceiling; the tighter bound preserves structured failure on current macOS ARM64 hosted runners where the prior ceiling of 32 can overflow before the guard fires."
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one call-depth doc anchor, found {text.count(old)}")
          doc.write_text(text.replace(old, new))
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Remove staging workflow
        run: rm .github/workflows/conquest-call-depth-fix.yml
      - name: Commit verified fix
        run: |
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-runtime/src/lib.rs docs/phase5c-pinned-wast-call-tranche.md .github/workflows/conquest-call-depth-fix.yml
          git commit -m "fix: tighten native call-depth safety ceiling"
          git push origin HEAD:conquest/table-copy
