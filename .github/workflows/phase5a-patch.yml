name: Phase 5A source patch

on:
  push:
    branches:
      - feat/phase-5a-indirect-globals

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply Phase 5A changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path('crates/wasm-validator/src/lib.rs')
          s = p.read_text()
          s = replace_once(s,
              'use wasm_parser::{decode_i32, decode_u32, ExportKind, FuncType, Module, ValueType};\n',
              'use wasm_parser::{decode_i32, decode_u32, ExportKind, FuncType, Module, ValueType};\n\nmod phase5;\n',
              'validator module')
          s = replace_once(s,
              '''    MemoryExportOutOfBounds {\n        name: String,\n        memory_index: u32,\n    },\n''',
              '''    MemoryExportOutOfBounds {\n        name: String,\n        memory_index: u32,\n    },\n    TableExportOutOfBounds {\n        name: String,\n        table_index: u32,\n    },\n    GlobalExportOutOfBounds {\n        name: String,\n        global_index: u32,\n    },\n    UnsupportedTableCount {\n        count: usize,\n    },\n    InvalidTableLimits {\n        table: usize,\n        min: u32,\n        max: u32,\n    },\n    UnsupportedGlobalValueType {\n        global: usize,\n        value_type: ValueType,\n    },\n    StartFunctionOutOfBounds {\n        function_index: u32,\n    },\n    InvalidStartSignature {\n        function_index: u32,\n    },\n    ElementTableOutOfBounds {\n        segment: usize,\n        table_index: u32,\n    },\n    ElementFunctionOutOfBounds {\n        segment: usize,\n        function_index: u32,\n    },\n    GlobalIndexOutOfBounds {\n        function: usize,\n        offset: usize,\n        global_index: u32,\n    },\n    ImmutableGlobalSet {\n        function: usize,\n        offset: usize,\n        global_index: u32,\n    },\n    TableIndexOutOfBounds {\n        function: usize,\n        offset: usize,\n        table_index: u32,\n    },\n    IndirectTypeIndexOutOfBounds {\n        function: usize,\n        offset: usize,\n        type_index: u32,\n    },\n    UnsupportedIndirectResultArity {\n        function: usize,\n        offset: usize,\n        results: usize,\n    },\n    UnsupportedIndirectValueType {\n        function: usize,\n        offset: usize,\n        value_type: ValueType,\n    },\n''',
              'validator errors')
          s = replace_once(s,
              '''            Self::MemoryExportOutOfBounds {\n                name,\n                memory_index,\n            } => write!(\n                f,\n                "export {name:?} refers to missing memory index {memory_index}"\n            ),\n''',
              '''            Self::MemoryExportOutOfBounds {\n                name,\n                memory_index,\n            } => write!(\n                f,\n                "export {name:?} refers to missing memory index {memory_index}"\n            ),\n            Self::TableExportOutOfBounds { name, table_index } => write!(\n                f,\n                "export {name:?} refers to missing table index {table_index}"\n            ),\n            Self::GlobalExportOutOfBounds { name, global_index } => write!(\n                f,\n                "export {name:?} refers to missing global index {global_index}"\n            ),\n            Self::UnsupportedTableCount { count } => {\n                write!(f, "this runtime supports at most one table, got {count}")\n            }\n            Self::InvalidTableLimits { table, min, max } => write!(\n                f,\n                "table {table} has invalid limits: minimum {min} exceeds maximum {max}"\n            ),\n            Self::UnsupportedGlobalValueType { global, value_type } => write!(\n                f,\n                "global {global} uses {value_type:?}; globals are currently i32-only"\n            ),\n            Self::StartFunctionOutOfBounds { function_index } => {\n                write!(f, "start function index {function_index} is out of bounds")\n            }\n            Self::InvalidStartSignature { function_index } => write!(\n                f,\n                "start function {function_index} must have signature [] -> []"\n            ),\n            Self::ElementTableOutOfBounds { segment, table_index } => write!(\n                f,\n                "element segment {segment} refers to missing table index {table_index}"\n            ),\n            Self::ElementFunctionOutOfBounds { segment, function_index } => write!(\n                f,\n                "element segment {segment} refers to missing function index {function_index}"\n            ),\n            Self::GlobalIndexOutOfBounds { function, offset, global_index } => write!(\n                f,\n                "function {function} global instruction at byte {offset} refers to missing global {global_index}"\n            ),\n            Self::ImmutableGlobalSet { function, offset, global_index } => write!(\n                f,\n                "function {function} global.set at byte {offset} targets immutable global {global_index}"\n            ),\n            Self::TableIndexOutOfBounds { function, offset, table_index } => write!(\n                f,\n                "function {function} call_indirect at byte {offset} refers to missing table {table_index}"\n            ),\n            Self::IndirectTypeIndexOutOfBounds { function, offset, type_index } => write!(\n                f,\n                "function {function} call_indirect at byte {offset} refers to missing type {type_index}"\n            ),\n            Self::UnsupportedIndirectResultArity { function, offset, results } => write!(\n                f,\n                "function {function} call_indirect at byte {offset} uses a type with {results} results; at most one is supported"\n            ),\n            Self::UnsupportedIndirectValueType { function, offset, value_type } => write!(\n                f,\n                "function {function} call_indirect at byte {offset} uses unsupported {value_type:?}"\n            ),\n''',
              'validator displays')
          s = replace_once(s,
              '    validate_memories(module)?;\n    validate_imports(module)?;\n',
              '    validate_memories(module)?;\n    validate_imports(module)?;\n    phase5::validate_phase5(module)?;\n',
              'validator phase5 call')
          s = replace_once(s,
              '''            ExportKind::Table | ExportKind::Global => {\n                return Err(ValidationError::UnsupportedExportKind {\n                    name: export.name.clone(),\n                });\n            }\n''',
              '''            ExportKind::Table => {\n                if export.index as usize >= module.tables.len() {\n                    return Err(ValidationError::TableExportOutOfBounds {\n                        name: export.name.clone(),\n                        table_index: export.index,\n                    });\n                }\n            }\n            ExportKind::Global => {\n                if !phase5::validate_global_export(module, export.index) {\n                    return Err(ValidationError::GlobalExportOutOfBounds {\n                        name: export.name.clone(),\n                        global_index: export.index,\n                    });\n                }\n            }\n''',
              'validator exports')
          marker = '''            0x20 => {\n                read_local_index(code, &mut pc, function, offset, local_count)?;\n                stack_height += 1;\n            }\n'''
          indirect = '''            0x11 => {\n                let type_index = read_u32_immediate(code, &mut pc, function, offset)?;\n                let table_index = read_u32_immediate(code, &mut pc, function, offset)?;\n                let ty = phase5::indirect_type(\n                    module,\n                    function,\n                    offset,\n                    type_index,\n                    table_index,\n                )?;\n                pop_values(&mut stack_height, &controls, 1, function, offset)?;\n                pop_values(\n                    &mut stack_height,\n                    &controls,\n                    ty.params.len(),\n                    function,\n                    offset,\n                )?;\n                stack_height += ty.results.len();\n            }\n''' + marker
          s = replace_once(s, marker, indirect, 'validator call_indirect')
          marker = '''            0x28 | 0x2c..=0x2f => {\n'''
          globals_arms = '''            0x23 => {\n                let global_index = read_u32_immediate(code, &mut pc, function, offset)?;\n                phase5::global_get(module, function, offset, global_index)?;\n                stack_height += 1;\n            }\n            0x24 => {\n                let global_index = read_u32_immediate(code, &mut pc, function, offset)?;\n                phase5::global_set(module, function, offset, global_index)?;\n                pop_values(&mut stack_height, &controls, 1, function, offset)?;\n            }\n''' + marker
          s = replace_once(s, marker, globals_arms, 'validator globals')
          p.write_text(s)

          p = Path('crates/wasm-runtime/src/lib.rs')
          s = p.read_text()
          s = replace_once(s,
              '//! Stack interpreter for the Phase-4 WebAssembly subset.\n',
              '//! Stack interpreter for the Phase-5A WebAssembly subset.\n',
              'runtime phase comment')
          s = replace_once(s,
              '''    DataSegmentOutOfBounds {\n        segment: usize,\n        offset: u64,\n        length: usize,\n    },\n''',
              '''    DataSegmentOutOfBounds {\n        segment: usize,\n        offset: u64,\n        length: usize,\n    },\n    TableAllocationFailed {\n        elements: u32,\n    },\n    ElementSegmentOutOfBounds {\n        segment: usize,\n        offset: u64,\n        length: usize,\n    },\n    GlobalOutOfBounds(u32),\n    ImmutableGlobalSet(u32),\n    TableIndexOutOfBounds(u32),\n    TableElementOutOfBounds(u32),\n    UninitializedTableElement(u32),\n    IndirectCallTypeMismatch {\n        expected_type: u32,\n        function_index: u32,\n    },\n''',
              'runtime errors')
          s = replace_once(s,
              '''            Self::DataSegmentOutOfBounds {\n                segment,\n                offset,\n                length,\n            } => write!(\n                f,\n                "data segment {segment} at byte {offset} with length {length} does not fit initial memory"\n            ),\n''',
              '''            Self::DataSegmentOutOfBounds {\n                segment,\n                offset,\n                length,\n            } => write!(\n                f,\n                "data segment {segment} at byte {offset} with length {length} does not fit initial memory"\n            ),\n            Self::TableAllocationFailed { elements } => {\n                write!(f, "failed to allocate table with {elements} elements")\n            }\n            Self::ElementSegmentOutOfBounds { segment, offset, length } => write!(\n                f,\n                "element segment {segment} at table offset {offset} with length {length} does not fit initial table"\n            ),\n            Self::GlobalOutOfBounds(index) => write!(f, "global index {index} is out of bounds"),\n            Self::ImmutableGlobalSet(index) => {\n                write!(f, "global index {index} is immutable")\n            }\n            Self::TableIndexOutOfBounds(index) => {\n                write!(f, "table index {index} is out of bounds")\n            }\n            Self::TableElementOutOfBounds(index) => {\n                write!(f, "table element index {index} is out of bounds")\n            }\n            Self::UninitializedTableElement(index) => {\n                write!(f, "table element index {index} is uninitialized")\n            }\n            Self::IndirectCallTypeMismatch { expected_type, function_index } => write!(\n                f,\n                "call_indirect expected type {expected_type}, but table function {function_index} has a different type"\n            ),\n''',
              'runtime displays')
          s = replace_once(s,
              '''pub struct Instance {\n    module: Module,\n    control_maps: Vec<ControlMap>,\n    memory: Option<LinearMemory>,\n    hosts: HostRegistry,\n    limits: RuntimeLimits,\n}\n''',
              '''pub struct Instance {\n    module: Module,\n    control_maps: Vec<ControlMap>,\n    memory: Option<LinearMemory>,\n    table: Option<Vec<Option<u32>>>,\n    globals: Vec<Value>,\n    hosts: HostRegistry,\n    limits: RuntimeLimits,\n}\n''',
              'runtime instance fields')
          old = '''        let memory = module\n            .memories\n            .first()\n            .map(|memory_type| {\n                LinearMemory::new(\n                    memory_type.limits.min,\n                    memory_type.limits.max,\n                    limits.max_memory_pages,\n                )\n            })\n            .transpose()?;\n\n        let mut instance = Self {\n            module,\n            control_maps,\n            memory,\n            hosts,\n            limits,\n        };\n        instance.initialize_data_segments()?;\n        Ok(instance)\n'''
          new = '''        let memory = module\n            .memories\n            .first()\n            .map(|memory_type| {\n                LinearMemory::new(\n                    memory_type.limits.min,\n                    memory_type.limits.max,\n                    limits.max_memory_pages,\n                )\n            })\n            .transpose()?;\n        let table = module\n            .tables\n            .first()\n            .map(|table_type| allocate_table(table_type.limits.min))\n            .transpose()?;\n        let globals = module\n            .globals\n            .iter()\n            .map(|global| Value::I32(global.init))\n            .collect();\n\n        let mut instance = Self {\n            module,\n            control_maps,\n            memory,\n            table,\n            globals,\n            hosts,\n            limits,\n        };\n        instance.initialize_data_segments()?;\n        instance.initialize_element_segments()?;\n        if let Some(start) = instance.module.start {\n            let mut budget = ExecutionBudget::new(instance.limits);\n            let result = instance.invoke_function(start, &[], 0, &mut budget)?;\n            if result.is_some() {\n                return Err(RuntimeError::ControlInvariant(\n                    "validated start function returned a value",\n                ));\n            }\n        }\n        Ok(instance)\n'''
          s = replace_once(s, old, new, 'runtime constructor')
          s = replace_once(s,
              '''    pub fn memory(&self) -> Option<&LinearMemory> {\n        self.memory.as_ref()\n    }\n\n''',
              '''    pub fn memory(&self) -> Option<&LinearMemory> {\n        self.memory.as_ref()\n    }\n\n    pub fn global(&self, index: u32) -> Option<Value> {\n        self.globals.get(index as usize).copied()\n    }\n\n''',
              'runtime global accessor')
          marker = '''    fn memory_ref(&self) -> Result<&LinearMemory, RuntimeError> {\n'''
          element_init = '''    fn initialize_element_segments(&mut self) -> Result<(), RuntimeError> {\n        let elements = self.module.elements.clone();\n        for (segment_index, segment) in elements.iter().enumerate() {\n            if segment.table_index != 0 {\n                return Err(RuntimeError::TableIndexOutOfBounds(segment.table_index));\n            }\n            let offset = u64::from(segment.offset as u32);\n            let end = offset\n                .checked_add(segment.function_indices.len() as u64)\n                .ok_or(RuntimeError::ElementSegmentOutOfBounds {\n                    segment: segment_index,\n                    offset,\n                    length: segment.function_indices.len(),\n                })?;\n            let table = self\n                .table\n                .as_mut()\n                .ok_or(RuntimeError::TableIndexOutOfBounds(0))?;\n            if end > table.len() as u64 {\n                return Err(RuntimeError::ElementSegmentOutOfBounds {\n                    segment: segment_index,\n                    offset,\n                    length: segment.function_indices.len(),\n                });\n            }\n            for (slot, &function_index) in segment.function_indices.iter().enumerate() {\n                table[offset as usize + slot] = Some(function_index);\n            }\n        }\n        Ok(())\n    }\n\n''' + marker
          s = replace_once(s, marker, element_init, 'runtime element init')
          marker = '''                0x20 => {\n                    let index = read_u32_immediate(code, &mut pc)?;\n'''
          indirect = '''                0x11 => {\n                    let expected_type_index = read_u32_immediate(code, &mut pc)?;\n                    let table_index = read_u32_immediate(code, &mut pc)?;\n                    if table_index != 0 || self.table.is_none() {\n                        return Err(RuntimeError::TableIndexOutOfBounds(table_index));\n                    }\n                    let element_index = stack\n                        .pop()\n                        .ok_or(RuntimeError::StackUnderflow)?\n                        .as_i32() as u32;\n                    let callee = self\n                        .table\n                        .as_ref()\n                        .and_then(|table| table.get(element_index as usize))\n                        .ok_or(RuntimeError::TableElementOutOfBounds(element_index))?\n                        .ok_or(RuntimeError::UninitializedTableElement(element_index))?;\n                    let expected_type = self\n                        .module\n                        .types\n                        .get(expected_type_index as usize)\n                        .cloned()\n                        .ok_or(RuntimeError::ControlInvariant(\n                            "validated call_indirect type is missing",\n                        ))?;\n                    let actual_type = self.function_type(callee)?;\n                    if actual_type != expected_type {\n                        return Err(RuntimeError::IndirectCallTypeMismatch {\n                            expected_type: expected_type_index,\n                            function_index: callee,\n                        });\n                    }\n                    let param_count = expected_type.params.len();\n                    if stack.len() < param_count {\n                        return Err(RuntimeError::StackUnderflow);\n                    }\n                    let call_args = stack.split_off(stack.len() - param_count);\n                    if let Some(result) =\n                        self.invoke_function(callee, &call_args, depth + 1, budget)?\n                    {\n                        stack.push(result);\n                    }\n                }\n''' + marker
          s = replace_once(s, marker, indirect, 'runtime call_indirect')
          marker = '''                0x28 | 0x2c..=0x2f => {\n'''
          globals_ops = '''                0x23 => {\n                    let index = read_u32_immediate(code, &mut pc)?;\n                    let value = *self\n                        .globals\n                        .get(index as usize)\n                        .ok_or(RuntimeError::GlobalOutOfBounds(index))?;\n                    stack.push(value);\n                }\n                0x24 => {\n                    let index = read_u32_immediate(code, &mut pc)?;\n                    let mutable = self\n                        .module\n                        .globals\n                        .get(index as usize)\n                        .ok_or(RuntimeError::GlobalOutOfBounds(index))?\n                        .ty\n                        .mutable;\n                    if !mutable {\n                        return Err(RuntimeError::ImmutableGlobalSet(index));\n                    }\n                    let value = stack.pop().ok_or(RuntimeError::StackUnderflow)?;\n                    *self\n                        .globals\n                        .get_mut(index as usize)\n                        .ok_or(RuntimeError::GlobalOutOfBounds(index))? = value;\n                }\n''' + marker
          s = replace_once(s, marker, globals_ops, 'runtime globals')
          s = replace_once(s,
              '''            0x0c | 0x0d | 0x10 | 0x20..=0x22 | 0x3f | 0x40 => {\n                let _ = read_u32_immediate(code, &mut pc)?;\n            }\n''',
              '''            0x0c | 0x0d | 0x10 | 0x20..=0x24 | 0x3f | 0x40 => {\n                let _ = read_u32_immediate(code, &mut pc)?;\n            }\n            0x11 => {\n                let _ = read_u32_immediate(code, &mut pc)?;\n                let _ = read_u32_immediate(code, &mut pc)?;\n            }\n''',
              'runtime control map immediates')
          marker = '''fn pages_to_bytes(pages: u32) -> Option<usize> {\n'''
          allocate = '''fn allocate_table(elements: u32) -> Result<Vec<Option<u32>>, RuntimeError> {\n    let len = usize::try_from(elements)\n        .map_err(|_| RuntimeError::TableAllocationFailed { elements })?;\n    let mut table = Vec::new();\n    table\n        .try_reserve_exact(len)\n        .map_err(|_| RuntimeError::TableAllocationFailed { elements })?;\n    table.resize(len, None);\n    Ok(table)\n}\n\n''' + marker
          s = replace_once(s, marker, allocate, 'runtime table allocator')
          p.write_text(s)
          PY
      - name: Apply rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wasm-validator/src/lib.rs crates/wasm-runtime/src/lib.rs crates/wasm-parser/src/lib.rs crates/wasm-validator/src/phase5.rs
          git commit -m "feat: validate and execute Phase 5A state" || exit 0
          git push
