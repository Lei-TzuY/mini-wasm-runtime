name: Conquest table init staging v2

on:
  push:
    branches: [conquest/table-init-elem-drop]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and verify
        run: |
          python3 tools/conquest_table_init.py
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo doc --workspace --no-deps
          rm -f .github/workflows/conquest-table-init.yml .github/workflows/conquest-table-init-v2.yml tools/conquest_table_init.py
          git config user.name "Bill Lei"
          git config user.email "Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bulk-memory table.init and elem.drop"
          git push origin HEAD:conquest/table-init-elem-drop
