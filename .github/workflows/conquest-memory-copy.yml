name: Conquest memory.copy staging

on:
  push:
    branches:
      - conquest/memory-copy-20260904

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded vertical slice
        run: python tools/conquest_memory_copy.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add crates/wasm-validator/src/typed.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/bulk_memory_copy.rs docs/bulk-memory-copy.md
          git diff --cached --check
          git commit -m "feat: add bulk-memory memory.copy"
          git push origin HEAD
