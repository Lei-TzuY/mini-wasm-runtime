name: Conquest relaxed lane-select qualification v3

on:
  push:
    branches: [conquest/relaxed-simd-laneselect-i8x16]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: conquest/relaxed-simd-laneselect-i8x16
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply coherent 265 slice
        run: python3 tools/apply_relaxed_laneselect_265.py
      - name: Format workspaces
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential clippy
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Differential tests
        run: cargo test --manifest-path differential/Cargo.toml -- --nocapture
      - name: Promote clean candidate
        run: |
          rm -f .github/workflows/conquest-relaxed-laneselect.yml .github/workflows/conquest-relaxed-laneselect-v2.yml .github/workflows/conquest-relaxed-laneselect-v3.yml tools/apply_relaxed_laneselect_265.py
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add relaxed SIMD i8x16 laneselect'
          git push origin HEAD:conquest/relaxed-simd-laneselect-i8x16
