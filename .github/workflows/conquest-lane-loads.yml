name: Conquest SIMD lane loads
on:
  push:
    branches: [conquest/simd-lane-loads-84-87]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Construct vertical slice
        run: python3 tools/conquest_lane_loads.py
      - name: Format
        run: cargo fmt --all
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Differential format
        working-directory: differential
        run: cargo fmt --all
      - name: Differential clippy
        working-directory: differential
        run: cargo clippy --all-targets -- -D warnings
      - name: Targeted differential
        working-directory: differential
        run: cargo test --test simd_lane_memory_loads
      - name: Clean construction artifacts and publish candidate
        shell: bash
        run: |
          rm tools/conquest_lane_loads.py .github/workflows/conquest-lane-loads.yml
          git add -A
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git commit -m "feat: add SIMD lane-load memory operations"
          git push origin HEAD:conquest/simd-lane-loads-84-87
