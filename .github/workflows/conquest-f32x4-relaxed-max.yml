name: conquest f32x4 relaxed max
'on':
  push:
    branches:
      - conquest/relaxed-simd-f32x4-max
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and qualify bounded slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          lib = root/'crates/wasm-runtime/src/lib.rs'
          text = lib.read_text()
          if '        270 => {' not in text:
              marker = '        256 => {\n'
              arm = '''        270 => {
                      // f32x4.relaxed_max permits implementation-defined choice for NaN and
                      // signed-zero ties. Reuse deterministic f32x4.max-compatible semantics.
                      let rhs = numeric::v128_from_stack(stack)?;
                      let lhs = numeric::v128_from_stack(stack)?;
                      let mut result = [0u8; 16];
                      for lane in 0..4 {
                          let start = lane * 4;
                          let lhs_lane =
                              f32::from_le_bytes(lhs[start..start + 4].try_into().expect("f32x4 lane width"));
                          let rhs_lane =
                              f32::from_le_bytes(rhs[start..start + 4].try_into().expect("f32x4 lane width"));
                          let value = if lhs_lane.is_nan() || rhs_lane.is_nan() {
                              f32::NAN
                          } else if lhs_lane == rhs_lane {
                              if lhs_lane == 0.0 {
                                  f32::from_bits(lhs_lane.to_bits() & rhs_lane.to_bits())
                              } else {
                                  lhs_lane
                              }
                          } else {
                              lhs_lane.max(rhs_lane)
                          };
                          result[start..start + 4].copy_from_slice(&value.to_le_bytes());
                      }
                      stack.push(Value::V128(Rc::new(result)));
                  }
          '''
              assert marker in text
              text = text.replace(marker, arm + marker, 1)
          text = text.replace('| 240..=269', '| 240..=270')
          lib.write_text(text)

          typed = root/'crates/wasm-validator/src/typed.rs'
          text = typed.read_text()
          text = text.replace('                    269 => {', '                    269 | 270 => {', 1)
          typed.write_text(text)

          for p in (root/'crates/wasm-runtime/tests').glob('*.rs'):
              s = p.read_text()
              s2 = re.sub(r'((?:push_simd|simd)\([^\n]*,\s*)270(\))', r'\g<1>271\2', s)
              s2 = s2.replace('subopcode: 270', 'subopcode: 271')
              if s2 != s:
                  p.write_text(s2)

          test = root/'crates/wasm-runtime/tests/simd_f32x4_minmax.rs'
          s = test.read_text()
          if 'relaxed_f32x4_max_executes_ordered_lanes' not in s:
              s += '''
          #[test]
          fn relaxed_f32x4_max_executes_ordered_lanes() {
              assert_eq!(
                  lane_bits([3.0, -2.0, 8.0, 1.0], [4.0, -5.0, 7.0, 2.0], 270, 0),
                  4.0f32.to_bits()
              );
              assert_eq!(
                  lane_bits([3.0, -2.0, 8.0, 1.0], [4.0, -5.0, 7.0, 2.0], 270, 1),
                  (-2.0f32).to_bits()
              );
          }

          #[test]
          fn relaxed_f32x4_max_selects_positive_zero() {
              assert_eq!(
                  lane_bits([-0.0, 0.0, 1.0, 2.0], [0.0, -0.0, 1.0, 2.0], 270, 0),
                  0.0f32.to_bits()
              );
          }

          #[test]
          fn validator_rejects_relaxed_f32x4_max_type_confusion() {
              let mut i = Vec::new();
              push_f32x4_const(&mut i, [1.0; 4]);
              push_i32_const(&mut i, 1);
              push_simd(&mut i, 270);
              let parsed = parse_module(&module(&i)).expect("fixture parses");
              assert!(matches!(
                  Instance::new(parsed),
                  Err(RuntimeError::Validation(ValidationError::TypeMismatch { .. }))
              ));
          }
          '''
              test.write_text(s)

          diff = root/'differential/tests/simd_relaxed_f32x4_max.rs'
          if not diff.exists():
              diff.write_text('''use wasm_parser::parse_module;
          use wasm_runtime::{Instance as MiniInstance, Value};
          use wasmtime::{Config, Engine, Instance as ReferenceInstance, Module as ReferenceModule, Store};

          const FIXTURE: &str = r#"
          (module
            (memory 1)
            (func (export "ordered") (result i32)
              i32.const 0
              v128.const f32x4 3 -2 8 1
              v128.const f32x4 4 -5 7 2
              f32x4.relaxed_max
              v128.store
              i32.const 0
              i32.load))
          "#;

          #[test]
          fn relaxed_f32x4_max_matches_wasmtime_for_ordered_lanes() {
              let bytes = wat::parse_str(FIXTURE).expect("relaxed max WAT parses");
              let parsed = parse_module(&bytes).expect("mini parses relaxed max fixture");
              let mut mini = MiniInstance::new(parsed).expect("mini instantiates relaxed max fixture");
              let mini_value = match mini.invoke_export_values("ordered", &[]).unwrap().as_slice() {
                  [Value::I32(v)] => *v,
                  other => panic!("unexpected mini result: {other:?}"),
              };

              let mut config = Config::new();
              config.wasm_simd(true);
              config.wasm_relaxed_simd(true);
              let engine = Engine::new(&config).expect("Wasmtime engine initializes");
              let module = ReferenceModule::new(&engine, &bytes).expect("Wasmtime compiles relaxed max");
              let mut store = Store::new(&engine, ());
              let instance = ReferenceInstance::new(&mut store, &module, &[]).expect("Wasmtime instantiates");
              let reference = instance
                  .get_typed_func::<(), i32>(&mut store, "ordered")
                  .unwrap()
                  .call(&mut store, ())
                  .unwrap();

              assert_eq!(mini_value, 4.0f32.to_bits() as i32);
              assert_eq!(mini_value, reference);
          }
          ''')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo doc --workspace --no-deps
          (cd differential && cargo fmt --all && cargo fmt --all -- --check)
          cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_f32x4_max
          rm .github/workflows/conquest-f32x4-relaxed-max.yml
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: add relaxed SIMD f32x4 max'
          git push origin HEAD:conquest/relaxed-simd-f32x4-max
