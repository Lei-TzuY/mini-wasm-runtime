name: Phase 5B remove legacy validator

on:
  push:
    branches:
      - feat/phase-5b-numeric-types

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Retire legacy arity validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lib = Path('crates/wasm-validator/src/lib.rs')
          s = lib.read_text()
          s = s.replace(
              'use wasm_parser::{decode_i32, decode_u32, ExportKind, FuncType, Module, ValueType};',
              'use wasm_parser::{decode_u32, ExportKind, FuncType, Module, ValueType};'
          )
          old_frame = '''#[derive(Debug, Clone, Copy)]\nstruct ControlFrame {\n    kind: ControlKind,\n    height: usize,\n    end_arity: usize,\n    label_arity: usize,\n    unreachable: bool,\n    seen_else: bool,\n}\n\n'''
          if s.count(old_frame) != 1:
              raise SystemExit('legacy ControlFrame block not found exactly once')
          s = s.replace(old_frame, '', 1)

          old_call = '''        let legacy_compatible = typed::validate_code(\n            module,\n            defined,\n            function,\n            &local_types,\n            &function_type.results,\n        )?;\n        if legacy_compatible {\n            validate_code(\n                module,\n                defined,\n                function,\n                local_types.len(),\n                function_type.results.len(),\n            )?;\n        }\n'''
          new_call = '''        typed::validate_code(\n            module,\n            defined,\n            function,\n            &local_types,\n            &function_type.results,\n        )?;\n'''
          if s.count(old_call) != 1:
              raise SystemExit('legacy differential call not found exactly once')
          s = s.replace(old_call, new_call, 1)

          start = s.index('\nfn validate_code(\n')
          end = s.index('\nfn ensure_memory(', start)
          s = s[:start] + '\n' + s[end:]

          start = s.index('\nfn transition_to_else(\n')
          end = s.index('\nfn read_local_index(\n', start)
          s = s[:start] + '\n' + s[end:]

          start = s.index('\nfn read_local_index(\n')
          end = s.index('\nfn read_u32_immediate(\n', start)
          s = s[:start] + '\n' + s[end:]
          lib.write_text(s)

          typed = Path('crates/wasm-validator/src/typed.rs')
          s = typed.read_text()
          s = s.replace(') -> Result<bool, ValidationError> {', ') -> Result<(), ValidationError> {', 1)
          initial = '''    let mut legacy_compatible = function_results.iter().all(|ty| *ty == ValueType::I32)\n        && local_types.iter().all(|ty| *ty == ValueType::I32);\n'''
          if s.count(initial) != 1:
              raise SystemExit('legacy compatibility initializer not found')
          s = s.replace(initial, '', 1)
          s = re.sub(
              r'\n\s*if end_type\.is_some_and\(\|ty\| ty != ValueType::I32\) \{\n\s*legacy_compatible = false;\n\s*\}',
              '',
              s,
          )
          s = re.sub(
              r'\n\s*if signature_uses_non_i32\(ty\) \{\n\s*legacy_compatible = false;\n\s*\}',
              '',
              s,
          )
          s = re.sub(
              r'\n\s*if ty != ValueType::I32 \{\n\s*legacy_compatible = false;\n\s*\}',
              '',
              s,
          )
          s = re.sub(r'^\s*legacy_compatible = false;\n', '', s, flags=re.MULTILINE)
          signature_fn = '''fn signature_uses_non_i32(ty: &FuncType) -> bool {\n    ty.params\n        .iter()\n        .chain(ty.results.iter())\n        .any(|value| *value != ValueType::I32)\n}\n\n'''
          if s.count(signature_fn) != 1:
              raise SystemExit('signature_uses_non_i32 helper not found')
          s = s.replace(signature_fn, '', 1)
          s = s.replace('    Ok(legacy_compatible)\n}', '    Ok(())\n}', 1)
          s = s.replace('use wasm_parser::{decode_i32, decode_i64, FuncType, Module, ValueType};',
                        'use wasm_parser::{decode_i32, decode_i64, FuncType, Module, ValueType};')
          # FuncType remains required by apply_call_signature.
          typed.write_text(s)

          phase5 = Path('crates/wasm-validator/src/phase5.rs')
          s = phase5.read_text()
          s = s.replace('use wasm_parser::{FuncType, Module};', 'use wasm_parser::Module;')
          for fn_name in ['global_get', 'global_set', 'indirect_type']:
              marker = f'pub(super) fn {fn_name}'
              start = s.find(marker)
              if start == -1:
                  raise SystemExit(f'{fn_name} helper not found')
              # Find the next top-level pub(super) fn or EOF.
              next_start = s.find('\npub(super) fn ', start + len(marker))
              if next_start == -1:
                  s = s[:start].rstrip() + '\n'
              else:
                  s = s[:start] + s[next_start + 1:]
          phase5.write_text(s)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-validator/src/phase5.rs
          git commit -m "refactor(validator): retire legacy arity validation"
          git push origin HEAD:feat/phase-5b-numeric-types
