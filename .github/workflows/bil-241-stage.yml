name: BIL-241 staging

on:
  push:
    branches:
      - bil-241-multitable-bulk

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'chore: run BIL-241 staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-241-multitable-bulk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: python .github/bil241_stage.py
      - name: Format
        run: cargo fmt --all
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit candidate
        run: |
          rm -f Cargo.lock
          git config user.name LeiZ
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/multi_table_bulk.rs
          git commit -m 'feat: complete indexed multi-table bulk operations'
          git push origin HEAD:bil-241-multitable-bulk
