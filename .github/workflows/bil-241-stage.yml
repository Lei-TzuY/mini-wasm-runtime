name: BIL-241 staging

on:
  push:
    branches: [bil-241-multitable-bulk]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bil-241-multitable-bulk
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply implementation
        run: test -f crates/wasm-runtime/tests/multi_table_bulk.rs || python .github/bil241_stage.py
      - name: Format
        run: cargo fmt --all
      - name: Test workspace
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Commit candidate if changed
        shell: bash
        run: |
          rm -f Cargo.lock
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/multi_table_bulk.rs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name LeiZ
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git commit -m 'feat: complete indexed multi-table bulk operations'
          git push origin HEAD:bil-241-multitable-bulk
