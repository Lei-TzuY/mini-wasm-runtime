name: conquest-relaxed-simd-i64x2-laneselect

on:
  push:
    branches: [conquest/relaxed-simd-i64x2-laneselect]

permissions:
  contents: write

jobs:
  build-slice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement subopcode 268 vertical slice
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/wasm-runtime/src/lib.rs')
          s = lib.read_text()
          start = s.index('        267 => {')
          next_arm = s.index('        256 => {', start)
          block = s[start:next_arm]
          assert 'v128.bitselect-equivalent semantics' in block
          s = s[:next_arm] + block.replace('        267 => {','        268 => {',1) + s[next_arm:]
          assert '| 240..=267' in s
          lib.write_text(s.replace('| 240..=267','| 240..=268',1))

          typed=Path('crates/wasm-validator/src/typed.rs'); s=typed.read_text(); assert '265..=267 => {' in s; typed.write_text(s.replace('265..=267 => {','265..=268 => {',1))
          names=['simd_conversions.rs','simd_f32x4_binary.rs','simd_f32x4_minmax.rs','simd_f32x4_unary.rs','simd_f64x2_binary.rs','simd_f64x2_minmax.rs','simd_f64x2_unary.rs','simd_i16x8_alu_closure.rs','simd_i32x4_shifts.rs','simd_i32x4_widening.rs','simd_i64x2_arithmetic.rs','simd_i64x2_comparisons.rs','simd_i64x2_extmul.rs','simd_i64x2_shifts.rs','simd_relaxed_laneselect_i8x16.rs','simd_relaxed_laneselect_i16x8.rs','simd_relaxed_laneselect_i32x4.rs','simd_relaxed_swizzle.rs','simd_relaxed_trunc_f32x4_s.rs','simd_relaxed_trunc_f32x4_u.rs','simd_relaxed_trunc_f64x2_s_zero.rs','simd_relaxed_trunc_f64x2_u_zero.rs']
          for name in names:
              p=Path('crates/wasm-runtime/tests')/name; t=p.read_text(); assert '268' in t,name; p.write_text(t.replace('268','269'))

          Path('crates/wasm-runtime/tests/simd_relaxed_laneselect_i64x2.rs').write_text(r'''use wasm_parser::parse_module;
use wasm_runtime::{Instance, RuntimeError, Value};
use wasm_validator::ValidationError;
fn push_u32(b:&mut Vec<u8>,mut v:u32){loop{let mut x=(v&0x7f)as u8;v>>=7;if v!=0{x|=0x80}b.push(x);if v==0{break}}}
fn sec(m:&mut Vec<u8>,id:u8,p:&[u8]){m.push(id);push_u32(m,p.len()as u32);m.extend_from_slice(p)}
fn module(i:&[u8])->Vec<u8>{let mut b=vec![0,97,115,109,1,0,0,0];sec(&mut b,1,&[1,96,0,1,126]);sec(&mut b,3,&[1,0]);sec(&mut b,7,&[1,3,b'r',b'u',b'n',0,0]);let mut body=vec![0];body.extend_from_slice(i);body.push(11);let mut c=vec![1];push_u32(&mut c,body.len()as u32);c.extend(body);sec(&mut b,10,&c);b}
fn vc(c:&mut Vec<u8>,v:[u8;16]){c.extend_from_slice(&[0xfd,0x0c]);c.extend_from_slice(&v)} fn simd(c:&mut Vec<u8>,op:u32){c.push(0xfd);push_u32(c,op)}
fn run(a:[u8;16],b:[u8;16],m:[u8;16])->i64{let mut c=Vec::new();vc(&mut c,a);vc(&mut c,b);vc(&mut c,m);simd(&mut c,268);simd(&mut c,29);c.push(0);let p=parse_module(&module(&c)).unwrap();let mut i=Instance::new(p).unwrap();match i.invoke_export_values("run",&[]).unwrap().as_slice(){[Value::I64(v)]=>*v,o=>panic!("{o:?}")}}
#[test]fn masks(){let a=[0xaa;16];let b=[0x55;16];assert_eq!(run(a,b,[0xff;16]),-6148914691236517206);assert_eq!(run(a,b,[0;16]),6148914691236517205);let mut m=[0;16];m[..8].fill(0xf0);assert_eq!(run(a,b,m),-6510615555426900571)}
#[test]fn types(){let mut c=Vec::new();vc(&mut c,[1;16]);vc(&mut c,[2;16]);c.extend_from_slice(&[0x42,0]);simd(&mut c,268);simd(&mut c,29);c.push(0);let p=parse_module(&module(&c)).unwrap();assert!(matches!(Instance::new(p),Err(RuntimeError::Validation(ValidationError::TypeMismatch{..}))))}
#[test]fn frontier(){let mut c=Vec::new();vc(&mut c,[1;16]);vc(&mut c,[2;16]);vc(&mut c,[0xff;16]);simd(&mut c,269);simd(&mut c,29);c.push(0);let p=parse_module(&module(&c)).unwrap();assert!(matches!(Instance::new(p),Err(RuntimeError::Validation(ValidationError::UnsupportedPrefixedOpcode{prefix:0xfd,subopcode:269,..}))))}
''')
          Path('differential/tests/simd_relaxed_laneselect_i64x2.rs').write_text(r'''use wasm_parser::parse_module;
use wasm_runtime::{Instance as MiniInstance,Value};
use wasmtime::{Config,Engine,Instance as RefInstance,Module as RefModule,Store};
const W:&str=r#"(module (func (export "a") (result i64) v128.const i64x2 -6148914691236517206 -6148914691236517206 v128.const i64x2 6148914691236517205 6148914691236517205 v128.const i64x2 -1 -1 i64x2.relaxed_laneselect i64x2.extract_lane 0) (func (export "b") (result i64) v128.const i64x2 -6148914691236517206 -6148914691236517206 v128.const i64x2 6148914691236517205 6148914691236517205 v128.const i64x2 0 0 i64x2.relaxed_laneselect i64x2.extract_lane 0))"#;
const E:[&str;2]=["a","b"];
fn mini(x:&[u8])->Vec<i64>{let m=parse_module(x).unwrap();let mut i=MiniInstance::new(m).unwrap();E.into_iter().map(|e|match i.invoke_export_values(e,&[]).unwrap().as_slice(){[Value::I64(v)]=>*v,o=>panic!("{o:?}")}).collect()}
fn reference(x:&[u8])->Vec<i64>{let mut c=Config::new();c.wasm_simd(true);c.wasm_relaxed_simd(true);let en=Engine::new(&c).unwrap();let m=RefModule::new(&en,x).unwrap();let mut s=Store::new(&en,());let i=RefInstance::new(&mut s,&m,&[]).unwrap();E.into_iter().map(|e|i.get_typed_func::<(),i64>(&mut s,e).unwrap().call(&mut s,()).unwrap()).collect()}
#[test]fn matches_wasmtime(){let x=wat::parse_str(W).unwrap();let a=mini(&x);let b=reference(&x);assert_eq!(a,vec![-6148914691236517206,6148914691236517205]);assert_eq!(b,a)}
''')
      - name: rustfmt
        run: cargo fmt --all && cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: workspace tests
        run: cargo test --workspace
      - name: docs
        run: cargo doc --workspace --no-deps
      - name: Wasmtime differential
        run: cargo test -p mini-wasm-differential --test simd_relaxed_laneselect_i64x2
      - name: Promote clean candidate
        run: |
          rm .github/workflows/conquest-relaxed-simd-i64x2-laneselect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add relaxed SIMD i64x2 laneselect"
          git push origin HEAD:conquest/relaxed-simd-i64x2-laneselect
