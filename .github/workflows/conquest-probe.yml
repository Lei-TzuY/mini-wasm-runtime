name: conquest-simd94
on:
  push:
    branches:
      - conquest/simd-demote-f64x2-zero-94
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/simd-demote-f64x2-zero-94
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch SIMD 94
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          lib = Path('crates/wasm-runtime/src/lib.rs')
          s = lib.read_text()
          old = '''            stack.push(Value::V128(Rc::new(vector)));
        }
        11 => {'''
          new = '''            stack.push(Value::V128(Rc::new(vector)));
        }
        94 => {
            let value = numeric::v128_from_stack(stack)?;
            let mut result = [0u8; 16];
            for lane in 0..2 {
                let input_start = lane * 8;
                let input = f64::from_bits(u64::from_le_bytes(
                    value[input_start..input_start + 8]
                        .try_into()
                        .expect("f64x2 lane width"),
                ));
                let output_start = lane * 4;
                result[output_start..output_start + 4]
                    .copy_from_slice(&(input as f32).to_bits().to_le_bytes());
            }
            stack.push(Value::V128(Rc::new(result)));
        }
        11 => {'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '''                    | 77..=83
                    | 96'''
          assert s.count(old) == 1
          s = s.replace(old, '''                    | 77..=83
                    | 94
                    | 96''')
          lib.write_text(s)

          val = Path('crates/wasm-validator/src/typed.rs')
          s = val.read_text()
          old = '''                        stack.push(ValueType::V128);
                    }
                    12 => {'''
          assert s.count(old) == 1
          s = s.replace(old, '''                        stack.push(ValueType::V128);
                    }
                    94 => {
                        pop_expect(&mut stack, &controls, ValueType::V128, function, offset)?;
                        stack.push(ValueType::V128);
                    }
                    12 => {''')
          val.write_text(s)

          tests = Path('crates/wasm-runtime/tests/simd_conversions.rs')
          s = tests.read_text()
          marker = '#[test]\nfn conversion_validates_and_scans_structured_control() {'
          addition = '''#[test]
fn f32x4_demote_f64x2_zero_converts_low_lanes_and_zeroes_high_lanes() {
    let mut instructions = Vec::new();
    v128_const(&mut instructions, f64x2([1.5, -2.25]));
    simd(&mut instructions, 94);
    assert_eq!(read_f32x4(run_v128(&instructions)), [1.5, -2.25, 0.0, 0.0]);
}

#[test]
fn f32x4_demote_f64x2_zero_rejects_type_confusion() {
    let mut bad = Vec::new();
    push_i32_const(&mut bad, 1);
    simd(&mut bad, 94);
    let parsed = parse_module(&module(0x7b, &bad)).expect("fixture parses");
    assert!(matches!(Instance::new(parsed), Err(RuntimeError::Validation(ValidationError::TypeMismatch { .. }))));
}

'''
          assert s.count(marker) == 1
          tests.write_text(s.replace(marker, addition + marker))

          frontier = Path('crates/wasm-runtime/tests/simd_i32x4_core.rs')
          s = frontier.read_text()
          s = s.replace('0xfd, 0x5e, // f32x4.demote_f64x2_zero is the next unsupported SIMD capability', '0xfd, 0x5f, // f64x2.promote_low_f32x4 is the next unsupported SIMD capability')
          s = s.replace('subopcode: 94,', 'subopcode: 95,')
          frontier.write_text(s)

          diff = Path('differential/tests/simd_demote_f64x2_zero.rs')
          diff.write_text('''use wasm_parser::parse_module;
use wasm_runtime::{Instance as MiniInstance, Value};
use wasmtime::{Config, Engine, Instance as ReferenceInstance, Module as ReferenceModule, Store};

const FIXTURE: &str = r#"(module
  (func (export "lane0") (result f32) v128.const f64x2 1.5 -2.25 f32x4.demote_f64x2_zero f32x4.extract_lane 0)
  (func (export "lane1") (result f32) v128.const f64x2 1.5 -2.25 f32x4.demote_f64x2_zero f32x4.extract_lane 1)
  (func (export "lane2") (result f32) v128.const f64x2 1.5 -2.25 f32x4.demote_f64x2_zero f32x4.extract_lane 2)
  (func (export "lane3") (result f32) v128.const f64x2 1.5 -2.25 f32x4.demote_f64x2_zero f32x4.extract_lane 3))"#;

#[test]
fn demote_f64x2_zero_matches_wasmtime_reference() {
    let bytes = wat::parse_str(FIXTURE).expect("WAT parses");
    let module = parse_module(&bytes).expect("mini parses");
    let mut mini = MiniInstance::new(module).expect("mini instantiates");
    let mut cfg = Config::new();
    cfg.wasm_simd(true);
    let engine = Engine::new(&cfg).unwrap();
    let module = ReferenceModule::new(&engine, &bytes).unwrap();
    let mut store = Store::new(&engine, ());
    let reference = ReferenceInstance::new(&mut store, &module, &[]).unwrap();
    for name in ["lane0", "lane1", "lane2", "lane3"] {
        let mini_value = match mini.invoke_export_values(name, &[]).unwrap().as_slice() {
            [Value::F32(v)] => *v,
            other => panic!("unexpected mini result: {other:?}"),
        };
        let reference_value = reference.get_typed_func::<(), f32>(&mut store, name).unwrap().call(&mut store, ()).unwrap();
        assert_eq!(mini_value.to_bits(), reference_value.to_bits(), "{name}");
    }
}
''')
          PY
      - name: Qualify
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo doc --workspace --no-deps
          cargo fmt --manifest-path differential/Cargo.toml --all -- --check
          cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path differential/Cargo.toml --test simd_demote_f64x2_zero
      - name: Commit
        shell: bash
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_conversions.rs crates/wasm-runtime/tests/simd_i32x4_core.rs differential/tests/simd_demote_f64x2_zero.rs
          git commit -m 'feat: add SIMD f32x4 demote f64x2 zero'
          git push origin HEAD:conquest/simd-demote-f64x2-zero-94
