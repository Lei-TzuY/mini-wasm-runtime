name: conquest-simd94
on:
  push:
    branches:
      - conquest/simd-demote-f64x2-zero-94
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/simd-demote-f64x2-zero-94
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch SIMD 94
        run: python3 .github/conquest_simd94.py
      - name: Qualify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo doc --workspace --no-deps
          cargo fmt --manifest-path differential/Cargo.toml --all
          cargo fmt --manifest-path differential/Cargo.toml --all -- --check
          cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path differential/Cargo.toml --test simd_demote_f64x2_zero
      - name: Commit
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_conversions.rs crates/wasm-runtime/tests/simd_i32x4_core.rs differential/tests/simd_demote_f64x2_zero.rs
          git commit -m 'feat: add SIMD f32x4 demote f64x2 zero'
          git push origin HEAD:conquest/simd-demote-f64x2-zero-94
