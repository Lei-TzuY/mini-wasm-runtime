name: Conquest relaxed SIMD madd v2
on:
  push:
    branches:
      - conquest/relaxed-simd-f32x4-madd
permissions:
  contents: write
jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/conquest_relaxed_madd.py
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        shell: bash
        run: |
          set +e
          cargo test --workspace 2>&1 | tee workspace-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload workspace test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaxed-madd-workspace-tests
          path: workspace-tests.log
      - name: Commit qualified implementation
        run: |
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-runtime/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/tests/simd_*.rs
          git commit -m 'feat: add relaxed SIMD f32x4 madd'
          git push origin HEAD:conquest/relaxed-simd-f32x4-madd
