name: Phase 6 malformed parser PR gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  malformed-parser-gate:
    if: github.head_ref == 'test/phase-6-malformed-parser-corpus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/phase-6-malformed-parser-corpus
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply const-expression diagnostic fix and validate
        shell: bash
        run: |
          python3 scripts/phase6_const_expr_diagnostic.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gate
        shell: bash
        run: |
          rm .github/workflows/phase6-malformed-parser-pr-gate.yml
          rm scripts/phase6_const_expr_diagnostic.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-parser/src/lib.rs crates/wasm-parser/tests/malformed_binary_corpus.rs .github/workflows/phase6-malformed-parser-pr-gate.yml scripts/phase6_const_expr_diagnostic.py
          git commit -m "fix: classify missing const-expression terminators"
          git push origin HEAD:test/phase-6-malformed-parser-corpus
