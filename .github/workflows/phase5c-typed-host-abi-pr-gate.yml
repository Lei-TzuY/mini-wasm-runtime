name: Phase 5C typed host ABI PR gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  typed-host-abi-gate:
    if: github.head_ref == 'feat/phase-5c-typed-host-abi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/phase-5c-typed-host-abi
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply typed host ABI implementation and validate
        shell: bash
        run: |
          python3 scripts/phase5c_typed_host_abi.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo doc --workspace --no-deps
      - name: Commit validated product and remove staging gate
        shell: bash
        run: |
          rm .github/workflows/phase5c-typed-host-abi-pr-gate.yml
          rm scripts/phase5c_typed_host_abi.py
          git config user.name "Lei-TzuY"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -- crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/phase5c_typed_host_abi.rs crates/wasm-validator/src/lib.rs .github/workflows/phase5c-typed-host-abi-pr-gate.yml scripts/phase5c_typed_host_abi.py
          git commit -m "feat: generalize host function ABI to numeric values"
          git push origin HEAD:feat/phase-5c-typed-host-abi
