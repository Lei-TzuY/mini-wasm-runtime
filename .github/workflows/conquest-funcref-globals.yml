name: Conquest funcref globals staging

on:
  push:
    branches: [conquest/funcref-globals]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/funcref-globals
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply coherent funcref-global slice
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected anchor missing in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new))

          parser = "crates/wasm-parser/src/lib.rs"
          replace(parser,
          '''pub enum Constant {
              I32(i32),
              I64(i64),
              F32(u32),
              F64(u64),
          }''',
          '''pub enum Constant {
              I32(i32),
              I64(i64),
              F32(u32),
              F64(u64),
              FuncRef(Option<u32>),
          }''')

          replace(parser,
          '''            Self::F32(_) => ValueType::F32,
                      Self::F64(_) => ValueType::F64,
                  }''',
          '''            Self::F32(_) => ValueType::F32,
                      Self::F64(_) => ValueType::F64,
                      Self::FuncRef(_) => ValueType::FuncRef,
                  }''')

          replace(parser,
          '''        let value_type = read_value_type(cursor)?;
                  let mutable = read_mutability(cursor)?;
                  let init = read_const_expr(cursor)?;''',
          '''        let value_type = read_global_value_type(cursor)?;
                  let mutable = read_mutability(cursor)?;
                  let init = read_const_expr(cursor)?;''')

          replace(parser,
          '''        0x43 => Constant::F32(cursor.read_u32_le()?),
                  0x44 => Constant::F64(cursor.read_u64_le()?),
                  other => return Err(ParseError::InvalidConstExprOpcode(other)),''',
          '''        0x43 => Constant::F32(cursor.read_u32_le()?),
                  0x44 => Constant::F64(cursor.read_u64_le()?),
                  0xd0 => {
                      let reference_type = cursor.read_u8()?;
                      if reference_type != 0x70 {
                          return Err(ParseError::InvalidReferenceType(reference_type));
                      }
                      Constant::FuncRef(None)
                  }
                  0xd2 => Constant::FuncRef(Some(cursor.read_u32()?)),
                  other => return Err(ParseError::InvalidConstExprOpcode(other)),''')

          replace(parser,
          '''fn read_value_type(cursor: &mut Cursor<'_>) -> Result<ValueType, ParseError> {
              match cursor.read_u8()? {
                  0x7f => Ok(ValueType::I32),
                  0x7e => Ok(ValueType::I64),
                  0x7d => Ok(ValueType::F32),
                  0x7c => Ok(ValueType::F64),
                  other => Err(ParseError::UnsupportedValueType(other)),
              }
          }
          ''',
          '''fn read_value_type(cursor: &mut Cursor<'_>) -> Result<ValueType, ParseError> {
              match cursor.read_u8()? {
                  0x7f => Ok(ValueType::I32),
                  0x7e => Ok(ValueType::I64),
                  0x7d => Ok(ValueType::F32),
                  0x7c => Ok(ValueType::F64),
                  other => Err(ParseError::UnsupportedValueType(other)),
              }
          }

          fn read_global_value_type(cursor: &mut Cursor<'_>) -> Result<ValueType, ParseError> {
              match cursor.read_u8()? {
                  0x7f => Ok(ValueType::I32),
                  0x7e => Ok(ValueType::I64),
                  0x7d => Ok(ValueType::F32),
                  0x7c => Ok(ValueType::F64),
                  0x70 => Ok(ValueType::FuncRef),
                  other => Err(ParseError::UnsupportedValueType(other)),
              }
          }
          ''')

          validator = "crates/wasm-validator/src/lib.rs"
          replace(validator,
          '''use wasm_parser::{decode_u32, DataMode, ExportKind, FuncType, ImportDesc, Module, ValueType};''',
          '''use wasm_parser::{
              decode_u32, Constant, DataMode, ExportKind, FuncType, ImportDesc, Module, ValueType,
          };''')

          replace(validator,
          '''    GlobalInitializerTypeMismatch {
                  global: usize,
                  expected: ValueType,
                  actual: ValueType,
              },''',
          '''    GlobalInitializerTypeMismatch {
                  global: usize,
                  expected: ValueType,
                  actual: ValueType,
              },
              GlobalFunctionRefOutOfBounds {
                  global: usize,
                  function_index: u32,
              },''')

          replace(validator,
          '''            Self::GlobalInitializerTypeMismatch {
                          global,
                          expected,
                          actual,
                      } => write!(
                          f,
                          "global {global} initializer has type {actual:?}, expected {expected:?}"
                      ),''',
          '''            Self::GlobalInitializerTypeMismatch {
                          global,
                          expected,
                          actual,
                      } => write!(
                          f,
                          "global {global} initializer has type {actual:?}, expected {expected:?}"
                      ),
                      Self::GlobalFunctionRefOutOfBounds {
                          global,
                          function_index,
                      } => write!(
                          f,
                          "global {global} initializer refers to missing function {function_index}"
                      ),''')

          replace(validator,
          '''        if actual != expected {
                      return Err(ValidationError::GlobalInitializerTypeMismatch {
                          global: module.global_import_count() + defined,
                          expected,
                          actual,
                      });
                  }
              }''',
          '''        if actual != expected {
                      return Err(ValidationError::GlobalInitializerTypeMismatch {
                          global: module.global_import_count() + defined,
                          expected,
                          actual,
                      });
                  }
                  if let Constant::FuncRef(Some(function_index)) = definition.init {
                      if function_index as usize >= module.function_count() {
                          return Err(ValidationError::GlobalFunctionRefOutOfBounds {
                              global: module.global_import_count() + defined,
                              function_index,
                          });
                      }
                  }
              }''')

          runtime = "crates/wasm-runtime/src/lib.rs"
          replace(runtime,
          '''        Constant::F32(bits) => Value::F32(f32::from_bits(bits)),
                  Constant::F64(bits) => Value::F64(f64::from_bits(bits)),
              }''',
          '''        Constant::F32(bits) => Value::F32(f32::from_bits(bits)),
                  Constant::F64(bits) => Value::F64(f64::from_bits(bits)),
                  Constant::FuncRef(reference) => Value::FuncRef(reference),
              }''')

          tests = r'''use wasm_parser::parse_module;
          use wasm_runtime::{Instance, RuntimeError, Value};
          use wasm_validator::ValidationError;

          fn section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
              module.push(id);
              module.push(payload.len() as u8);
              module.extend_from_slice(payload);
          }

          fn module(global_init: &[u8], body_ops: &[u8], with_table: bool) -> Vec<u8> {
              let mut module = b"\0asm\x01\0\0\0".to_vec();
              section(&mut module, 1, &[1, 0x60, 0, 1, 0x7f]);
              section(&mut module, 3, &[2, 0, 0]);
              if with_table {
                  section(&mut module, 4, &[1, 0x70, 0, 1]);
              }
              let mut globals = vec![1, 0x70, 1];
              globals.extend_from_slice(global_init);
              globals.push(0x0b);
              section(&mut module, 6, &globals);
              section(&mut module, 7, &[1, 3, b'r', b'u', b'n', 0, 1]);

              let target = [0, 0x41, 42, 0x0b];
              let mut run = vec![0];
              run.extend_from_slice(body_ops);
              run.push(0x0b);
              let mut code = vec![2, target.len() as u8];
              code.extend_from_slice(&target);
              code.push(run.len() as u8);
              code.extend_from_slice(&run);
              section(&mut module, 10, &code);
              module
          }

          #[test]
          fn ref_func_global_get_is_non_null() {
              let module = parse_module(&module(&[0xd2, 0], &[0x23, 0, 0xd1], false)).unwrap();
              let mut instance = Instance::new(module).unwrap();
              assert_eq!(instance.invoke_export("run", &[]).unwrap(), Some(Value::I32(0)));
          }

          #[test]
          fn mutable_funcref_global_accepts_ref_null() {
              let module = parse_module(&module(
                  &[0xd2, 0],
                  &[0xd0, 0x70, 0x24, 0, 0x23, 0, 0xd1],
                  false,
              ))
              .unwrap();
              let mut instance = Instance::new(module).unwrap();
              assert_eq!(instance.invoke_export("run", &[]).unwrap(), Some(Value::I32(1)));
          }

          #[test]
          fn null_funcref_global_initializer_executes() {
              let module = parse_module(&module(&[0xd0, 0x70], &[0x23, 0, 0xd1], false)).unwrap();
              let mut instance = Instance::new(module).unwrap();
              assert_eq!(instance.invoke_export("run", &[]).unwrap(), Some(Value::I32(1)));
          }

          #[test]
          fn funcref_global_drives_table_set_and_call_indirect() {
              let module = parse_module(&module(
                  &[0xd2, 0],
                  &[0x41, 0, 0x23, 0, 0x26, 0, 0x41, 0, 0x11, 0, 0],
                  true,
              ))
              .unwrap();
              let mut instance = Instance::new(module).unwrap();
              assert_eq!(instance.invoke_export("run", &[]).unwrap(), Some(Value::I32(42)));
          }

          #[test]
          fn global_ref_func_rejects_missing_function() {
              let module = parse_module(&module(&[0xd2, 2], &[0x41, 0], false)).unwrap();
              assert!(matches!(
                  Instance::new(module),
                  Err(RuntimeError::Validation(
                      ValidationError::GlobalFunctionRefOutOfBounds {
                          global: 0,
                          function_index: 2
                      }
                  ))
              ));
          }
          '''
          Path("crates/wasm-runtime/tests/funcref_globals.rs").write_text(tests)

          docs = '''# Executable `funcref` globals

          This vertical slice implements defined `funcref` globals backed by the runtime's existing nullable instance-local function-reference value model. Global constant expressions accept `ref.null funcref` and in-range `ref.func`; `global.get` and mutable `global.set` then carry those references into the existing reference/table execution surface, including `table.set` and `call_indirect`.

          The slice is derived from the pinned `WebAssembly/spec@fc209c5ed8afc4dfeb9252024d217da3376c7a6f` `test/core/ref_func.wast` behavior. Function signatures, locals, imported globals, and the host ABI remain numeric-only unless already supported; global parsing uses a dedicated value-type reader so accepting `funcref` here does not silently broaden those boundaries. Out-of-range `ref.func` initializers fail validation before instantiation.
          '''
          Path("docs/funcref-globals.md").write_text(docs)
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/wasm-parser/src/lib.rs crates/wasm-validator/src/lib.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/funcref_globals.rs docs/funcref-globals.md
          git commit -m 'feat: add executable funcref globals'
          git push origin HEAD:conquest/funcref-globals
