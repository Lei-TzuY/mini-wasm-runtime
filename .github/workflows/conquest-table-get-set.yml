name: Conquest table.get table.set staging

on:
  push:
    branches:
      - conquest/table-get-set

permissions:
  contents: write

jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded implementation
        run: python3 scripts/conquest_table_get_set.py
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Produce clean candidate
        shell: bash
        run: |
          rm .github/workflows/conquest-table-get-set.yml scripts/conquest_table_get_set.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add executable table.get and table.set"
          git push origin HEAD:conquest/table-get-set
