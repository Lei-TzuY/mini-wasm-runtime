name: Conquest table.size staging

on:
  push:
    branches:
      - conquest/table-size

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply table.size vertical slice
        run: python .github/scripts/conquest_table_size.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Finalize clean candidate
        shell: bash
        run: |
          rm -f .github/workflows/conquest-table-size.yml .github/scripts/conquest_table_size.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no candidate diff"; exit 1; }
          git commit -m "feat: add bulk-table table.size"
          git push origin HEAD:conquest/table-size
