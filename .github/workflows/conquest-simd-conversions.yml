name: Conquest SIMD conversions

on:
  push:
    branches: [conquest/simd-conversions]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply implementation
        run: python .conquest/apply_simd_conversions.py
      - name: Format workspace
        run: cargo fmt --all -- --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Format differential workspace
        run: cargo fmt --manifest-path differential/Cargo.toml -- --check
      - name: Clippy differential workspace
        run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - name: Wasmtime differential
        run: cargo test --manifest-path differential/Cargo.toml --test simd_conversions -- --nocapture
      - name: Verify fail-closed frontier
        run: cargo test -p wasm-runtime --test simd_conversions relaxed_simd_frontier_remains_fail_closed_at_256
      - name: Create clean candidate
        run: |
          rm -f .conquest/apply_simd_conversions.py .github/workflows/conquest-simd-conversions.yml
          rmdir .conquest 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add SIMD conversion semantics"
          git push origin HEAD:conquest/simd-conversions
