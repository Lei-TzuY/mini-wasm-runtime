name: Conquest 273

on:
  push:
    branches:
      - conquest/relaxed-simd-q15mulr-273

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conquest/relaxed-simd-q15mulr-273
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Construct vertical slice
        run: python tools/conquest_273.py
      - name: Format constructed Rust
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml --all
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - run: cargo fmt --manifest-path differential/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path differential/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_q15mulr
      - name: Publish clean candidate
        run: |
          rm .github/workflows/conquest-273.yml tools/conquest_273.py
          git config user.name LeiZ
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add relaxed SIMD i16x8 q15mulr'
          git push origin HEAD:conquest/relaxed-simd-q15mulr-273
