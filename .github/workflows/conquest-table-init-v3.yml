name: Conquest table init diagnostics

on:
  push:
    branches: [conquest/table-init-elem-drop]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Diagnose and preserve evidence
        shell: bash
        run: |
          set +e
          python3 tools/conquest_table_init.py > /tmp/conquest.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            cargo fmt --all >> /tmp/conquest.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo test --workspace --all-targets >> /tmp/conquest.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo clippy --workspace --all-targets -- -D warnings >> /tmp/conquest.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            cargo doc --workspace --no-deps >> /tmp/conquest.log 2>&1 || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            git restore .
            cp /tmp/conquest.log tools/conquest_table_init.log
            rm -f .github/workflows/conquest-table-init.yml .github/workflows/conquest-table-init-v2.yml .github/workflows/conquest-table-init-v3.yml
            git config user.name "Bill Lei"
            git config user.email "Lei-TzuY@users.noreply.github.com"
            git add -A
            git commit -m "ci: capture table init staging blocker"
            git push origin HEAD:conquest/table-init-elem-drop
            exit 0
          fi
          rm -f .github/workflows/conquest-table-init.yml .github/workflows/conquest-table-init-v2.yml .github/workflows/conquest-table-init-v3.yml tools/conquest_table_init.py
          git config user.name "Bill Lei"
          git config user.email "Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bulk-memory table.init and elem.drop"
          git push origin HEAD:conquest/table-init-elem-drop
