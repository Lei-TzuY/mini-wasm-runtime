name: Conquest correct relaxed SIMD 259
on:
  push:
    branches: [conquest/relaxed-simd-f32x4-madd]
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply correction
        run: python3 tools/conquest_correct_relaxed_259.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Qualify
        run: |
          cargo fmt --all
          cargo fmt --manifest-path differential/Cargo.toml
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo test --manifest-path differential/Cargo.toml --test simd_relaxed_trunc_f64x2_s_zero -- --nocapture
      - name: Commit clean correction
        run: |
          git rm .github/workflows/conquest-correct-relaxed-259.yml tools/conquest_correct_relaxed_259.py
          git add -A
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git commit -m 'fix: implement correct relaxed SIMD opcode 259'
          git push origin HEAD:conquest/relaxed-simd-f32x4-madd
