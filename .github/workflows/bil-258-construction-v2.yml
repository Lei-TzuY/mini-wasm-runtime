name: BIL-258 construction v2
on:
  push:
    branches: [bil-258-multimemory-memarg]
permissions:
  contents: write
jobs:
  construct:
    if: ${{ !contains(github.event.head_commit.message, '[construction-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bil-258-multimemory-memarg
          fetch-depth: 0
      - name: Implement and gate indexed memargs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, pattern, replacement, label, flags=0):
              text2, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return text2

          p = Path('crates/wasm-validator/src/lib.rs')
          s = p.read_text()
          s = one(s, r'''fn read_memarg\(\n    code: &\[u8\],\n    pc: &mut usize,\n    function: usize,\n    offset: usize,\n    maximum_alignment: u32,\n\) -> Result<\(u32, u32\), ValidationError> \{\n    let alignment = read_u32_immediate\(code, pc, function, offset\)\?;\n    let displacement = read_u32_immediate\(code, pc, function, offset\)\?;\n    if alignment > maximum_alignment \{\n        return Err\(ValidationError::InvalidMemoryAlignment \{\n            function,\n            offset,\n            alignment,\n            maximum: maximum_alignment,\n        \}\);\n    \}\n    Ok\(\(alignment, displacement\)\)\n\}''', '''fn read_memarg(
    code: &[u8],
    pc: &mut usize,
    module: &Module,
    function: usize,
    offset: usize,
    maximum_alignment: u32,
) -> Result<(u32, u32, u32), ValidationError> {
    let flags = read_u32_immediate(code, pc, function, offset)?;
    if flags >= 0x80 {
        return Err(ValidationError::InvalidMemoryAlignment {
            function,
            offset,
            alignment: flags,
            maximum: maximum_alignment,
        });
    }
    let (alignment, memory_index) = if flags & 0x40 != 0 {
        (flags & 0x3f, read_u32_immediate(code, pc, function, offset)?)
    } else {
        (flags, 0)
    };
    let displacement = read_u32_immediate(code, pc, function, offset)?;
    if memory_index as usize >= module.memory_count() {
        return Err(ValidationError::MemoryIndexOutOfBounds {
            function,
            offset,
            memory_index,
        });
    }
    if alignment > maximum_alignment {
        return Err(ValidationError::InvalidMemoryAlignment {
            function,
            offset,
            alignment,
            maximum: maximum_alignment,
        });
    }
    Ok((alignment, memory_index, displacement))
}''', 'validator memarg')
          p.write_text(s)

          p = Path('crates/wasm-validator/src/typed.rs')
          s = p.read_text()
          pat = r'(super::read_memarg\(\n\s+code,\n\s+&mut pc,\n)(\s+function,)'
          s, n = re.subn(pat, r'\1                    module,\n\2', s)
          if n != 2:
              raise SystemExit(f'typed memarg calls: expected 2 replacements, got {n}')
          p.write_text(s)

          p = Path('crates/wasm-runtime/src/lib.rs')
          s = p.read_text()
          s = one(s, r'''fn read_memarg\(code: &\[u8\], pc: &mut usize\) -> Result<\(u32, u32\), RuntimeError> \{\n    let alignment = read_u32_immediate\(code, pc\)\?;\n    let displacement = read_u32_immediate\(code, pc\)\?;\n    Ok\(\(alignment, displacement\)\)\n\}''', '''fn read_memarg(code: &[u8], pc: &mut usize) -> Result<(u32, u32, u32), RuntimeError> {
    let flags = read_u32_immediate(code, pc)?;
    if flags >= 0x80 {
        return Err(RuntimeError::ControlInvariant(
            "validated memarg flags exceed the multi-memory encoding range",
        ));
    }
    let (alignment, memory_index) = if flags & 0x40 != 0 {
        (flags & 0x3f, read_u32_immediate(code, pc)?)
    } else {
        (flags, 0)
    };
    let displacement = read_u32_immediate(code, pc)?;
    Ok((alignment, memory_index, displacement))
}''', 'runtime memarg')
          start = s.index('                0x28..=0x35 => {')
          end = s.index('                0x3f => {', start)
          seg = s[start:end]
          old = 'let (_, displacement) = read_memarg(code, &mut pc)?;'
          if seg.count(old) != 2:
              raise SystemExit(f'runtime opcode memargs: expected 2, got {seg.count(old)}')
          seg = seg.replace(old, 'let (_, memory_index, displacement) = read_memarg(code, &mut pc)?;\n                    ensure_runtime_memory_index(self, memory_index)?;')
          seg = seg.replace('self.with_memory(|memory|', 'self.with_memory_index(memory_index, |memory|')
          seg = seg.replace('self.with_memory_mut(|memory|', 'self.with_memory_index_mut(memory_index, |memory|')
          s = s[:start] + seg + s[end:]
          p.write_text(s)

          Path('crates/wasm-runtime/tests/multi_memory_memarg.rs').write_text(r'''use wasm_parser::parse_module;
use wasm_runtime::{HostRegistry, Instance, MemoryHandle, RuntimeError, Value};
use wasm_validator::ValidationError;

fn u32leb(out: &mut Vec<u8>, mut value: u32) {
    loop {
        let mut b = (value & 0x7f) as u8;
        value >>= 7;
        if value != 0 { b |= 0x80; }
        out.push(b);
        if value == 0 { break; }
    }
}
fn name(out: &mut Vec<u8>, s: &str) { u32leb(out, s.len() as u32); out.extend_from_slice(s.as_bytes()); }
fn section(m: &mut Vec<u8>, id: u8, p: &[u8]) { m.push(id); u32leb(m, p.len() as u32); m.extend_from_slice(p); }
fn header() -> Vec<u8> { b"\0asm\x01\0\0\0".to_vec() }
fn code_section(body: &[u8]) -> Vec<u8> { let mut p=vec![1]; u32leb(&mut p,(body.len()+1) as u32); p.push(0); p.extend_from_slice(body); p }
fn two_defined(body: &[u8], params: &[u8], results: &[u8]) -> Vec<u8> {
    let mut m=header(); let mut t=vec![1,0x60,params.len() as u8]; t.extend_from_slice(params); t.push(results.len() as u8); t.extend_from_slice(results);
    section(&mut m,1,&t); section(&mut m,3,&[1,0]); section(&mut m,5,&[2,0,1,0,1]); section(&mut m,7,&[1,3,b'r',b'u',b'n',0,0]); section(&mut m,10,&code_section(body)); m
}
fn imported_defined(body: &[u8]) -> Vec<u8> {
    let mut m=header(); section(&mut m,1,&[1,0x60,0,1,0x7f]); let mut i=vec![1]; name(&mut i,"env"); name(&mut i,"mem"); i.extend([2,0,1]); section(&mut m,2,&i);
    section(&mut m,3,&[1,0]); section(&mut m,5,&[1,0,1]); section(&mut m,7,&[1,3,b'r',b'u',b'n',0,0]); section(&mut m,10,&code_section(body)); m
}

#[test]
fn indexed_store_and_load_use_second_defined_memory() {
    let b=[0x41,0,0x41,11,0x36,0x02,0, 0x41,0,0x41,42,0x36,0x42,1,0, 0x41,0,0x28,0x42,1,0,0x0b];
    let mut vm=Instance::new(parse_module(&two_defined(&b,&[],&[0x7f])).unwrap()).unwrap();
    assert_eq!(vm.invoke_export("run",&[]).unwrap(),Some(Value::I32(42))); assert_eq!(&vm.memory().unwrap().bytes()[..4],&11i32.to_le_bytes());
}
#[test]
fn legacy_memarg_still_uses_memory_zero() {
    let b=[0x41,0,0x41,21,0x36,0x02,0,0x41,0,0x28,0x02,0,0x0b]; let mut vm=Instance::new(parse_module(&two_defined(&b,&[],&[0x7f])).unwrap()).unwrap();
    assert_eq!(vm.invoke_export("run",&[]).unwrap(),Some(Value::I32(21)));
}
#[test]
fn imported_memory_precedes_indexed_defined_memory() {
    let b=[0x41,0,0x41,42,0x36,0x42,1,0,0x41,0,0x28,0x42,1,0,0x0b]; let imported=MemoryHandle::new(1,None).unwrap(); let mut h=HostRegistry::new(); h.register_memory("env","mem",imported.clone()).unwrap();
    let mut vm=Instance::with_hosts(parse_module(&imported_defined(&b)).unwrap(),h).unwrap(); assert_eq!(vm.invoke_export("run",&[]).unwrap(),Some(Value::I32(42))); assert_eq!(imported.read(0,4).unwrap(),vec![0,0,0,0]);
}
#[test]
fn invalid_indexed_memarg_is_rejected() {
    let b=[0x41,0,0x28,0x42,2,0,0x0b]; let m=parse_module(&two_defined(&b,&[],&[0x7f])).unwrap();
    assert!(matches!(Instance::new(m),Err(RuntimeError::Validation(ValidationError::MemoryIndexOutOfBounds{memory_index:2,..}))));
}
#[test]
fn indexed_memarg_preserves_oob_trap() {
    let b=[0x20,0,0x41,42,0x36,0x42,1,0,0x41,0,0x0b]; let mut vm=Instance::new(parse_module(&two_defined(&b,&[0x7f],&[0x7f])).unwrap()).unwrap();
    assert!(matches!(vm.invoke_export("run",&[Value::I32(65_535)]),Err(RuntimeError::MemoryOutOfBounds{width:4,..})));
}
''')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add crates/wasm-validator/src/lib.rs crates/wasm-validator/src/typed.rs crates/wasm-runtime/src/lib.rs crates/wasm-runtime/tests/multi_memory_memarg.rs
          git commit -m 'feat: add indexed multi-memory load/store memargs [construction-result]'
          git push origin HEAD:bil-258-multimemory-memarg
