name: Benchmark smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format benchmark workspace
        run: cargo fmt --manifest-path benchmarks/Cargo.toml -- --check
      - name: Clippy benchmark workspace
        run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
      - name: Test benchmark policy
        run: cargo test --manifest-path benchmarks/Cargo.toml
      - name: Run benchmark smoke
        run: cargo run --release --manifest-path benchmarks/Cargo.toml -- --iterations 32 --warmup 4
