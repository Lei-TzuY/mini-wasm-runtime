          old = '''    data_segments: Vec<Vec<u8>>,
    table: Option<TableHandle>,
'''
          new = '''    data_segments: Vec<Vec<u8>>,
    element_segments: Vec<Vec<u32>>,
    table: Option<TableHandle>,
'''
          text = replace_once(text, old, new, 'instance element storage')

          old = '''        let identity = Rc::new(());
        let table = instantiate_table(&module, &hosts, &identity)?;
'''
