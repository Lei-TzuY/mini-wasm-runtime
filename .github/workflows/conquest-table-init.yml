                            self.elem_drop(element_index)?;
                        }
'''
          text = replace_once(text, old2, new2, 'interpreter table ops')

          old = '''                    11 => {
                        let _ = read_u32_immediate(code, &mut pc)?;
                    }
'''
          new = old + '''                    12 => {
                        let _ = read_u32_immediate(code, &mut pc)?;
                        let _ = read_u32_immediate(code, &mut pc)?;
                    }
                    13 => {
                        let _ = read_u32_immediate(code, &mut pc)?;
