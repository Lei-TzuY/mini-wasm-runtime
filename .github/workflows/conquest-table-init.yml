          tests = Path('crates/wasm-runtime/tests/bulk_table_init_drop.rs')
          tests.write_text(r'''use wasm_parser::parse_module;
use wasm_runtime::{HostRegistry, Instance, RuntimeError, TableHandle};
use wasm_validator::ValidationError;

fn push_u32(bytes: &mut Vec<u8>, mut value: u32) {
    loop {
        let mut byte = (value & 0x7f) as u8;
        value >>= 7;
        if value != 0 { byte |= 0x80; }
        bytes.push(byte);
        if value == 0 { break; }
    }
}

fn push_name(bytes: &mut Vec<u8>, name: &str) {
    push_u32(bytes, name.len() as u32);
    bytes.extend_from_slice(name.as_bytes());
}

fn section(module: &mut Vec<u8>, id: u8, payload: &[u8]) {
    module.push(id);
    push_u32(module, payload.len() as u32);
    module.extend_from_slice(payload);
}

fn module(body: &[u8], element_index: u8, table_index: u8) -> Vec<u8> {
    let mut wasm = b"\0asm\x01\0\0\0".to_vec();
    section(&mut wasm, 1, &[1, 0x60, 0, 0]);
    let mut imports = vec![1];
    push_name(&mut imports, "env");
    push_name(&mut imports, "tab");
    imports.extend([0x01, 0x70, 0x00, 0x02]);
    section(&mut wasm, 2, &imports);
    section(&mut wasm, 3, &[1, 0]);
    section(&mut wasm, 7, &[1, 3, b'r', b'u', b'n', 0, 0]);
    section(&mut wasm, 9, &[1, 1, 0, 1, 0]);
    let mut code = vec![1, (body.len() + 1) as u8, 0];
    code.extend_from_slice(body);
    section(&mut wasm, 10, &code);
    let _ = (element_index, table_index);
    wasm
}

fn hosts(table: &TableHandle) -> HostRegistry {
    let mut hosts = HostRegistry::new();
    hosts.register_table("env", "tab", table.clone()).unwrap();
    hosts
}

#[test]
fn table_init_populates_imported_table() {
    let body = [0x41, 0, 0x41, 0, 0x41, 1, 0xfc, 12, 0, 0, 0x0b];
    let table = TableHandle::new(2, Some(2)).unwrap();
    let mut vm = Instance::with_hosts(parse_module(&module(&body, 0, 0)).unwrap(), hosts(&table)).unwrap();
    vm.invoke_export("run", &[]).unwrap();
    assert!(table.get(0).unwrap().is_some());
    assert!(table.get(1).unwrap().is_none());
}

#[test]
fn elem_drop_makes_followup_nonempty_init_trap_without_mutation() {
    let body = [0xfc, 13, 0, 0x41, 0, 0x41, 0, 0x41, 1, 0xfc, 12, 0, 0, 0x0b];
    let table = TableHandle::new(2, Some(2)).unwrap();
    let mut vm = Instance::with_hosts(parse_module(&module(&body, 0, 0)).unwrap(), hosts(&table)).unwrap();
    assert!(matches!(
        vm.invoke_export("run", &[]),
        Err(RuntimeError::ElementSegmentSourceOutOfBounds { .. })
    ));
    assert!(table.get(0).unwrap().is_none());
}

#[test]
fn destination_oob_is_atomic() {
    let body = [0x41, 2, 0x41, 0, 0x41, 1, 0xfc, 12, 0, 0, 0x0b];
    let table = TableHandle::new(2, Some(2)).unwrap();
    let mut vm = Instance::with_hosts(parse_module(&module(&body, 0, 0)).unwrap(), hosts(&table)).unwrap();
    assert!(matches!(
        vm.invoke_export("run", &[]),
        Err(RuntimeError::TableElementOutOfBounds(_))
    ));
    assert!(table.get(0).unwrap().is_none());
    assert!(table.get(1).unwrap().is_none());
}

#[test]
fn validator_rejects_bad_element_index() {
    let body = [0x41, 0, 0x41, 0, 0x41, 0, 0xfc, 12, 1, 0, 0x0b];
    let table = TableHandle::new(2, Some(2)).unwrap();
    assert!(matches!(
        Instance::with_hosts(parse_module(&module(&body, 1, 0)).unwrap(), hosts(&table)),
        Err(RuntimeError::Validation(ValidationError::ElementIndexOutOfBounds {
            element_index: 1,
            ..
        }))
    ));
}

#[test]
fn validator_rejects_bad_table_index() {
    let body = [0x41, 0, 0x41, 0, 0x41, 0, 0xfc, 12, 0, 1, 0x0b];
    let table = TableHandle::new(2, Some(2)).unwrap();
    assert!(matches!(
        Instance::with_hosts(parse_module(&module(&body, 0, 1)).unwrap(), hosts(&table)),
        Err(RuntimeError::Validation(ValidationError::TableIndexOutOfBounds {
            table_index: 1,
            ..
        }))
    ));
}
