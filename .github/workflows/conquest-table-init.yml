          # Insert table ops after memory.fill (11) so numeric/memory ordering remains spec-shaped.
          old2 = '''                        11 => {
                            let memory_index = read_u32_immediate(code, &mut pc)?;
                            ensure_runtime_memory_index(self, memory_index)?;
