'''
          text = replace_once(text, old, new, 'control predecode table ops')
          runtime.write_text(text)

          validator = Path('crates/wasm-validator/src/lib.rs')
          text = validator.read_text()
          old = '''    DataIndexOutOfBounds {
        function: usize,
        offset: usize,
        data_index: u32,
    },
'''
          new = old + '''    ElementIndexOutOfBounds {
        function: usize,
        offset: usize,
        element_index: u32,
    },
'''
          text = replace_once(text, old, new, 'validator element error')
          old = '''            Self::DataIndexOutOfBounds { function, offset, data_index } => write!(
                f,
                "function {function} bulk-memory instruction at byte {offset} refers to missing data segment {data_index}"
            ),
'''
          new = old + '''            Self::ElementIndexOutOfBounds {
                function,
                offset,
                element_index,
            } => write!(
                f,
                "function {function} bulk-memory instruction at byte {offset} refers to missing element segment {element_index}"
            ),
'''
