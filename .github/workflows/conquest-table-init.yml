                ElementMode::Active { .. } | ElementMode::Declarative => Vec::new(),
            })
            .collect();
        let identity = Rc::new(());
        let table = instantiate_table(&module, &hosts, &identity)?;
'''
          text = replace_once(text, old, new, 'element storage construction')

          old = '''            data_segments,
            table,
'''
          new = '''            data_segments,
            element_segments,
            table,
'''
          text = replace_once(text, old, new, 'instance init element storage')

