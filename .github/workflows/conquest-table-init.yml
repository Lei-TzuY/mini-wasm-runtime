name: Conquest table.init + elem.drop staging

on:
  push:
    branches:
      - conquest/table-init-elem-drop

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement vertical slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"anchor missing: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique: {label} ({text.count(old)})")
              return text.replace(old, new, 1)

          runtime = Path('crates/wasm-runtime/src/lib.rs')
          text = runtime.read_text()

