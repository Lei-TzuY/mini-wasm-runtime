[workspace]
members = ["."]
resolver = "2"

[package]
name = "mini-wasm-differential"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wasm-parser = { path = "../crates/wasm-parser" }
wasm-runtime = { path = "../crates/wasm-runtime" }
wasm-wasi = { path = "../crates/wasm-wasi" }
wasmtime = "=37.0.3"
wasmtime-wasi = { version = "=37.0.3", default-features = false, features = ["p1"] }
wat = "=1.257.1"

[lints.rust]
unsafe_code = "forbid"
